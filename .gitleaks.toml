# gitleaks configuration. Extends the default ruleset with allowlist
# entries for known test fixtures so CI doesn't flag them as leaks.
#
# Real secrets (cloud-provider keys, GitHub PATs, JWTs, generic
# high-entropy strings) still trigger findings; only the literal
# fixtures below are suppressed.
#
# When adding a new test that hardcodes a fake-looking token, add it
# here rather than disabling gitleaks. See AGENTS.md "Secrets scan".

[extend]
useDefault = true

[allowlist]
description = "adamdaniel.ai test fixtures"
paths = [
  # Admin-reviews specs hardcode a fake GitHub PAT to drive the auth
  # flow without touching the real OAuth proxy.
  '''e2e/admin-reviews-(auth|stats)\.spec\.js''',
  # skills.lock is generated by agentskills' scripts/generate_skills_lock.py
  # and holds nothing but an OWNER/REPO, a 40-hex commit, skill names, and a
  # sha256 per skill directory. gitleaks' generic-api-key rule fires on one
  # line of it — not because the digest is a secret, but because the rule
  # looks for a secret-ish KEYWORD near a high-entropy value, and the skill is
  # named `cms-platform-secrets`. Its digest is a hash of public files in a
  # public repo.
  #
  # Suppressing the whole file rather than that one line is safe because the
  # file's shape is not a matter of trust: the hook refuses a lock whose
  # fields don't validate, and `generate_skills_lock.py --check` fails if the
  # committed bytes are not exactly what the generator produces for the ref it
  # pins — so a hand-edited lock cannot survive either gate.
  '''^skills\.lock$''',
]
regexes = [
  # Belt-and-braces: any ghp_*test*/ghp_*fake* literal anywhere.
  '''ghp_(test|fake)[A-Za-z0-9_]*''',
]
