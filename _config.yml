title: Adam Daniel
description: Freelance AI Engineer — building intelligent systems
url: "https://adamdaniel.ai"
baseurl: ""
author:
  name: Adam Daniel
  email: adam@adamdaniel.ai

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /blog/:slug/

# Collections
collections:
  projects:
    output: false  # Set to true to restore individual /projects/<slug>/ pages.
    permalink: /projects/:slug/
  tags:
    output: true
    permalink: /tags/:slug/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
      type: "tags"
    values:
      layout: "tag"
  - scope:
      path: "pages"
    values:
      layout: "page"

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

# Analytics. Production-only; the snippet is emitted only when JEKYLL_ENV is
# `production` AND app_monitor_id is non-empty. Populate from the CloudFormation
# outputs in `infrastructure/rum/template.yaml` after deploying that stack.
analytics:
  cloudwatch_rum:
    app_monitor_id: ""
    identity_pool_id: ""
    region: "us-east-1"

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - oauth-proxy
  - "*.sh"
  - vendor
  - package.json
  - package-lock.json
  - playwright.config.js
  - playwright.regression.config.js
  - e2e
  - docs
