title: Adam Daniel
description: Freelance AI Engineer — building intelligent systems
url: "https://adamdaniel.ai"
baseurl: ""
author:
  name: Adam Daniel
  email: adam@adamdaniel.ai

# Theme. Layouts/includes/assets are vendored in by the cms-platform theme
# gem (pinned in the Gemfile + platform.lock). Local files under _layouts /
# _includes still override the gem's where present.
theme: cms-platform-theme

# CMS (Decap) wiring. The admin/ config is generated from these by the
# platform's admin tooling; keep them in sync with the live OAuth proxy.
cms:
  repository: Adam-S-Daniel/adamdaniel.ai
  oauth_base_url: https://sq8d4876v8.execute-api.us-east-1.amazonaws.com

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /blog/:slug/
# Build future-dated posts. This site does NOT schedule via future dates
# — scheduling is `published: false` + `publish_date` flipped to true by
# scripts/publish_scheduled_posts.py once due (so a not-yet-due post stays
# `published: false` and Jekyll skips it regardless of this flag). The
# ONLY future-dated posts are the prod-mutation / media-roundtrip e2e
# canaries (`_posts/2099-*`, `test_fixture: true`), which are
# `published: false` at baseline (skipped) and only build when a loop spec
# flips them to `published: true` to verify the publish→deploy→URL chain.
# With Jekyll's default `future: false`, those canaries were SKIPPED even
# when published — so /blog/e2e-mutation-canary/ 404'd forever and the
# spec's URL-reflect wait timed out every run (the real root cause behind
# #1723's "Cat 1" prod-mutate/media reflect-timeouts, misread as a deploy
# backlog). `test_fixture: true` posts are excluded from the homepage /
# blog index (index.html, blog/index.html) so a published canary serves
# only at its direct URL for the spec, not in human-facing listings.
future: true

# Collections
collections:
  projects:
    output: false  # Set to true to restore individual /projects/<slug>/ pages.
    permalink: /projects/:slug/
  # Tools — small self-contained interactive things (each entry embeds a
  # static app from /assets/tools/<slug>/). Listed at /tools/, individual
  # pages at /tools/<slug>/. Editable in the CMS via admin/collections.site.yml.
  tools:
    output: true
    permalink: /tools/:slug/
  tags:
    output: true
    permalink: /tags/:slug/
  # E2E canary collection. Reserved for the automated publish-loop tests
  # (e2e/cms-publish-loop*.spec.js). Each entry has a stable, unadvertised
  # public URL the tests can drive admin actions against and assert on.
  # Excluded from listings, the site feed, the tag archives, and sitemap.
  e2e:
    output: true
    permalink: /e2e/:slug/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
      type: "tools"
    values:
      layout: "tool"
  - scope:
      path: ""
      type: "tags"
    values:
      layout: "tag"
  - scope:
      path: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "e2e"
    values:
      layout: "canary"
      sitemap: false
      robots: "noindex,nofollow"

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

# Analytics. Production-only; the snippet is emitted only when JEKYLL_ENV is
# `production` AND app_monitor_id is non-empty. Populate from the CloudFormation
# outputs in `infrastructure/rum/template.yaml` after deploying that stack.
analytics:
  cloudwatch_rum:
    app_monitor_id: "4e93b4d4-3e43-4905-85aa-c4db00998c26"
    identity_pool_id: "us-east-1:72e4fbc1-8512-4b03-a159-499411e45c1c"
    region: "us-east-1"

# Exclude from build. Anything that's tooling, infra-as-code, repo
# docs, or dev-only artefacts should land here — `_site/` is mirrored
# verbatim to S3 (prod + every PR preview), so each unneeded file is a
# pointless public URL.
# Gem-shipped admin assets are copied into _site/admin by the post_write render
# hook (not generated by Jekyll), so Jekyll's cleanup phase would delete them each
# build (incl. the in-test rebuilds @admin-write specs run) — a TOCTOU the e2e
# admin link-crawler HEADs into (transient 404). keep_files spares _site/admin
# from cleanup (cms-platform #76 / #1815 admin-crawler flake).
keep_files:
  - admin

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - oauth-proxy
  - "*.sh"
  - vendor
  - package.json
  - package-lock.json
  - e2e
  # The cms-platform e2e lane checks the platform out into .cms-platform/.
  # It's not site content and is dot-prefixed (Jekyll ignores it by default);
  # listing it is explicit so it can never pollute _site or the e2e specs.
  - .cms-platform
  - platform.lock
  - admin/README.md
  - admin/collections.site.yml.example
  - docs
  # Repo docs / READMEs — meant for GitHub, not the apex domain.
  - AGENTS.md
  - ANALYTICS_SETUP.md
  - CLAUDE.md
  - README.md
  # CloudFormation + Python project metadata — infra-as-code, no
  # business being served from the CDN.
  - infrastructure
  - pyproject.toml
  # Dev scripts (build, bootstrap, helpers). `*.sh` is already covered
  # above; this catches the `.js`/`.py`/`.ps1` siblings.
  - scripts
  # Python test harness + fixtures.
  - tests
  # Visual-regression showcase artefacts (peak screenshots + .webm).
  # Generated by scripts/generate-showcase.js for repo browsers; not
  # linked from any rendered page.
  - recordings
# Intentionally inert line (no functional effect).
