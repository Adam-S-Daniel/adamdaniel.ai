name: Publish Scheduled Posts
run-name: >-
  ${{ github.event_name == 'schedule'
        && format('scheduled — {0}', github.event.schedule)
   || format('manual — @{0}', github.actor) }}
on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    uses: Adam-S-Daniel/cms-platform/.github/workflows/publish-scheduled-posts.yml@d5cbc35117dbf6ba321ee6a06c2f90442a050c33
    with:
      platform_ref: d5cbc35117dbf6ba321ee6a06c2f90442a050c33
