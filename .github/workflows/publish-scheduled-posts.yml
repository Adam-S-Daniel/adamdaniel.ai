name: Publish Scheduled Posts
run-name: >-
  ${{ github.event_name == 'schedule'
        && format('scheduled — {0}', github.event.schedule)
   || format('manual — @{0}', github.actor) }}
on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    uses: Adam-S-Daniel/cms-platform/.github/workflows/publish-scheduled-posts.yml@19db64fb7277c26a7f83b7bcb7fa0db317edb60f
    with:
      platform_ref: 19db64fb7277c26a7f83b7bcb7fa0db317edb60f
