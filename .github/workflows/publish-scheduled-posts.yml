name: Publish Scheduled Posts

# Runs once a day to check whether any post's publish_date has arrived.
# When posts are published, the resulting push to main triggers the
# normal Deploy to Production workflow automatically.
on:
  schedule:
    # 14:00 UTC = 9am ET in winter (EST), 10am ET in summer (EDT).
    # Targets the start of the US professional workday, slanted toward
    # the East Coast — late enough that scheduled posts are live before
    # most people open LinkedIn / RSS / email, early enough that the
    # social-feed algorithms have the morning to surface them. GitHub
    # cron can't track DST, so the run-time drifts by an hour twice a
    # year; either edge of that band still lands inside the 8–10am ET
    # sweet spot for professional engagement.
    - cron: '0 14 * * *'
  workflow_dispatch:        # allow manual runs from the Actions UI

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (2026-01-09)
        with:
          # Use the default GITHUB_TOKEN; the push below will trigger
          # deploy-production.yml via the standard push event.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check and publish due posts
        id: check
        run: python3 scripts/publish_scheduled_posts.py

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts/
          git commit -m "chore: auto-publish ${{ steps.check.outputs.count }} scheduled post(s)"
          git push origin main
