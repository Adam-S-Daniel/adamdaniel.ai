name: Deploy Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    # Skip when the PR can't change Jekyll output and doesn't touch
    # this workflow or the patch-preview-config script. Same shape as
    # e2e-tests.yml's paths-ignore: docs and tooling that don't affect
    # what gets served from the preview bucket.
    #
    # `closed` semantics: when paths-ignore matches the PR's net
    # base..head diff, the workflow doesn't fire on close either —
    # but a doc-only PR also never built a preview, so there's
    # nothing to tear down. (A PR that revert-collapses back to
    # doc-only at close would orphan S3 files; in practice nobody
    # does that, and the next teardown sweep would still catch it.)
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'ANALYTICS_SETUP.md'
      - 'docs/**'
      - '.agents/**'
      - '.github/rulesets/**'
      - 'e2e/**'
      - 'screenshots/**'
      - 'recordings/**'
      - 'test-results/**'
      - 'playwright.config.js'
      - 'playwright.regression.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'LICENSE'
      - '.gitignore'
      - '.gitleaks.toml'
      - '.editorconfig'
      - '.bundle/**'
      - '_plugins_test/**'
      - 'oauth-proxy/**'
      - 'infrastructure/**'
      - 'tests/**'
      - '.github/dependabot.yml'
      - '.github/workflows/cms-editorial-workflow.yml'
      - '.github/workflows/cms-publish-loop-prod.yml'
      - '.github/workflows/canary-prod.yml'
      - '.github/workflows/claude.yml'
      - '.github/workflows/dependabot-auto-merge.yml'
      - '.github/workflows/deploy-production.yml'
      - '.github/workflows/e2e-tests.yml'
      - '.github/workflows/publish-scheduled-posts.yml'
      - '.github/workflows/regenerate-manual.yml'
      - '.github/workflows/secrets-scan.yml'
      - '.github/workflows/skills-mirror.yml'
      - '.github/workflows/visual-regression.yml'

permissions:
  contents: read
  pull-requests: write  # to post the preview URL comment
  id-token: write
  # GitHub Deployments registration so Decap CMS's "Deploy Preview Links"
  # spinner (https://decapcms.org/docs/deploy-preview-links/) can find
  # the preview URL for each PR. Without this, the editor toolbar shows
  # a perpetual "looking for preview" spinner — Decap polls
  # /repos/.../deployments?ref=<pr-head>, never finds a deployment with
  # state=success + a target_url, gives up.
  deployments: write

jobs:
  # ────────────────────────────────────────────────────────────
  # Build & Deploy preview (on open / update)
  # ────────────────────────────────────────────────────────────
  deploy-preview:
    # Dependabot PRs can't access the OIDC role secret, and the
    # preview is for a human reviewer to look at — Dependabot PRs are
    # unattended by design. Skip both the deploy and teardown jobs.
    if: github.event.action != 'closed' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      PREVIEW_BUCKET: adamdaniel-ai-previews
      APEX_DOMAIN: adamdaniel.ai
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.PREVIEW_CLOUDFRONT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (2026-01-09)
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Compute CMS slug (cms/<col>/<entry> → <col>-<entry>)
        id: cms_slug
        # Decap-opened editorial PRs land on `cms/<collection>/<slug>`
        # head refs. Translate that to a DNS-safe slug so we can publish
        # an additional `preview-cms-<slug>.adamdaniel.ai` preview that
        # survives Decap closing & re-opening a PR for the same entry
        # (the pr-<N> URL doesn't — N changes; the cms-<slug> URL
        # doesn't — the entry path is stable). The CloudFront router
        # under infrastructure/bootstrap/template.yaml maps the host to
        # the matching S3 prefix; see docs/preview-pr-ruleset-spike.md.
        #
        # Output `slug=` is empty for non-cms branches; downstream steps
        # gate on `slug != ''` to skip the second sync/registration on
        # regular code PRs.
        run: |
          set -euo pipefail
          BRANCH='${{ github.event.pull_request.head.ref }}'
          if [[ "$BRANCH" == cms/* ]]; then
            # Replace `/` with `-`. Lowercase is enforced by Decap's
            # slug template, not by us — the CloudFront router's regex
            # only matches `[a-z0-9-]`, so any uppercase surfaces as a
            # 404 (visibly broken, by design — fail loudly rather than
            # silently route to the wrong S3 prefix).
            SLUG=$(printf '%s' "$BRANCH" | sed -E 's|^cms/||; s|/|-|g')
            echo "slug=${SLUG}" >> "$GITHUB_OUTPUT"
            echo "Computed CMS slug: ${SLUG}"
          else
            echo "slug=" >> "$GITHUB_OUTPUT"
            echo "Not a cms/* branch — skipping per-slug preview"
          fi

      - name: Setup Ruby
        uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f  # v1.306.0 (2026-04-26)
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build Jekyll (preview mode)
        env:
          JEKYLL_ENV: preview
        # Build with no --baseurl: each PR serves from its own subdomain
        # (preview-prN.adamdaniel.ai), so pages use root-relative URLs
        # identical to production. S3 still stores the bucket at pr-N/
        # prefix; the CloudFront Function on the preview distribution
        # maps host → S3 prefix transparently.
        run: |
          bundle exec jekyll build --destination ./_site_preview

      - name: Patch CMS config for preview deployment
        # admin/config.yml is checked into git with production values. See
        # scripts/patch-preview-config.sh for the detailed rationale on each
        # field that changes per preview deploy.
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          BRANCH='${{ github.event.pull_request.head.ref }}'
          CONFIG=./_site_preview/admin/config.yml
          PREVIEW_HOST="preview-pr${PR_NUMBER}.${APEX_DOMAIN}"

          ./scripts/patch-preview-config.sh \
            "$CONFIG" \
            "$PR_NUMBER" \
            "$BRANCH" \
            "$PREVIEW_HOST"

          echo "--- Patched admin/config.yml ---"
          grep -E "^(site_url|display_url):|^  branch:|preview_path:" "$CONFIG"

      - name: Write deploy-time commit metadata
        # admin/index.html and admin/index-local.html load this JSON to
        # render a commit pill in the top-right of the admin shell, linked
        # to the GitHub commit page. Editors use it to confirm which build
        # of the admin they're looking at.
        #
        # Use the PR head SHA (which is in the checkout) rather than
        # github.sha — the latter is a synthesised merge commit on
        # pull_request events and isn't in the shallow clone, which made
        # `git log -1 --format=%cI ${github.sha}` fail with `bad object`.
        run: |
          mkdir -p ./_site_preview/admin
          SHA="${{ github.event.pull_request.head.sha }}"
          ISO=$(git log -1 --format=%cI HEAD)
          cat > ./_site_preview/admin/commit.json <<JSON
          { "sha": "${SHA}", "iso": "${ISO}", "branch": "${{ github.event.pull_request.head.ref }}" }
          JSON
          cat ./_site_preview/admin/commit.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885  # v6.1.1 (2026-05-05)
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Sync to S3
        # See deploy-production.yml's "Sync to S3" step for the
        # `--exclude` rationale: the local-dev / e2e-test admin shells
        # have to stay in `_site_preview/` for the local Playwright
        # suite but never need to be public.
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          aws s3 sync ./_site_preview \
            "s3://${PREVIEW_BUCKET}/pr-${PR_NUMBER}/" \
            --delete \
            --cache-control "no-cache, must-revalidate" \
            --exclude 'admin/index-local.html' \
            --exclude 'admin/config-local.yml' \
            --exclude 'admin/index-test.html' \
            --exclude 'admin/config-test.yml'

      - name: Sync to S3 — per-CMS-slug alias
        if: steps.cms_slug.outputs.slug != ''
        # The pr-<N> sync above is already done — this is an additional
        # alias keyed on the CMS entry's slug rather than the GH PR
        # number. Same files; CloudFront routes the right subdomain to
        # the right prefix. No --delete on a "second" sync would orphan
        # files when an entry shrinks; we still --delete here so the
        # alias matches pr-<N> exactly. Same --exclude set as the
        # primary sync — keep the two in lockstep.
        run: |
          SLUG='${{ steps.cms_slug.outputs.slug }}'
          aws s3 sync ./_site_preview \
            "s3://${PREVIEW_BUCKET}/cms-${SLUG}/" \
            --delete \
            --cache-control "no-cache, must-revalidate" \
            --exclude 'admin/index-local.html' \
            --exclude 'admin/config-local.yml' \
            --exclude 'admin/index-test.html' \
            --exclude 'admin/config-test.yml'

      - name: Invalidate CloudFront cache
        if: env.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          SLUG='${{ steps.cms_slug.outputs.slug }}'
          # Combine PR-number + (optional) cms-slug invalidations into a
          # single CloudFront create-invalidation call — invalidation
          # requests are quota'd per month, so batching these saves
          # quota even when both prefixes need flushing.
          PATHS=("/pr-${PR_NUMBER}/*")
          if [[ -n "$SLUG" ]]; then
            PATHS+=("/cms-${SLUG}/*")
          fi
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "${PATHS[@]}"

      - name: Register GitHub Deployment for the preview URL
        # Decap CMS's "Deploy Preview Links" feature
        # (https://decapcms.org/docs/deploy-preview-links/) shows a
        # spinner in the editor toolbar that polls
        # `/repos/.../deployments?ref=<pr-head>` and surfaces the
        # `environment_url` of the most recent successful deployment as
        # the "Preview" link. Without this step the spinner never
        # resolves — the only deployment that exists for the PR is
        # `regression-review` from visual-regression.yml (which is
        # gated on a manual-approval Environment and never has a
        # target_url).
        #
        # Environment is named `preview-pr-<N>` so each PR gets its own
        # GH Environment row in the UI. The two-step create + status
        # pattern is the documented one for marking the deployment
        # `success` with the target URL.
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0 (2026-04-09)
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const pr = process.env.PR_NUMBER;
            const sha = process.env.PR_HEAD_SHA;
            const apex = process.env.APEX_DOMAIN;
            const cfId = process.env.CLOUDFRONT_DISTRIBUTION_ID;
            const bucket = process.env.PREVIEW_BUCKET;
            const region = process.env.AWS_REGION;

            const url = cfId
              ? `https://preview-pr${pr}.${apex}/`
              : `http://${bucket}.s3-website-${region}.amazonaws.com/pr-${pr}/`;

            // Step 1: create the deployment. `auto_merge: false` and
            // `required_contexts: []` skip GitHub's deploy-gating
            // checks — the actual deploy already happened above; this
            // call is purely metadata for Decap's polling.
            // `transient_environment: true` so GitHub's Environments
            // UI tags it as ephemeral.
            const { data: deployment } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              environment: `preview-pr-${pr}`,
              auto_merge: false,
              required_contexts: [],
              transient_environment: true,
              production_environment: false,
              description: 'PR preview',
            });

            // Step 2: mark it `success` with the URL Decap picks up.
            // `log_url` is the workflow run for one-click debugging
            // from the GitHub Environments UI.
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.id,
              state: 'success',
              environment_url: url,
              log_url: runUrl,
              description: `Preview live at ${url}`,
            });

            core.notice(`Registered deployment ${deployment.id} → ${url}`);

      - name: Register GitHub Deployment for the per-CMS-slug preview
        if: steps.cms_slug.outputs.slug != ''
        # Mirror of the registration above, scoped to the cms-<slug>
        # alias. Each preview environment gets its own GH Environment
        # row; both register `success` immediately because the deploy
        # already happened. Decap's deploy-preview-links integration
        # picks the most recent successful deployment for the PR's
        # head SHA, so the cms-<slug> URL surfaces as the "Preview"
        # link in the editor toolbar in addition to (and stable across
        # PR cycles, unlike) the pr-<N> URL.
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0 (2026-04-09)
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CMS_SLUG: ${{ steps.cms_slug.outputs.slug }}
        with:
          script: |
            const sha = process.env.PR_HEAD_SHA;
            const apex = process.env.APEX_DOMAIN;
            const cfId = process.env.CLOUDFRONT_DISTRIBUTION_ID;
            const bucket = process.env.PREVIEW_BUCKET;
            const region = process.env.AWS_REGION;
            const slug = process.env.CMS_SLUG;

            const url = cfId
              ? `https://preview-cms-${slug}.${apex}/`
              : `http://${bucket}.s3-website-${region}.amazonaws.com/cms-${slug}/`;

            const { data: deployment } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              environment: `preview-cms-${slug}`,
              auto_merge: false,
              required_contexts: [],
              transient_environment: true,
              production_environment: false,
              description: 'Per-CMS-entry preview alias',
            });

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.id,
              state: 'success',
              environment_url: url,
              log_url: runUrl,
              description: `Per-slug preview live at ${url}`,
            });

            core.notice(`Registered cms-slug deployment ${deployment.id} → ${url}`);

      - name: Post preview URL comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0 (2026-04-09)
        env:
          CMS_SLUG: ${{ steps.cms_slug.outputs.slug }}
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const apex = process.env.APEX_DOMAIN;
            const cfId = process.env.CLOUDFRONT_DISTRIBUTION_ID;
            const bucket = process.env.PREVIEW_BUCKET;
            const region = process.env.AWS_REGION;
            const slug = process.env.CMS_SLUG;

            // Subdomain-per-PR when CloudFront is set up (wildcard cert +
            // Function handles host → S3 prefix). Fall back to the raw S3
            // website endpoint (with /pr-N/ path) for accounts that haven't
            // provisioned the preview distribution yet.
            const url = cfId
              ? `https://preview-pr${pr}.${apex}/`
              : `http://${bucket}.s3-website-${region}.amazonaws.com/pr-${pr}/`;

            // For Decap-opened PRs (head ref `cms/<col>/<entry>`),
            // also surface the slug-derived alias so editors can
            // bookmark a URL that doesn't change when Decap closes
            // and re-opens a PR for the same entry.
            const cmsUrl = slug
              ? (cfId
                ? `https://preview-cms-${slug}.${apex}/`
                : `http://${bucket}.s3-website-${region}.amazonaws.com/cms-${slug}/`)
              : null;

            // Find existing preview comment (to update rather than spam)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: pr,
            });

            const BOT_MARKER = '<!-- adamdaniel-preview-bot -->';
            const existing = comments.find(c => c.body.includes(BOT_MARKER));

            // Walkthrough is regenerated FROM main (regenerate-manual.yml's
            // captureStep records). Linking to it at main's HEAD gives the
            // editor reviewing this preview the most recent set of admin
            // screenshots + step descriptions. The walkthrough re-fires
            // when admin/, workflow files, or the spec list change — so
            // any change in this PR that would shift the editor experience
            // produces a fresh walkthrough on the next push to main.
            const walkthroughUrl =
              `https://github.com/${context.repo.owner}/${context.repo.repo}` +
              `/blob/main/docs/CONTRIBUTOR_MANUAL.md`;

            const rows = [
              `| **Preview URL** | [${url}](${url}) |`,
            ];
            if (cmsUrl) {
              rows.push(
                `| **CMS slug alias** | [${cmsUrl}](${cmsUrl}) — stable across draft cycles for this entry |`,
              );
            }
            rows.push(
              `| **Commit** | \`${{ github.event.pull_request.head.sha }}\` |`,
              `| **Branch** | \`${{ github.head_ref }}\` |`,
              `| **Walkthrough** | [docs/CONTRIBUTOR_MANUAL.md](${walkthroughUrl}) (current main) |`,
            );

            const body = [
              BOT_MARKER,
              '## 🔵 Preview Deployed',
              '',
              '| | |',
              '|---|---|',
              ...rows,
              '',
              '*Preview updates automatically on every push to this PR.*',
            ].join('\n');

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: pr,
                body,
              });
            }

  # ────────────────────────────────────────────────────────────
  # Teardown preview (on close / merge)
  # ────────────────────────────────────────────────────────────
  teardown-preview:
    if: github.event.action == 'closed' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      PREVIEW_BUCKET: adamdaniel-ai-previews
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.PREVIEW_CLOUDFRONT_ID }}

    steps:
      - name: Compute CMS slug (cms/<col>/<entry> → <col>-<entry>)
        id: cms_slug
        # Mirror the deploy-side computation so we know which (if any)
        # alias S3 prefix to clean up in addition to pr-<N>. Both prefixes
        # were syncd at deploy time; both need rm + invalidation now.
        run: |
          set -euo pipefail
          BRANCH='${{ github.event.pull_request.head.ref }}'
          if [[ "$BRANCH" == cms/* ]]; then
            SLUG=$(printf '%s' "$BRANCH" | sed -E 's|^cms/||; s|/|-|g')
            echo "slug=${SLUG}" >> "$GITHUB_OUTPUT"
          else
            echo "slug=" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885  # v6.1.1 (2026-05-05)
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Delete preview from S3
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          aws s3 rm "s3://${PREVIEW_BUCKET}/pr-${PR_NUMBER}/" --recursive

      - name: Delete per-CMS-slug alias from S3
        if: steps.cms_slug.outputs.slug != ''
        run: |
          SLUG='${{ steps.cms_slug.outputs.slug }}'
          aws s3 rm "s3://${PREVIEW_BUCKET}/cms-${SLUG}/" --recursive

      - name: Invalidate CloudFront cache
        if: env.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          SLUG='${{ steps.cms_slug.outputs.slug }}'
          # Combine both prefixes in a single invalidation call to save
          # against the per-month invalidation quota.
          PATHS=("/pr-${PR_NUMBER}/*")
          if [[ -n "$SLUG" ]]; then
            PATHS+=("/cms-${SLUG}/*")
          fi
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "${PATHS[@]}"

      - name: Post teardown comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0 (2026-04-09)
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const BOT_MARKER = '<!-- adamdaniel-preview-bot -->';
            const body = `${BOT_MARKER}\n🗑️ Preview environment cleaned up.`;

            // Update the existing preview comment rather than posting a new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: pr,
            });
            const existing = comments.find(c => c.body.includes(BOT_MARKER));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: pr,
                body,
              });
            }
# Intentionally inert line (no functional effect).
