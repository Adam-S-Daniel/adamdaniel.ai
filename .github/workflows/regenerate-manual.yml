name: Regenerate Contributor Manual

# Re-runs the e2e specs that emit captureStep records, rebuilds
# docs/CONTRIBUTOR_MANUAL.md, and opens a PR if the manual changed.
#
# Trigger:
#   - push to main (only when something contributor-relevant changed)
#   - manual dispatch
#
# The fanout-conditional gate keeps churn manageable: if a PR didn't touch
# admin chrome, layouts, or any spec wired into the manual, the doc isn't
# regenerated. AGENTS.md prose changes won't reshoot screenshots.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - '_layouts/**'
      - '_includes/**'
      - 'assets/css/**'
      - '_config.yml'
      - '_e2e/**'
      - 'e2e/manual-capture.js'
      - 'e2e/cms-publish-loop.spec.js'
      - 'e2e/cms-publish-loop-preview.spec.js'
      - 'e2e/cms-smoke.spec.js'
      - 'e2e/cms-publish-flow.spec.js'
      - 'e2e/cms-editorial-workflow.spec.js'
      - 'docs/manual-overrides.yml'
      - 'scripts/build-contributor-manual.js'
      - '.github/workflows/regenerate-manual.yml'
      # Workflow files that drive the admin lifecycle. Edits to any of
      # these can shift what an editor sees during publish/preview, so
      # the walkthrough should regenerate.
      - '.github/workflows/cms-editorial-workflow.yml'
      - '.github/workflows/cms-publish-loop-host.yml'
      - '.github/workflows/cms-publish-loop-prod.yml'
      - '.github/workflows/deploy-preview.yml'
      - '.github/workflows/deploy-production.yml'
      # OAuth proxy + admin-flow shim/helpers — same reasoning. An edit
      # here can change the click → API → workflow chain editors hit.
      - 'oauth-proxy/lambda.py'
      - 'admin/publish-via-auto-merge.js'
      - 'admin/deploy-status-pill.js'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: regenerate-manual
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        # Use CMS_E2E_PAT (contents:rw + pull-requests:rw + metadata:r)
        # so peter-evans/create-pull-request below inherits the right
        # credentials. The default GITHUB_TOKEN can't create PRs in
        # this repo: "GitHub Actions is not permitted to create or
        # approve pull requests" is a repo-level Settings → Actions →
        # General → Workflow permissions toggle that's currently OFF
        # (and the user has chosen to keep it that way for safety).
        # CMS_E2E_PAT bypasses the toggle.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (2026-01-09)
        with:
          fetch-depth: 0
          token: ${{ secrets.CMS_E2E_PAT }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@6aaa311d81eba98ae12eaffbcb63296ace0efcde  # v1.307.0 (2026-05-11)
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0 (2026-04-20)
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright (chromium-only — manual capture is single-project)
        run: npx playwright install chromium --with-deps

      - name: Run capture-instrumented specs
        env:
          MANUAL_CAPTURE: '1'
          # The publish-loop spec needs CMS_E2E_PAT; if it isn't available
          # the spec self-skips and we still capture the in-browser admin
          # specs (cms-smoke, cms-publish-flow, cms-editorial-workflow).
          CMS_E2E_PAT: ${{ secrets.CMS_E2E_PAT }}
        run: |
          # Limit to chromium-desktop — capture is a single-project responsibility.
          npx playwright test \
            --project=chromium-desktop-3k \
            e2e/cms-smoke.spec.js \
            e2e/cms-publish-flow.spec.js \
            e2e/cms-editorial-workflow.spec.js \
            e2e/cms-publish-loop.spec.js \
            --reporter=list || true
        # `|| true` — a flaky capture run shouldn't block manual regen. The
        # commit step below diffs whatever was captured against the
        # checked-in manual and only opens a PR when there's a real change.

      - name: Rebuild manual
        run: node scripts/build-contributor-manual.js

      - name: Detect changes
        id: diff
        run: |
          set -e
          git add docs/CONTRIBUTOR_MANUAL.md docs/manual-screenshots/ || true
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR with regenerated manual
        id: open-pr
        if: steps.diff.outputs.changed == 'true'
        # Branch name lives outside `refs/heads/docs/**` so the
        # `cms-feature-branches` ruleset (which protects `docs/**`
        # along with cms/feat/fix/etc.) doesn't reject the
        # force-push peter-evans uses to update an existing branch.
        # The ruleset's `non_fast_forward` rule was blocking every
        # subsequent run — observed since 2026-04-30 with the same
        # GH013 rejection on every push to main. The PR itself still
        # targets `main`, so the `main` ruleset's required-checks
        # (validate-content, scan, select, unit, parity, e2e (1),
        # finalize) still gate the merge.
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1 (2026-04-10)
        with:
          # CMS_E2E_PAT instead of GITHUB_TOKEN: see the Checkout
          # step above for why (repo's Workflow-permissions toggle
          # blocks github-actions[bot] from creating PRs).
          token: ${{ secrets.CMS_E2E_PAT }}
          branch: automated/regenerate-contributor-manual
          delete-branch: true
          title: 'docs: regenerate Contributor Manual'
          commit-message: 'docs: regenerate Contributor Manual from latest captureStep records'
          body: |
            Auto-generated by `.github/workflows/regenerate-manual.yml`.

            The Playwright e2e suite emits screenshots and step descriptions via
            `captureStep(...)` calls. This PR captures the latest set, rebuilds
            `docs/CONTRIBUTOR_MANUAL.md`, and updates `docs/manual-screenshots/`.

            If the diff looks wrong, the captureStep call in the e2e spec is
            wrong — fix the spec, push to `main`, and this workflow re-runs.
          labels: |
            docs
            automated

      - name: Enable auto-merge for the regenerate-manual PR
        # Without this, the PR sits open until a maintainer clicks merge
        # by hand — wasted human attention for a doc that any push to
        # main will overwrite again on the next regen run anyway.
        # Mirror of the auto-merge enable in cms-editorial-workflow.yml:
        # we route through CMS_E2E_PAT so the eventual squash-merge push
        # is authored by Adam-S-Daniel rather than github-actions[bot].
        # Bot pushes don't trigger downstream workflows
        # (deploy-production, regenerate-manual itself) — this is the
        # same GHA anti-loop guard that PR #245 hit for cms PRs.
        # peter-evans's `pull-request-operation` output is
        # "created" | "updated" | "closed"; only enable on the first
        # two and only when there's a number to address.
        if: |
          steps.diff.outputs.changed == 'true'
          && steps.open-pr.outputs.pull-request-number != ''
          && (steps.open-pr.outputs.pull-request-operation == 'created' || steps.open-pr.outputs.pull-request-operation == 'updated')
        env:
          GH_TOKEN: ${{ secrets.CMS_E2E_PAT }}
          PR_NUMBER: ${{ steps.open-pr.outputs.pull-request-number }}
        run: |
          set -o pipefail
          echo "::notice::Enabling auto-merge on PR #$PR_NUMBER (peter-evans operation: ${{ steps.open-pr.outputs.pull-request-operation }})"
          # `--squash` matches the merge method used everywhere else in
          # this repo. If auto-merge is already enabled (because a prior
          # run set it on the same long-lived branch), this is a no-op
          # — but gh exits 0 in that case, so no special handling needed.
          gh pr merge "$PR_NUMBER" --auto --squash
# Intentionally inert line (no functional effect).
