name: Label non-Decap PRs

# Decap CMS opens every content PR on a `cms/<collection>/<slug>` head
# branch — that's its default `branchPrefix`, and the rest of the repo
# already keys off it (e2e/cms-fixture-pr.js's comment "the cms/draft
# labeller keys off cms/", sweep-stale-cms-prs.yml's prefix safelist).
# PRs from any other source — dependabot/*, claude/*, feat/*, fix/*,
# chore/*, a human's branch — are NOT Decap-created, so this workflow
# tags them `not-decap-created`. (The `cms/draft` label is NOT a usable
# signal: cms-editorial-workflow.yml applies it to EVERY opened PR,
# dependabot's included.)
#
# Three entry points:
#   - pull_request (opened, reopened): tag the single PR as it arrives.
#   - push to main touching THIS file: run the full backfill once when
#     the workflow lands (and again on any later edit to it). This is
#     how the retroactive pass over every pre-existing PR happens
#     automatically — no manual dispatch needed — and how the label set
#     self-heals if the detection logic ever changes.
#   - workflow_dispatch: run the same backfill on demand. Pass
#     `dry_run: true` to log the verdict without mutating labels.
#
# The backfill scans every PR (open + closed + merged) and tags the
# non-Decap ones. It is idempotent and additive (never removes a
# label), so it is safe to re-run at any time.
#
# No `paths:` filter on the pull_request trigger, by design: a non-Decap
# PR can touch any file, so the tag decision is independent of the diff
# (path-filtering would make the workflow miss the PRs it exists to
# catch). The job is a single labelling API call — no checkout, no
# build — and fires only on opened/reopened, never per-push, so it
# costs effectively nothing. It is NOT a required status check, so it
# needs no required-check stub. This mirrors the always-run rationale
# documented on cms-editorial-workflow.yml and dependabot-auto-merge.yml.

on:
  pull_request:
    types: [opened, reopened]
  push:
    branches: [main]
    paths:
      # Only this workflow's own file — so the all-PR backfill runs when
      # the workflow first lands (and on later edits to it), never on
      # ordinary content/code pushes to main.
      - '.github/workflows/label-non-decap-prs.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log what would be labelled without applying any labels'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: label-non-decap-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  label-non-decap:
    runs-on: ubuntu-latest
    steps:
      - name: Tag PR(s) not created by Decap
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0 (2026-04-09)
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          script: |
            const LABEL = 'not-decap-created';
            const { owner, repo } = context.repo;
            const dryRun = process.env.DRY_RUN === 'true';

            // A PR is Decap-created when its head branch uses Decap's
            // `cms/<collection>/<slug>` convention. The body marker and
            // the `decap-cms/*` status labels are corroborating signals,
            // checked too so a genuine Decap PR is never mis-tagged even
            // if some future bundle changes the branch prefix.
            const isDecap = (pr) => {
              if ((pr.head?.ref || '').startsWith('cms/')) return true;
              if ((pr.body || '').startsWith('Automatically generated by Decap CMS')) return true;
              const names = (pr.labels || []).map((l) => (typeof l === 'string' ? l : l.name) || '');
              return names.some((n) => n.startsWith('decap-cms/'));
            };

            const hasLabel = (pr) =>
              (pr.labels || []).some((l) => (typeof l === 'string' ? l : l.name) === LABEL);

            // Ensure the label exists before we try to apply it.
            try {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: LABEL,
                color: 'ededed',
                description: 'PR was not created by Decap CMS (head branch is not cms/<col>/<slug>)',
              });
            } catch (_) {
              /* already exists */
            }

            async function tag(pr) {
              if (isDecap(pr)) return 'decap';
              if (hasLabel(pr)) return 'already-tagged';
              if (dryRun) {
                core.info(`[dry-run] would tag #${pr.number} [${pr.head?.ref}]`);
                return 'would-tag';
              }
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pr.number,
                labels: [LABEL],
              });
              core.info(`tagged #${pr.number} [${pr.head?.ref}]`);
              return 'tagged';
            }

            // pull_request → tag just the PR that triggered us.
            // Everything else (push to main, workflow_dispatch) → full backfill.
            if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              const r = await tag(pr);
              core.info(`PR #${pr.number} [${pr.head?.ref}] → ${r}`);
            } else {
              const prs = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: 'all',
                per_page: 100,
              });
              const counts = {};
              for (const pr of prs) {
                const r = await tag(pr);
                counts[r] = (counts[r] || 0) + 1;
              }
              core.notice(`Backfill over ${prs.length} PR(s): ${JSON.stringify(counts)}`);
            }
