# ============================================================================
# DISARMED — TRIGGERS REMOVED DELIBERATELY. DO NOT RE-ARM.
# ============================================================================
# The upstream reusable this caller invokes — the action-pin version-comment
# sync — is RETIRED (cms-platform#293). The fleet dropped the trailing
# `# vX.Y.Z (YYYY-MM-DD)` comment convention, so a workflow whose whole job is
# to REGENERATE that comment is now a live reverter of the convention's
# removal.
#
# Why the file still exists: the consumer workflow SET is platform-dictated,
# and this repo's `platform_ref` (v0.1.89) still ships
# `examples/site/.github/workflows/dependabot-comment-sync.yml`. Deleting the
# caller on its own reads as `workflow-set: MISSING (platform-dictated)` and
# reds `pin-consistency` — CI rejected the deletion twice here (runs
# 32373212757, 32374656770). Bumping `platform_ref` past the release that drops
# the template WITHOUT deleting the caller reads as `EXTRA`. So the deletion
# belongs in the SAME commit as the bump to the first release whose template
# lacks it, exactly as jodidaniel.com#161 defers it.
#
# Why disarming it matters even though it has no target today: the sync script
# only matches a 40-hex SHA pin (`USES_RE` requires `@[0-9a-f]{40}`), and all
# 32 `uses:` here are cms-platform reusable TAG pins — so there is nothing for
# it to rewrite right now. But it does not merely refresh an existing comment,
# it GROWS one: `USES_RE` captures the comment as an OPTIONAL group `(#.*)?`
# while `build_new_line()` emits a comment unconditionally and defaults the gap
# to two spaces. The first bare SHA-pinned third-party action to land under
# `.github/workflows/` would therefore get a version comment written back onto
# it — re-arming the convention this repo just retired. And the `uses:` pin
# below is an IMMUTABLE TAG, so retiring the reusable on cms-platform's `main`
# does NOT disarm this caller.
#
# What was removed: the `pull_request_target` and `push: branches: ['**']`
# triggers. `workflow_dispatch` is retained ONLY because a workflow with no
# `on:` triggers at all is invalid — nothing fires this automatically now.
# Removing `push:` may resurrect the phantom zero-job `event=push` run rows the
# old `push:` handler existed to suppress; those publish no check context and
# cannot gate a merge, and the file is deleted outright at the bump.
#
# A TRIGGERS-ONLY edit does not change the workflow SET, and
# `check-platform-pin-consistency.js`'s content parity deliberately EXCLUDES
# `on:`, `name` and `run-name` (see `structuralShape`) — so `pin-consistency`
# stays green. Everything from `permissions:` down is the call interface it
# DOES compare: leave it exactly as-is.
#
# DO NOT re-add a trigger to this file. The correct next step is deleting it,
# together with the `platform_ref` bump.
# ============================================================================
name: Dependabot comment sync
run-name: 'manual (disarmed) - @${{ github.actor }}'

on:
  # Manual only, and only so the file has a valid `on:` block. The upstream
  # reusable is retired; dispatching this is never the right move.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  sync:
    uses: Adam-S-Daniel/cms-platform/.github/workflows/dependabot-comment-sync.yml@v0.1.89
    with:
      # Pin to the SAME ref as the `uses:` pin above so the script matches.
      platform_ref: v0.1.89
    secrets:
      # Fine-grained PAT with `workflows: write` so the follow-up commit can
      # push the refreshed workflow files. This site stores it as
      # CMS_PLATFORM_PAT; the reusable skips cleanly with
      # a notice if it resolves empty.
      workflow_sha_comment_pat: ${{ secrets.CMS_PLATFORM_PAT }}
      # GitHub App (Contents R/W, Pull requests R/W, Workflows R/W) is the
      # fallback when no PAT configured; App ID read from vars.CMS_AUTOMATION_APP_ID.
      # When neither credential exists the reusable skips cleanly with a notice.
      # Required at v0.1.89+.
      app_private_key: ${{ secrets.CMS_AUTOMATION_APP_PRIVATE_KEY }}
