name: Dependabot comment sync

# Refresh the trailing `# vX.Y.Z (YYYY-MM-DD)` comments on every
# workflow `uses:` line that Dependabot just bumped, so the comment
# stays in lockstep with the SHA. Dependabot rewrites the SHA and
# the version part of the comment but never the date — over a few
# bumps, the comment can drift multiple releases out of date (see
# PR #135: comment said v1.302.0 (2026-04-15) while the SHA was
# already at v1.305.0 (2026-04-21)).
#
# All logic lives in scripts/sync-action-pin-comments.sh; this
# workflow is a thin "checkout, run, commit, push" wrapper.
#
# ── Trigger choice: pull_request_target, NOT pull_request ──────────
#
# Dependabot-triggered `pull_request` events get a read-only
# GITHUB_TOKEN by design — pushing back to the PR branch would fail
# with 403. `pull_request_target` runs in the BASE repo's context
# with the full GITHUB_TOKEN, so we can push the follow-up commit.
#
# ── Why GITHUB_TOKEN isn't enough: workflow-file protection ────────
#
# GitHub Apps (which is what GITHUB_TOKEN authenticates as) cannot
# create or update files under `.github/workflows/` without a special
# `workflows: write` permission, and that permission can NOT be
# requested via a workflow's `permissions:` block — it's only
# available to GitHub Apps installed with that scope. Pushing back
# a Dependabot action-bump (which by definition modifies workflow
# files) with GITHUB_TOKEN fails with:
#
#   ! [remote rejected] HEAD -> dependabot/...
#     refusing to allow a GitHub App to create or update workflow
#     `.github/workflows/...` without `workflows` permission
#
# The fix is a fine-grained Personal Access Token with the
# `workflows` permission, stored as the `ADAMDANIELAI_WORKFLOW_SHA_COMMENT_PAT`
# repository secret. To create one: github.com → Settings →
# Developer settings → Personal access tokens → Fine-grained →
# scope to this repo, set "Workflows: Read and write" + "Contents:
# Read and write" + "Pull requests: Read", expire in 1 year, save
# as the ADAMDANIELAI_WORKFLOW_SHA_COMMENT_PAT secret.
#
# When ADAMDANIELAI_WORKFLOW_SHA_COMMENT_PAT is unset the job logs a clear notice and
# exits cleanly so the workflow doesn't show up red on every
# Dependabot PR — the feature is opt-in via the PAT secret.
#
# Standard `pull_request_target` security caveat: the workflow runs
# at the BASE-branch HEAD, so any malicious change in the PR diff
# CAN'T influence what runs here — *unless* we explicitly check out
# and execute code from the PR branch. We deliberately:
#
#   1. only check out the PR head ref to mutate its files (no
#      `npm install`, no eval, no `bash <(cat ./script-from-pr)`)
#   2. only execute scripts/sync-action-pin-comments.sh from the
#      checked-out tree's `scripts/` directory — but the checkout
#      step here uses the workflow's own ref behaviour: see step
#      notes below for which ref of which file we actually run.
#
# Concretely the workflow runs the *PR-branch* version of
# scripts/sync-action-pin-comments.sh because that's what's on
# disk after the checkout. For a Dependabot PR that is the same
# as base + a SHA bump in workflow YAML — Dependabot does not
# touch scripts/. If someone manages to convince Dependabot to
# include a script change in a PR, our diff would change too,
# branch protection (CODEOWNERS / required reviews) would catch
# it, and the script's own behaviour (read tags from the GitHub
# API, write a deterministic comment string) makes arbitrary code
# execution from a fixture impossible. Belt-and-braces, the job
# below is gated on `github.event.pull_request.user.login ==
# 'dependabot[bot]'`, so a PR from any other account never even
# starts the runner.
#
# Note: GitHub deliberately ignores changes to `pull_request_target`
# workflow files in PRs — security policy. So this workflow file
# itself can't be modified by a PR; it always runs at the base-ref
# version. That's a stronger property than CODEOWNERS.
#
# ── Path filter ───────────────────────────────────────────────────
#
# The workflow only does anything when a Dependabot PR touched a
# workflow file (since that's where SHA pins live). For npm /
# bundler Dependabot PRs, the script would run, find nothing to
# rewrite, and exit cleanly — we skip the runner round-trip
# entirely with a path filter.
#
# Also list the script and this workflow file so an edit to either
# triggers the workflow (workflow self-validation).

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/**'
      - 'scripts/sync-action-pin-comments.sh'
      - 'scripts/sync-action-pin-comments.test.sh'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: dependabot-comment-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync:
    # Job-level (not workflow-level) `if:` so non-Dependabot PRs
    # don't show up as "skipped" runs in the PR's check list.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Bail early if ADAMDANIELAI_WORKFLOW_SHA_COMMENT_PAT is unset
        # Without a PAT carrying the `workflows` permission, pushing
        # back a Dependabot action-bump fails with "refusing to allow
        # a GitHub App to create or update workflow ... without
        # workflows permission". Skip cleanly with a notice rather
        # than fail loudly on every Dependabot PR.
        if: ${{ secrets.ADAMDANIELAI_WORKFLOW_SHA_COMMENT_PAT == '' }}
        run: |
          echo "::notice::ADAMDANIELAI_WORKFLOW_SHA_COMMENT_PAT secret is not configured. Skipping comment-sync — see this workflow's header for setup instructions."
          exit 0

      - name: Checkout PR head
        # `pull_request_target` defaults to the BASE ref. We need
        # the PR's HEAD to read+rewrite the just-bumped workflow
        # files. Dependabot's branches always live in the base
        # repo (Dependabot doesn't push to forks), so head.repo
        # is the same as the base repo — but spell it out so a
        # future tweak to support fork PRs doesn't silently break
        # this workflow.
        if: ${{ secrets.ADAMDANIELAI_WORKFLOW_SHA_COMMENT_PAT != '' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (2026-01-09)
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          # Use the PAT (with `workflows: write`) for both the
          # initial fetch and the persisted credential `git push`
          # uses below. GITHUB_TOKEN can't push workflow-file
          # changes — see this workflow's header for why.
          token: ${{ secrets.ADAMDANIELAI_WORKFLOW_SHA_COMMENT_PAT }}
          persist-credentials: true

      - name: Configure git author
        # Author the follow-up commit as Dependabot so GitHub's
        # auto-merge gate (which requires the PR head to be
        # authored by Dependabot or by the PR creator) keeps
        # working. The 49699333+ ID is Dependabot's official
        # noreply email per https://api.github.com/users/dependabot%5Bbot%5D.
        if: ${{ secrets.ADAMDANIELAI_WORKFLOW_SHA_COMMENT_PAT != '' }}
        run: |
          git config user.name "dependabot[bot]"
          git config user.email "49699333+dependabot[bot]@users.noreply.github.com"

      - name: Sync action-pin comments
        # `gh` is preinstalled on ubuntu-latest. The script reads
        # the GitHub API via gh's standard env var. GITHUB_TOKEN
        # is fine for the read-only API calls the script makes
        # (listing tags, resolving commits) — only the push needs
        # the workflow-scoped PAT.
        if: ${{ secrets.ADAMDANIELAI_WORKFLOW_SHA_COMMENT_PAT != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/sync-action-pin-comments.sh

      - name: Commit and push if changes
        if: ${{ secrets.ADAMDANIELAI_WORKFLOW_SHA_COMMENT_PAT != '' }}
        # No-op when the script left the tree clean. When it did
        # rewrite something, commit as Dependabot and push back
        # to the PR branch. The commit becomes part of the same
        # PR's CI run; dependabot-auto-merge.yml needs no changes
        # — it waits on required-status-checks against the
        # combined head, which now includes our follow-up commit.
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "no comment drift; nothing to commit"
            exit 0
          fi
          git add -A
          git commit -m "$(cat <<'EOF'
          chore(deps): refresh action-pin comments to match new SHA

          Co-Authored-By: Claude Opus 4.7 (1M context) <noreply@anthropic.com>
          EOF
          )"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
