# Thin caller — copied into a site repo as
# `.github/workflows/cross-post.yml`. Owns the push / workflow_dispatch
# triggers, the `paths:` fixture exclusion, and the run-name; delegates the
# actual detect/verify/render/post work to the platform's reusable workflow.
# Keep `platform_ref` equal to the `@vX.Y.Z` pin on the `uses:` line.
#
# Site values (adamdaniel.ai): `prod_url` https://adamdaniel.ai,
# `mastodon_instance` https://hachyderm.io (@superoutrigger), `substack: true`
# (the Substack draft is rendered into the job summary + the
# `cross-post-<run_id>` artifact and pasted by hand — Substack has no API).
#
# `secrets: MASTODON_ACCESS_TOKEN` — an app token scoped to `profile` + `write:statuses`
# ONLY (see the platform's docs/CROSS-POSTING.md). Optional: with the secret
# unset, the Mastodon leg is skipped with an `::warning::` rather than failing
# the run.
#
# History: this ran as a site-local prototype (PRs #3739 / #3740, module under
# scripts/cross_post/) before cms-platform v0.1.110 shipped it as a reusable;
# the prototype was removed in the bump to that release (cms-platform#442,
# tracking issue #3735).
name: Cross-post
run-name: >-
  ${{ github.event_name == 'push'
        && format('push — {0} @{1}', github.ref_name, github.actor)
   || format('manual — @{0}', github.actor) }}

on:
  push:
    branches: [main]
    paths:
      - '_posts/**'
      # prod-loop canaries (test_fixture) — cross_post.py would skip these
      # anyway; excluding the paths here just saves the run.
      - '!_posts/2099-*'
      - '!_posts/*-e2e-*'
  workflow_dispatch:
    inputs:
      post_path:
        description: 'Path of one _posts/*.md to cross-post (backfill or re-run)'
        type: string
        required: true
      dry_run:
        description: 'Log what would be posted; post nothing'
        type: boolean
        default: true
      visibility:
        description: 'Mastodon post visibility'
        type: choice
        options: [public, unlisted, direct]
        default: public

# actions:read — the reusable's await-prod-deploy composite queries this
# commit's deploy-production run; a reusable is capped by its caller's grant.
permissions:
  contents: read
  actions: read

jobs:
  cross-post:
    uses: Adam-S-Daniel/cms-platform/.github/workflows/cross-post.yml@v0.1.110
    with:
      prod_url: https://adamdaniel.ai
      mastodon_instance: https://hachyderm.io
      substack: true
      post_path: ${{ inputs.post_path || '' }}
      dry_run: ${{ inputs.dry_run || false }}
      visibility: ${{ inputs.visibility || 'public' }}
      platform_ref: v0.1.110
    secrets:
      MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
