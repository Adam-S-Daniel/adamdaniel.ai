# Runs the pytest suite under scripts/cross_post/ — including
# test_workflow_shape.py, which lint-locks this workflow and cross-post.yml
# themselves — on any PR that touches the module or either workflow file.
# NOT a required check: it is path-filtered, so it is absent on most PRs,
# and an absent required context blocks a merge forever (docs/WORKFLOWS.md,
# "missing-check trap").
name: Cross-post tests
run-name: >-
  ${{ github.event_name == 'pull_request'
        && format('PR #{0} — {1}', github.event.pull_request.number, github.event.pull_request.title)
   || format('manual — @{0}', github.actor) }}

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/cross_post/**'
      - '.github/workflows/cross-post.yml'
      - '.github/workflows/cross-post-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # pytest 9.1.1 (2026-06-19) and PyYAML 6.0.3 (2025-09-25) — each the
      # newest release at least 7 days old as of pinning (2026-09-21).
      - name: Install test dependencies
        run: python3 -m pip install --user 'pytest==9.1.1' 'pyyaml==6.0.3'

      - name: Run cross_post tests
        run: python3 -m pytest scripts/cross_post -q
