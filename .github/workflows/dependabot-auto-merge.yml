# Thin caller — copied into a site repo as
# `.github/workflows/dependabot-auto-merge.yml`. Owns the `pull_request`
# trigger + run-name; delegates the Dependabot unattended-merge gate to the
# platform's reusable workflow. Auto-merges the platform-bump / gem
# Dependabot PRs once the site's required checks on main are green.
name: Dependabot auto-merge
run-name: "${{ format('PR #{0} — {1}', github.event.pull_request.number, github.event.pull_request.title) }}"

on:
  pull_request:
    # No `edited`: a skipped caller emits NO check-run, so an `edited` run WITHDRAWS
    # contexts an earlier run reported green — only a new SHA restores them (#222).
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    uses: Adam-S-Daniel/cms-platform/.github/workflows/dependabot-auto-merge.yml@e0d772c22312cc6585d0b4f70de8bc22d0f18368
    with:
      platform_ref: e0d772c22312cc6585d0b4f70de8bc22d0f18368
