name: CMS Publish Loop — Prod Mutation Playground

# Nightly real-network mutation of a real `_posts/` entry on prod, to
# exercise the full Decap → cms PR → auto-merge → deploy-production
# loop end-to-end. See plan G4 + e2e/cms-publish-loop-prod-mutate.spec.js
# for the rationale and fixture details.
#
# Sunset path: this workflow is gated on the repo variable
# `PROD_PLAYGROUND_MODE`. While prod is a "full mutation playground",
# set it to `true` (Repo Settings → Variables and secrets → Actions →
# Variables). When prod stops being a playground, set it to `false`
# (or unset it) — the cron tick still fires but the job no-ops, and
# the fixture file `_posts/2099-01-01-e2e-mutation-canary.md` stays
# in-tree as documentation.

on:
  schedule:
    # 13:00 UTC daily. Slotted an hour before publish-scheduled-posts
    # (14:00 UTC) so the two daily mutations don't trip over each
    # other on `deploy-production.yml`'s queued-run concurrency.
    - cron: '0 13 * * *'
  workflow_dispatch:
    # Manual trigger for debugging the spec or bringing the playground
    # back online after a sunset/un-sunset cycle.

permissions:
  # The spec drives admin via a fine-grained PAT (CMS_E2E_PAT) — the
  # workflow itself only needs to read the repo to install deps and
  # check out source, so contents:read is sufficient. The PAT carries
  # its own contents:rw / pull-requests:rw scope.
  contents: read

concurrency:
  # Only one prod-mutation run at a time. A second run starting while
  # the first is still mid-deploy would clash on the canary file's SHA
  # in the Contents API and confuse the assertion that the URL shows
  # *this* run's marker.
  group: cms-publish-loop-prod
  cancel-in-progress: false

jobs:
  prod-mutate:
    # The whole job is gated on the repo variable so that flipping the
    # variable to `false` (or clearing it) in repo Settings instantly
    # stops the workflow, with no code change needed. The cron tick
    # still fires — GitHub doesn't honor variable-driven `on:` filters
    # — but the job evaluates `if:` to false and skips, costing zero
    # billable minutes.
    if: vars.PROD_PLAYGROUND_MODE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (2026-01-09)

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0 (2026-04-20)
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Playwright browsers (chromium only)
        id: pw-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5 (2026-04-13)
        with:
          path: ~/.cache/ms-playwright
          # `playwright-prod-mutate-` keeps this chromium-only cache
          # distinct from the full-matrix cache used by e2e-tests.yml.
          key: playwright-prod-mutate-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright OS deps (chromium)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run prod mutation playground spec
        env:
          # Same PAT the existing publish-loop tests use. Fine-grained,
          # scoped to the host repo with contents: r/w + pull_requests:
          # r/w + metadata: r. See AGENTS.md → "GitHub Actions secrets".
          CMS_E2E_PAT: ${{ secrets.CMS_E2E_PAT }}
        run: |
          set -o pipefail
          npx playwright test \
            e2e/cms-publish-loop-prod-mutate.spec.js \
            --project=chromium-desktop \
            --reporter=list \
            2>&1 | tee /tmp/prod-mutate.log

      - name: Upload test results on failure
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 (2026-04-10)
        with:
          name: prod-mutate-results
          path: |
            test-results/
            /tmp/prod-mutate.log
          retention-days: 14
