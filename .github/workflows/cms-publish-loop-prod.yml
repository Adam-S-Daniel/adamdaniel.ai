name: CMS Publish Loop — Prod Mutation Playground

# Runs the full Decap → cms PR → auto-merge → deploy-production loop
# end-to-end against prod. See plan G4 +
# e2e/cms-publish-loop-prod-mutate.spec.js for the rationale and
# fixture details.
#
# Trigger model: required-status-check on PRs into `main`. The
# workflow always runs on every PR so the named check exists; an
# early step decides whether the salient parts of the codebase
# changed. When nothing salient changed, every subsequent step
# self-skips and the check reports success immediately. Manual
# `workflow_dispatch` always forces a real run.
#
# Sunset path: the actual mutation is gated on the repo variable
# `PROD_PLAYGROUND_MODE`. While prod is a "full mutation playground",
# set it to `true` (Repo Settings → Variables and secrets → Actions →
# Variables). When prod stops being a playground, set it to `false`
# (or unset it) — the workflow keeps reporting success on PRs (no
# real mutation), and the fixture file
# `_posts/2099-01-01-e2e-mutation-canary.md` stays in-tree as
# documentation.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  # The spec drives admin via a fine-grained PAT (CMS_E2E_PAT) — the
  # workflow itself only needs to read the repo to install deps and
  # check out source, so contents:read is sufficient. The PAT carries
  # its own contents:rw / pull-requests:rw scope.
  contents: read

defaults:
  run:
    # GHA defaults the shell to `sh -e {0}` inside `container:` jobs,
    # but our run-blocks use `set -o pipefail` and other bash-isms.
    # Force bash so those scripts work inside the Playwright container.
    shell: bash

concurrency:
  # Per-PR concurrency. A second push to the same PR cancels the
  # in-flight run; concurrent runs across different PRs would clash
  # on the canary file's SHA in the Contents API and confuse the
  # assertion that the URL shows *this* run's marker, so don't allow
  # them.
  group: cms-publish-loop-prod-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prod-mutate:
    runs-on: ubuntu-latest
    # Prebuilt Playwright image — browsers + their apt deps baked in,
    # avoiding the apt-mirror tail latency the prior `playwright
    # install-deps` step paid on every run. Tag is enforced to match
    # `package-lock.json` by e2e-tests.yml's `select` job drift-guard.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (2026-01-09)
        with:
          # Need the PR's full diff range (base..head) to detect
          # whether any salient path changed. fetch-depth: 0 is the
          # safest choice for a PR that may have many commits.
          fetch-depth: 0

      - name: Detect salient changes
        id: salient
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual dispatch — forcing run."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Files changed in PR:"
          echo "$changed" | sed 's/^/  /'
          # Salient paths: the spec, the e2e helpers it imports, the
          # fixture post, the admin shell the spec drives, the
          # Playwright config, npm dep manifests, Jekyll config and
          # the post layout that renders the public page, and the
          # workflow file itself. A change to any of these can break
          # the publish loop end-to-end.
          if printf '%s\n' "$changed" | grep -qE '^(\.github/workflows/cms-publish-loop-prod\.yml|e2e/cms-publish-loop-prod-mutate\.spec\.js|e2e/decap-pat\.js|e2e/github-actions-poll\.js|e2e/base\.js|admin/|_posts/2099-01-01-e2e-mutation-canary\.md|playwright\.config\.js|package(-lock)?\.json|_config\.yml|_layouts/post\.html)'; then
            echo "Salient paths changed → running prod mutation."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No salient paths changed → emitting success without running."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip — not salient
        if: steps.salient.outputs.run != 'true'
        run: echo "::notice::No salient paths changed in this PR; reporting success without running prod mutation."

      - name: Skip — playground mode disabled
        if: steps.salient.outputs.run == 'true' && vars.PROD_PLAYGROUND_MODE != 'true'
        run: echo "::notice::PROD_PLAYGROUND_MODE is not 'true'; skipping prod mutation."

      - name: Setup Node
        if: steps.salient.outputs.run == 'true' && vars.PROD_PLAYGROUND_MODE == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0 (2026-04-20)
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        if: steps.salient.outputs.run == 'true' && vars.PROD_PLAYGROUND_MODE == 'true'
        run: npm ci

      - name: Run prod mutation playground spec
        if: steps.salient.outputs.run == 'true' && vars.PROD_PLAYGROUND_MODE == 'true'
        env:
          # Same PAT the existing publish-loop tests use. Fine-grained,
          # scoped to the host repo with contents: r/w + pull_requests:
          # r/w + metadata: r. See AGENTS.md → "GitHub Actions secrets".
          CMS_E2E_PAT: ${{ secrets.CMS_E2E_PAT }}
          # Tells playwright.config.js (via the G3 TARGET= switch) NOT
          # to spin up the local Jekyll + decap-server webServer block
          # — this spec hits adamdaniel.ai directly and the runner has
          # no Ruby/bundler, so a webServer attempt would fail at
          # `bundle: not found`. The spec hardcodes
          # https://adamdaniel.ai for its own fetches, so the baseURL
          # override TARGET=prod also installs is incidental but not
          # relied on. Mirrors canary-prod.yml's pattern.
          TARGET: prod
          # Opt-in marker the spec checks before running. Without this,
          # it also fires inside e2e-tests.yml shard 1, force-pushing
          # concurrent commits to the same cms/posts/… branch and
          # cancelling each other's validate-content runs. Setting it
          # here scopes the prod mutation to this dedicated workflow.
          RUN_PROD_MUTATE_PLAYGROUND: "1"
        run: |
          set -o pipefail
          npx playwright test \
            e2e/cms-publish-loop-prod-mutate.spec.js \
            --project=chromium-desktop \
            --reporter=list \
            2>&1 | tee /tmp/prod-mutate.log

      - name: Upload test results on failure
        if: ${{ (failure() || cancelled()) && steps.salient.outputs.run == 'true' && vars.PROD_PLAYGROUND_MODE == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 (2026-04-10)
        with:
          name: prod-mutate-results
          path: |
            test-results/
            /tmp/prod-mutate.log
          retention-days: 14
