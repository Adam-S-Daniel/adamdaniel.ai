name: CMS Publish Loop — Prod Mutation Playground

# Runs the full Decap → cms PR → auto-merge → deploy-production loop
# end-to-end against prod. See plan G4 +
# e2e/cms-publish-loop-prod-mutate.spec.js for the rationale and
# fixture details.
#
# Trigger model: workflow-level `paths:` filter on pushes to `main`.
# It runs post-merge (not speculatively per-PR) because the spec
# drives a REAL mutation against production: firing it on every
# concurrent PR raced the shared prod canary + the deploy-production
# queue and flaked non-deterministically. On a push that doesn't
# touch a salient file it doesn't run at all. This job is NOT in the
# branch-protection required-status-checks list (see
# `.github/rulesets/main.json` and the live
# `gh api repos/.../rules/branches/main` view), so not running on PRs
# blocks no merge. Manual `workflow_dispatch` always forces a real
# run regardless of paths.
#
# Sunset path: the actual mutation is gated on the repo variable
# `PROD_PLAYGROUND_MODE`. While prod is a "full mutation playground",
# set it to `true` (Repo Settings → Variables and secrets → Actions →
# Variables). When prod stops being a playground, set it to `false`
# (or unset it) — the workflow keeps reporting success on pushes (no
# real mutation), and the fixture file
# `_posts/2099-01-01-e2e-mutation-canary.md` stays in-tree as
# documentation.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cms-publish-loop-prod.yml
      - e2e/cms-publish-loop-prod-mutate.spec.js
      - e2e/decap-pat.js
      - e2e/github-actions-poll.js
      - e2e/base.js
      - admin/**
      - _posts/2099-01-01-e2e-mutation-canary.md
      - playwright.config.js
      - package.json
      - package-lock.json
      - _config.yml
      - _layouts/post.html
  workflow_dispatch:

permissions:
  # The spec drives admin via a fine-grained PAT (CMS_E2E_PAT) — the
  # workflow itself only needs to read the repo to install deps and
  # check out source, so contents:read is sufficient there. The PAT
  # carries its own contents:rw / pull-requests:rw scope.
  #
  # `pull-requests: write` is needed by the post-failure-comment
  # composite action so the default GITHUB_TOKEN can post the
  # failure-summary comment via the issues comments API. Without
  # this the github-script call 403s silently and no comment lands.
  #
  # `actions: read` lets the await-prod-deploy gate query this commit's
  # `Deploy to Production` run via the REST API (#1101).
  contents: read
  pull-requests: write
  actions: read

defaults:
  run:
    # GHA defaults the shell to `sh -e {0}` inside `container:` jobs,
    # but our run-blocks use `set -o pipefail` and other bash-isms.
    # Force bash so those scripts work inside the Playwright container.
    shell: bash

concurrency:
  # SHARED repo-wide lane for ALL real-prod-mutating loop workflows
  # (cms-publish-loop-prod / cms-media-roundtrip / cms-publish-loop-host).
  # GHA concurrency groups are keyed by string ACROSS workflows, so a
  # single constant group makes the three mutually exclusive: only one
  # real-prod loop can run at a time, whatever the trigger (push /
  # workflow_dispatch / host's daily cron all converge here). They each
  # mutate prod through Decap → cms-PR → auto-merge → deploy-production
  # and a parallel pair races deploy-production's `group: production`,
  # blowing each other's URL-reflect budgets (#1101 — observed: 3 loops
  # 13:42→13:59 on merge 3dbade7, 2 failed). cancel-in-progress:false
  # queues rather than killing an in-flight loop (cancelling mid-flow
  # can leave the canary dirty); a stuck run holds the lane up to its
  # timeout-minutes, which is bounded and far cheaper than the collision.
  # This block MUST stay byte-identical in all three workflows —
  # enforced by e2e/workflow-prod-loop-serialized.test.js.
  group: prod-mutating-loop
  cancel-in-progress: false

jobs:
  prod-mutate:
    runs-on: ubuntu-latest
    # Push-safe recursion guard. The spec drives Decap, which opens a
    # `cms/posts/2099-01-01-e2e-mutation-canary` PR; cms-editorial-
    # workflow.yml squash-merges it as the CMS_E2E_PAT user with the
    # commit headline `publish: <PR title>` (see that workflow's
    # enablePullRequestAutoMerge `commitHeadline`). That merge is a
    # push to `main` touching `_posts/2099-01-01-e2e-mutation-canary.md`
    # — a salient path — which would re-fire this loop indefinitely.
    # The old `head_ref` guard only worked on `pull_request` events
    # (empty on push). Skip when the push's head commit is a CMS
    # auto-merge; `workflow_dispatch` (event != push) always runs.
    if: >-
      ${{ github.event_name != 'push'
          || !startsWith(github.event.head_commit.message, 'publish: ') }}
    # Prebuilt Playwright image — browsers + their apt deps baked in,
    # avoiding the apt-mirror tail latency the prior `playwright
    # install-deps` step paid on every run. Tag is enforced to match
    # `package-lock.json` by e2e-tests.yml's `select` job drift-guard.
    env:
      # Firefox refuses to launch when $HOME is owned by a different
      # user. Inside GHA's container jobs the runner injects
      # `-e HOME=/github/home` at `docker create` time (owned by the
      # image's `pwuser`); attempting to override that via
      # `container.env` is a no-op because GHA's injection wins. The
      # runner DOES honour job-level `env:` — it `export`s those into
      # every step's shell after `docker exec`, so HOME=/root takes
      # effect by the time `npx playwright test` runs. Firefox bails
      # with "Running Nightly as root in a regular user's session is
      # not supported" without this. Chromium and WebKit are
      # unaffected; setting it uniformly keeps configuration simple.
      HOME: /root
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    # 30 → 50: the await-prod-deploy gate below can spend up to
    # ~15 min waiting for this commit's deploy + CDN reflect before
    # the spec even starts (#1101). Headroom so a legit slow-deploy
    # gate doesn't get GHA-killed mid-loop.
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (2026-01-09)

      # Post-merge only: do NOT drive prod until THIS commit is live on
      # adamdaniel.ai (deploy-production succeeded + CDN serves the
      # SHA). Without this the loop validates a stale pre-merge site
      # (#1101). Skipped on workflow_dispatch/schedule (no associated
      # merge) and when playground mode is off (the spec self-skips, so
      # there is nothing to gate). Fails loud if the deploy failed.
      - name: Await prod deploy of this merge
        if: ${{ github.event_name == 'push' && vars.PROD_PLAYGROUND_MODE == 'true' }}
        uses: ./.github/actions/await-prod-deploy

      - name: Skip — playground mode disabled
        if: vars.PROD_PLAYGROUND_MODE != 'true'
        run: echo "::notice::PROD_PLAYGROUND_MODE is not 'true'; skipping prod mutation."

      - name: Setup Node
        if: vars.PROD_PLAYGROUND_MODE == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0 (2026-04-20)
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        if: vars.PROD_PLAYGROUND_MODE == 'true'
        run: npm ci

      - name: Run prod mutation playground spec
        if: vars.PROD_PLAYGROUND_MODE == 'true'
        env:
          # Same PAT the existing publish-loop tests use. Fine-grained,
          # scoped to the host repo with contents: r/w + pull_requests:
          # r/w + metadata: r. See AGENTS.md → "GitHub Actions secrets".
          CMS_E2E_PAT: ${{ secrets.CMS_E2E_PAT }}
          # Tells playwright.config.js (via the G3 TARGET= switch) NOT
          # to spin up the local Jekyll + decap-server webServer block
          # — this spec hits adamdaniel.ai directly and the runner has
          # no Ruby/bundler, so a webServer attempt would fail at
          # `bundle: not found`. The spec hardcodes
          # https://adamdaniel.ai for its own fetches, so the baseURL
          # override TARGET=prod also installs is incidental but not
          # relied on. Mirrors canary-prod.yml's pattern.
          TARGET: prod
          # Opt-in marker the spec checks before running. Without this,
          # it also fires inside e2e-tests.yml shard 1, force-pushing
          # concurrent commits to the same cms/posts/… branch and
          # cancelling each other's validate-content runs. Setting it
          # here scopes the prod mutation to this dedicated workflow.
          RUN_PROD_MUTATE_PLAYGROUND: "1"
        run: |
          set -o pipefail
          # `--max-failures=1` is a no-op for a single spec but kept
          # here for symmetry with cms-publish-loop-host.yml so any
          # future addition of a second spec in this workflow inherits
          # the fail-fast behaviour.
          npx playwright test \
            e2e/cms-publish-loop-prod-mutate.spec.js \
            --project=chromium-desktop-3k \
            --reporter=list \
            --max-failures=1 \
            2>&1 | tee /tmp/prod-mutate.log

      - name: Upload test results on failure
        if: ${{ (failure() || cancelled()) && vars.PROD_PLAYGROUND_MODE == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 (2026-04-10)
        with:
          name: prod-mutate-results
          path: |
            test-results/
            /tmp/prod-mutate.log
          retention-days: 14

      # Surface the Playwright failure block as a PR comment so a
      # human (or agent) iterating on the PR can triage without
      # needing workflow-log access. Delegated to the shared
      # composite action at .github/actions/post-failure-comment;
      # see AGENTS.md "Failure-comment composite action" for the
      # full convention and design notes. Distinct marker so it
      # doesn't clobber the e2e or host-loop comment. Gated on
      # PROD_PLAYGROUND_MODE for symmetry with the upload-artifact
      # step above — when playground mode is off, the test
      # self-skips and there's nothing meaningful to comment about.
      # Two call sites — caller-side gating with `failure()` /
      # `success()` is the canonical, well-tested pattern. The
      # composite action is mode-driven and doesn't detect job
      # state itself.
      - name: Post failure summary
        if: ${{ failure() && vars.PROD_PLAYGROUND_MODE == 'true' }}
        uses: ./.github/actions/post-failure-comment
        with:
          mode: post
          log-file: /tmp/prod-mutate.log
          marker: prod-mutate-failure-summary
          title: prod-mutate

      - name: Resolve failure summary on success
        if: ${{ success() && vars.PROD_PLAYGROUND_MODE == 'true' }}
        uses: ./.github/actions/post-failure-comment
        with:
          mode: resolve
          marker: prod-mutate-failure-summary
          title: prod-mutate

      # Stuck-PR diagnostic — see the corresponding block in
      # cms-publish-loop-host.yml for the rationale and design.
      # Gated by `grep 'Timed out waiting'` so it stays quiet on
      # non-timeout failures.
      - name: Diagnose stuck PRs
        if: ${{ failure() && vars.PROD_PLAYGROUND_MODE == 'true' && hashFiles('/tmp/prod-mutate.log') != '' }}
        env:
          GH_TOKEN: ${{ secrets.CMS_E2E_PAT || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WAITING_FOR: 'prod-mutate spec (see Playwright log for the specific wait)'
        run: |
          set -uo pipefail
          if grep -q 'Timed out waiting' /tmp/prod-mutate.log 2>/dev/null; then
            node scripts/diagnose-stuck-pr.js > /tmp/prod-mutate-stuck-pr-diagnostic.md || true
          else
            echo "_no 'Timed out waiting' lines in log; stuck-PR diagnostic skipped_" > /tmp/prod-mutate-stuck-pr-diagnostic.md
          fi

      - name: Post stuck-PR diagnostic
        if: ${{ failure() && vars.PROD_PLAYGROUND_MODE == 'true' && hashFiles('/tmp/prod-mutate-stuck-pr-diagnostic.md') != '' }}
        uses: ./.github/actions/post-failure-comment
        with:
          mode: post
          log-file: /tmp/prod-mutate-stuck-pr-diagnostic.md
          marker: prod-mutate-stuck-pr-diagnostic
          title: prod-mutate stuck-PR diagnostic

      - name: Resolve stuck-PR diagnostic on success
        if: ${{ success() && vars.PROD_PLAYGROUND_MODE == 'true' }}
        uses: ./.github/actions/post-failure-comment
        with:
          mode: resolve
          marker: prod-mutate-stuck-pr-diagnostic
          title: prod-mutate stuck-PR diagnostic
# Intentionally inert line (no functional effect).
