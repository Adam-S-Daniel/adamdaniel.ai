# Thin caller — copied into a site repo as
# `.github/workflows/cms-publish-loop-prod.yml`. Owns the push /
# workflow_dispatch triggers + run-name; delegates the prod-mutation
# playground loop to the platform's reusable workflow. The e2e harness +
# the cms-recursion-gate / await-prod-deploy / post-failure-comment
# composites all live in the platform repo. Keep `platform_ref` equal to
# the `@<sha>` pin on the `uses:` line.
#
# Site identity (CMS_PROD_URL / CMS_APEX) + the PROD_PLAYGROUND_MODE
# sunset gate are read from THIS repo's VARS by the reusable workflow.
#
# Real push-event validation of the #1815 fix is exercised by touching ONLY
# this caller file: a push to main on this path fires THIS loop alone (no
# cms-media-roundtrip / cms-publish-loop-host co-arrival in the shared
# prod-mutating-loop lane — see cms-platform#70), so the recursion-gate runs
# the REAL prod-mutate job rather than a bump-skip.
name: CMS Publish Loop — Prod Mutation Playground
run-name: >-
  ${{ github.event_name == 'push'
        && format('push — {0} @{1}', github.ref_name, github.actor)
   || format('manual — @{0}', github.actor) }}

on:
  push:
    branches: [main]
    # playwright.config.js and _layouts/post.html were dropped: neither is
    # tracked in this repo (the e2e harness + Jekyll layouts are gem-/
    # platform-delivered here, not vendored) so they could never match a
    # push diff. Keep only paths that can actually change in this repo.
    paths:
      - .github/workflows/cms-publish-loop-prod.yml
      - admin/**
      - package.json
      - package-lock.json
      - _config.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  prod-loop:
    uses: Adam-S-Daniel/cms-platform/.github/workflows/cms-publish-loop-prod.yml@v0.1.85
    with:
      # Pin to the SAME ref as the `uses:` pin above so the harness matches.
      platform_ref: v0.1.85
    secrets:
      CMS_E2E_PAT: ${{ secrets.CMS_E2E_PAT }}
