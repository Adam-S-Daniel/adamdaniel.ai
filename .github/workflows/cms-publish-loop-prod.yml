name: CMS Publish Loop — Prod Mutation Playground

# Runs the full Decap → cms PR → auto-merge → deploy-production loop
# end-to-end against prod. See plan G4 +
# e2e/cms-publish-loop-prod-mutate.spec.js for the rationale and
# fixture details.
#
# Trigger model: workflow-level `paths:` filter on PRs into `main`.
# The workflow only fires when one of the salient files actually
# changed; on PRs that don't touch them, it doesn't appear in the
# checks list at all (this job is NOT in the branch-protection
# required-status-checks list — see `.github/rulesets/main.json` and
# the live `gh api repos/.../rules/branches/main` view). Manual
# `workflow_dispatch` always forces a real run regardless of paths.
#
# Sunset path: the actual mutation is gated on the repo variable
# `PROD_PLAYGROUND_MODE`. While prod is a "full mutation playground",
# set it to `true` (Repo Settings → Variables and secrets → Actions →
# Variables). When prod stops being a playground, set it to `false`
# (or unset it) — the workflow keeps reporting success on PRs (no
# real mutation), and the fixture file
# `_posts/2099-01-01-e2e-mutation-canary.md` stays in-tree as
# documentation.

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/cms-publish-loop-prod.yml
      - e2e/cms-publish-loop-prod-mutate.spec.js
      - e2e/decap-pat.js
      - e2e/github-actions-poll.js
      - e2e/base.js
      - admin/**
      - _posts/2099-01-01-e2e-mutation-canary.md
      - playwright.config.js
      - package.json
      - package-lock.json
      - _config.yml
      - _layouts/post.html
  workflow_dispatch:

permissions:
  # The spec drives admin via a fine-grained PAT (CMS_E2E_PAT) — the
  # workflow itself only needs to read the repo to install deps and
  # check out source, so contents:read is sufficient. The PAT carries
  # its own contents:rw / pull-requests:rw scope.
  contents: read

defaults:
  run:
    # GHA defaults the shell to `sh -e {0}` inside `container:` jobs,
    # but our run-blocks use `set -o pipefail` and other bash-isms.
    # Force bash so those scripts work inside the Playwright container.
    shell: bash

concurrency:
  # Per-PR concurrency. A second push to the same PR cancels the
  # in-flight run; concurrent runs across different PRs would clash
  # on the canary file's SHA in the Contents API and confuse the
  # assertion that the URL shows *this* run's marker, so don't allow
  # them.
  group: cms-publish-loop-prod-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prod-mutate:
    runs-on: ubuntu-latest
    # Prebuilt Playwright image — browsers + their apt deps baked in,
    # avoiding the apt-mirror tail latency the prior `playwright
    # install-deps` step paid on every run. Tag is enforced to match
    # `package-lock.json` by e2e-tests.yml's `select` job drift-guard.
    env:
      # Firefox refuses to launch when $HOME is owned by a different
      # user. Inside GHA's container jobs the runner injects
      # `-e HOME=/github/home` at `docker create` time (owned by the
      # image's `pwuser`); attempting to override that via
      # `container.env` is a no-op because GHA's injection wins. The
      # runner DOES honour job-level `env:` — it `export`s those into
      # every step's shell after `docker exec`, so HOME=/root takes
      # effect by the time `npx playwright test` runs. Firefox bails
      # with "Running Nightly as root in a regular user's session is
      # not supported" without this. Chromium and WebKit are
      # unaffected; setting it uniformly keeps configuration simple.
      HOME: /root
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (2026-01-09)

      - name: Skip — playground mode disabled
        if: vars.PROD_PLAYGROUND_MODE != 'true'
        run: echo "::notice::PROD_PLAYGROUND_MODE is not 'true'; skipping prod mutation."

      - name: Setup Node
        if: vars.PROD_PLAYGROUND_MODE == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0 (2026-04-20)
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        if: vars.PROD_PLAYGROUND_MODE == 'true'
        run: npm ci

      - name: Run prod mutation playground spec
        if: vars.PROD_PLAYGROUND_MODE == 'true'
        env:
          # Same PAT the existing publish-loop tests use. Fine-grained,
          # scoped to the host repo with contents: r/w + pull_requests:
          # r/w + metadata: r. See AGENTS.md → "GitHub Actions secrets".
          CMS_E2E_PAT: ${{ secrets.CMS_E2E_PAT }}
          # Tells playwright.config.js (via the G3 TARGET= switch) NOT
          # to spin up the local Jekyll + decap-server webServer block
          # — this spec hits adamdaniel.ai directly and the runner has
          # no Ruby/bundler, so a webServer attempt would fail at
          # `bundle: not found`. The spec hardcodes
          # https://adamdaniel.ai for its own fetches, so the baseURL
          # override TARGET=prod also installs is incidental but not
          # relied on. Mirrors canary-prod.yml's pattern.
          TARGET: prod
          # Opt-in marker the spec checks before running. Without this,
          # it also fires inside e2e-tests.yml shard 1, force-pushing
          # concurrent commits to the same cms/posts/… branch and
          # cancelling each other's validate-content runs. Setting it
          # here scopes the prod mutation to this dedicated workflow.
          RUN_PROD_MUTATE_PLAYGROUND: "1"
        run: |
          set -o pipefail
          # `--max-failures=1` is a no-op for a single spec but kept
          # here for symmetry with cms-publish-loop-host.yml so any
          # future addition of a second spec in this workflow inherits
          # the fail-fast behaviour.
          npx playwright test \
            e2e/cms-publish-loop-prod-mutate.spec.js \
            --project=chromium-desktop \
            --reporter=list \
            --max-failures=1 \
            2>&1 | tee /tmp/prod-mutate.log

      - name: Upload test results on failure
        if: ${{ (failure() || cancelled()) && vars.PROD_PLAYGROUND_MODE == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 (2026-04-10)
        with:
          name: prod-mutate-results
          path: |
            test-results/
            /tmp/prod-mutate.log
          retention-days: 14

      # Surface the Playwright failure block as a PR comment so a
      # human (or agent) iterating on the PR can triage without
      # needing workflow-log access. Mirrors e2e-tests.yml's
      # post-failure-summary pattern; uses a distinct marker so it
      # doesn't clobber the e2e or host-loop comment. Gated on
      # PROD_PLAYGROUND_MODE for symmetry with the upload step —
      # when playground mode is off, the test self-skips and there's
      # nothing meaningful to comment about.
      - name: Install gitleaks
        if: ${{ failure() && vars.PROD_PLAYGROUND_MODE == 'true' }}
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          # Playwright container runs as root; no sudo available.
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xzC /usr/local/bin gitleaks
          gitleaks version

      - name: Extract and scrub prod-mutate failure summary
        if: ${{ failure() && vars.PROD_PLAYGROUND_MODE == 'true' }}
        run: |
          bash scripts/extract-playwright-failures.sh /tmp/prod-mutate.log > /tmp/failures-raw.txt || true
          if [ ! -s /tmp/failures-raw.txt ]; then
            tail -c 80000 /tmp/prod-mutate.log > /tmp/failures-raw.txt
          fi
          node scripts/scrub-secrets.js /tmp/failures-raw.txt /tmp/failures-clean.txt
          head -c 60000 /tmp/failures-clean.txt > /tmp/failures-final.txt

      - name: Post prod-mutate failure summary to PR
        if: ${{ failure() && vars.PROD_PLAYGROUND_MODE == 'true' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0 (2026-04-09)
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('/tmp/failures-final.txt', 'utf8');
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const marker = '<!-- prod-mutate-failure-summary -->';
            const body = [
              marker,
              `## prod-mutate failure on \`${sha}\``,
              '',
              `[View full run](${runUrl})`,
              '',
              '<details>',
              '<summary>Failure log (secrets redacted via gitleaks)</summary>',
              '',
              '```',
              summary || '(no failure block matched the extractor; see the run for full output)',
              '```',
              '',
              '</details>',
              '',
              '*Posted automatically. The comment refreshes on every CI run.*',
            ].join('\n');
            const pr = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body,
              });
            }

      - name: Resolve prod-mutate failure-summary comment on success
        if: ${{ success() && vars.PROD_PLAYGROUND_MODE == 'true' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0 (2026-04-09)
        with:
          script: |
            const marker = '<!-- prod-mutate-failure-summary -->';
            const pr = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: `${marker}\n## prod-mutate passing on \`${context.payload.pull_request.head.sha.slice(0,7)}\`\n\n_Cleared by the most recent green run._`,
              });
            }
