# Code-quality lint + static-analysis gate.
#
# Runs the per-language linters / static-security / style tools that the
# repo standardised on (see AGENTS.md "Code quality"). Each language's
# checks run ONLY when files of that language changed (a `changes` job
# computes per-language booleans from the PR diff), so an unrelated PR
# emits a fast green check without spinning up every toolchain.
#
# NOT a required status check (intentionally): it is not listed in
# .github/rulesets/main.json, so a transient lint-infra hiccup never
# blocks a merge. The signal is advisory-but-loud — on failure the job
# posts a gitleaks-scrubbed summary as a PR comment (same
# post-failure-comment composite e2e-tests.yml uses), so the failure is
# visible inline to humans and to agents via the PR API.
#
# All `uses:` are pinned to the exact SHAs already vetted elsewhere in
# this repo (no new actions introduced → no cooling-off needed).
name: code-quality
run-name: >-
  ${{ github.event_name == 'pull_request'
        && format('PR #{0} — {1}', github.event.pull_request.number, github.event.pull_request.title)
   || format('manual — @{0}', github.actor) }}

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: code-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Which languages changed? ──────────────────────────────────────
  # One git-diff pass → per-language booleans. The lint job gates each
  # tool step on the matching output so nothing runs for a language the
  # PR didn't touch.
  changes:
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.detect.outputs.any }}
      js: ${{ steps.detect.outputs.js }}
      py: ${{ steps.detect.outputs.py }}
      rb: ${{ steps.detect.outputs.rb }}
      sh: ${{ steps.detect.outputs.sh }}
      yaml: ${{ steps.detect.outputs.yaml }}
      css: ${{ steps.detect.outputs.css }}
      md: ${{ steps.detect.outputs.md }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3 (2026-06-02)
        with:
          fetch-depth: 0

      - name: Detect changed languages
        id: detect
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # On workflow_dispatch there is no PR base; lint everything.
          if [ -z "${BASE_REF:-}" ]; then
            for k in any js py rb sh yaml css md; do
              echo "${k}=true" >> "$GITHUB_OUTPUT"
            done
            echo "No base ref (manual run) — linting all languages."
            exit 0
          fi
          # Fetch the base ref WITHOUT --depth=1. Checkout already pulled
          # full history (fetch-depth: 0), but a `--depth=1` re-fetch
          # SHALLOWS origin/$BASE_REF to a single commit — so on a PR
          # whose merge-base with main sits deeper than that boundary
          # (every Decap-opened cms/* PR hit this), `git diff
          # origin/$BASE_REF...HEAD` died with `fatal: ...: no merge base`
          # → exit 128 → a red `code-quality` row. THAT crash — not
          # content lint — was the real source of the "code-quality reds
          # on cms PRs" (#1723 Cat 6). Fail SAFE: if the merge-base still
          # can't be computed (grafted/odd history), lint every language
          # rather than crashing or silently skipping.
          git fetch --no-tags origin "$BASE_REF" || true
          if ! CHANGED="$(git diff --name-only "origin/${BASE_REF}...HEAD" 2>/dev/null)"; then
            echo "Could not compute the merge-base against origin/${BASE_REF} (shallow/grafted history) — linting all languages (fail-safe)."
            for k in any js py rb sh yaml css md; do
              echo "${k}=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi
          echo "Changed files:"
          echo "$CHANGED"
          match() { echo "$CHANGED" | grep -qE "$1"; }
          js=false; py=false; rb=false; sh=false; yaml=false; css=false; md=false
          match '(^|/)(e2e|admin|scripts)/.*\.js$|\.config\.js$|^eslint\.config\.js$|^\.prettierrc\.json$|^package(-lock)?\.json$' && js=true
          match '\.py$|^pyproject\.toml$' && py=true
          match '^_plugins(_test)?/.*\.rb$|^\.rubocop\.yml$' && rb=true
          match '\.sh$|^\.githooks/|^\.shellcheckrc$' && sh=true
          match '^\.github/(workflows|actions)/.*\.ya?ml$|^\.github/dependabot\.yml$|^\.yamllint\.yml$' && yaml=true
          match '\.css$|^\.stylelintrc\.json$' && css=true
          match '\.md$|^\.markdownlint(-cli2)?\.jsonc$' && md=true
          any=false
          for v in "$js" "$py" "$rb" "$sh" "$yaml" "$css" "$md"; do
            [ "$v" = true ] && any=true
          done
          {
            echo "js=$js"; echo "py=$py"; echo "rb=$rb"; echo "sh=$sh"
            echo "yaml=$yaml"; echo "css=$css"; echo "md=$md"; echo "any=$any"
          } >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: ${{ needs.changes.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3 (2026-06-02)

      # ── JavaScript: eslint + prettier ──────────────────────────────
      - name: npm ci
        if: ${{ needs.changes.outputs.js == 'true' || needs.changes.outputs.css == 'true' || needs.changes.outputs.md == 'true' }}
        run: npm ci --no-audit --no-fund 2>&1 | tee -a /tmp/lint.log

      - name: ESLint
        if: ${{ needs.changes.outputs.js == 'true' }}
        run: |
          set -o pipefail
          npx eslint --no-error-on-unmatched-pattern "admin/**/*.js" "scripts/*.js" "*.config.js" 2>&1 | tee -a /tmp/lint.log

      - name: Prettier (check)
        if: ${{ needs.changes.outputs.js == 'true' }}
        run: |
          set -o pipefail
          npx prettier --no-error-on-unmatched-pattern --check "admin/**/*.js" "scripts/*.js" "*.config.js" 2>&1 | tee -a /tmp/lint.log

      # ── CSS: stylelint ─────────────────────────────────────────────
      - name: Stylelint
        if: ${{ needs.changes.outputs.css == 'true' }}
        run: |
          set -o pipefail
          npx stylelint --allow-empty-input "assets/css/*.css" "admin/*.css" 2>&1 | tee -a /tmp/lint.log

      # ── Markdown: markdownlint-cli2 ────────────────────────────────
      - name: markdownlint
        if: ${{ needs.changes.outputs.md == 'true' }}
        run: |
          set -o pipefail
          npx markdownlint-cli2 2>&1 | tee -a /tmp/lint.log

      # ── Python: ruff + mypy + bandit ───────────────────────────────
      - name: Install Python tools
        if: ${{ needs.changes.outputs.py == 'true' }}
        run: |
          python3 -m pip install --quiet --user \
            'ruff==0.15.8' 'bandit==1.9.4' 'mypy==1.19.1'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Ruff (lint + format)
        if: ${{ needs.changes.outputs.py == 'true' }}
        run: |
          set -o pipefail
          ruff check 2>&1 | tee -a /tmp/lint.log
          ruff format --check 2>&1 | tee -a /tmp/lint.log

      - name: mypy
        if: ${{ needs.changes.outputs.py == 'true' }}
        run: |
          set -o pipefail
          mypy 2>&1 | tee -a /tmp/lint.log

      - name: Bandit
        if: ${{ needs.changes.outputs.py == 'true' }}
        run: |
          set -o pipefail
          bandit -r oauth-proxy scripts tests -c pyproject.toml 2>&1 | tee -a /tmp/lint.log

      # ── Ruby: rubocop (standalone, Ruby 3.3 — parallel needs >=3.3) ─
      - name: Setup Ruby
        if: ${{ needs.changes.outputs.rb == 'true' }}
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f  # v1.310.0 (2026-05-20)
        with:
          ruby-version: '3.3'

      - name: RuboCop
        if: ${{ needs.changes.outputs.rb == 'true' }}
        run: |
          set -o pipefail
          gem install --no-document rubocop:1.86.2 rubocop-performance:1.26.1 2>&1 | tee -a /tmp/lint.log
          rubocop 2>&1 | tee -a /tmp/lint.log

      # ── Shell: shellcheck + shfmt ──────────────────────────────────
      - name: Install shell tools
        if: ${{ needs.changes.outputs.sh == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"   # bare ubuntu-latest has no ~/.local/bin (the prebaked CI image is gone)
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          curl -fsSL "https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64" \
            -o "$HOME/.local/bin/shfmt"
          chmod +x "$HOME/.local/bin/shfmt"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: ShellCheck + shfmt
        if: ${{ needs.changes.outputs.sh == 'true' }}
        run: |
          set -o pipefail
          # shellcheck disable=SC2046  # word-splitting the file list is intended
          shellcheck $(git ls-files '*.sh') .githooks/pre-commit 2>&1 | tee -a /tmp/lint.log
          # shellcheck disable=SC2046
          shfmt -i 2 -ci -bn -d $(git ls-files '*.sh') .githooks/pre-commit 2>&1 | tee -a /tmp/lint.log

      # ── YAML / Actions: yamllint + actionlint ──────────────────────
      - name: Install YAML tools
        if: ${{ needs.changes.outputs.yaml == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"   # bare ubuntu-latest has no ~/.local/bin (the prebaked CI image is gone)
          python3 -m pip install --quiet --user 'yamllint==1.38.0'
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" actionlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: yamllint + actionlint
        if: ${{ needs.changes.outputs.yaml == 'true' }}
        run: |
          set -o pipefail
          yamllint -c .yamllint.yml .github/ 2>&1 | tee -a /tmp/lint.log
          # The two head-ref "potentially untrusted" advisories are
          # reviewed false positives on same-repo Decap PRs (see
          # AGENTS.md "Code quality"); keep flagging every other input.
          actionlint -ignore '"github\.(event\.pull_request\.head\.ref|head_ref)" is potentially untrusted' 2>&1 | tee -a /tmp/lint.log

      # ── Surface failures inline (gitleaks-scrubbed) ────────────────
      - name: Post failure summary
        if: ${{ failure() && github.event_name == 'pull_request' }}
        # Repointed from the deleted local `./.github/actions/post-failure-comment`
        # to the platform's composite (same interface) now that the dogfood
        # consumes machinery from cms-platform. Pinned to the platform SHA.
        uses: Adam-S-Daniel/cms-platform/.github/actions/post-failure-comment@40e8eed074cb5c3d24c127d36070bf8bc4be91ba  # v0.1.11 (2026-06-04)
        with:
          mode: post
          log-file: /tmp/lint.log
          marker: code-quality-failure-summary
          title: code-quality
          gitleaks-version: 8.30.1

      - name: Resolve failure summary on success
        if: ${{ success() && github.event_name == 'pull_request' }}
        uses: Adam-S-Daniel/cms-platform/.github/actions/post-failure-comment@40e8eed074cb5c3d24c127d36070bf8bc4be91ba  # v0.1.11 (2026-06-04)
        with:
          mode: resolve
          marker: code-quality-failure-summary
          title: code-quality
