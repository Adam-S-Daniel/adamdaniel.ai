name: E2E Tests

on:
  pull_request:
    branches:
      - main
    # Skip when nothing the e2e suite covers can have changed —
    # docs/explainers, screenshots from local recordings, license
    # files, and CI workflows for unrelated pipelines. e2e/select-
    # specs.js handles the finer-grained "which specs to run" cut at
    # runtime, but coarse-skipping here saves the Ruby + Node +
    # Playwright bring-up entirely.
    #
    # Things deliberately NOT in the list (i.e. they DO trigger e2e):
    #   - any site source (caught by select-specs.js's fanout/per-spec rules)
    #   - any e2e/* file (test code itself)
    #   - playwright config files
    #   - package*.json / Gemfile* (dep changes can break tests)
    #   - .github/workflows/e2e-tests.yml (workflow self-validation)
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'ANALYTICS_SETUP.md'
      - 'docs/**'
      - '.agents/**'
      - 'screenshots/**'
      - 'recordings/**'
      - 'test-results/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitleaks.toml'
      - '.editorconfig'
      - '.bundle/**'
      - '.github/dependabot.yml'
      - '.github/workflows/secrets-scan.yml'
      - '.github/workflows/publish-scheduled-posts.yml'
      - '.github/workflows/cms-publish-loop-prod.yml'
      - '.github/workflows/claude.yml'

permissions:
  contents: read
  # Needed by the failure-summary step so we can post / update the
  # `<!-- e2e-failure-summary -->` comment on the PR. Read-only on
  # contents stays in place.
  pull-requests: write

concurrency:
  # Cancel any in-flight run for the same PR — saves minutes on
  # rapid-push spam.
  group: e2e-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (2026-01-09)

      - name: Setup Ruby
        uses: ruby/setup-ruby@0cb964fd540e0a24c900370abf38a33466142735  # v1.302.0 (2026-04-15)
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Run Jekyll plugin unit tests
        # Plain-Ruby tests under _plugins_test/ — fast (sub-second each),
        # no extra gems. Keeps plugin behaviour covered even when no
        # Playwright spec exercises the same code path.
        run: |
          # `nullglob` so the loop is a no-op (rather than passing the
          # literal pattern to ruby) if the directory is ever emptied.
          shopt -s nullglob
          for t in _plugins_test/*_test.rb; do
            echo "==> $t"
            bundle exec ruby "$t"
          done

  # Decide what e2e work is actually needed for this commit, and how
  # many shards to spin up. Hoisted out of the e2e matrix so the
  # selector runs once (not 4×) and so a baseline-only run can scale
  # the matrix down to a single shard — `playwright install-deps`
  # alone routinely adds 5-15 minutes per shard from apt-mirror tail
  # latency, and there's no point paying that 4× to run three sub-
  # second file-comparison tests.
  select:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.s.outputs.scope }}
      files: ${{ steps.s.outputs.files }}
      shards: ${{ steps.s.outputs.shards }}
      shard_count: ${{ steps.s.outputs.shard_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (2026-01-09)
        with:
          # Need history for `git diff origin/main...HEAD` so the spec
          # selector can decide which tests are actually relevant.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0 (2026-04-20)
        with:
          node-version: '20'

      - name: Decide scope and shard count
        id: s
        # Diff-aware subset against the base branch tip. The selector
        # itself has no npm deps — `node e2e/select-specs.js` runs
        # with the runner's stock Node, so we can skip `npm ci` here.
        run: |
          git fetch origin main --depth=500 || true
          # Fall back gracefully if the selector or git diff fails —
          # a broken selector should never block the PR. Run full
          # matrix.
          if ! node e2e/select-specs.js --base origin/main > /tmp/select.json 2>/tmp/select.err; then
            echo "Selector failed:"
            cat /tmp/select.err || true
            scope=all
            files=
          else
            cat /tmp/select.json
            scope=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/select.json')).scope)")
            files=$(node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/select.json'));console.log((j.files||[]).join(' '))")
          fi
          # Baseline-only runs (scope=skip) are pure file-comparison
          # tests with no browser work — sharding them is overhead
          # only. Collapse to a single job in that case.
          if [ "$scope" = "skip" ]; then
            shards='[1]'
            shard_count=1
          else
            shards='[1,2,3,4]'
            shard_count=4
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "shard_count=$shard_count" >> "$GITHUB_OUTPUT"
          echo "Resolved: scope=$scope shard_count=$shard_count"

  e2e:
    needs: select
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (2026-01-09)

      - name: Setup Ruby
        uses: ruby/setup-ruby@0cb964fd540e0a24c900370abf38a33466142735  # v1.302.0 (2026-04-15)
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0 (2026-04-20)
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5 (2026-04-13)
        with:
          path: ~/.cache/ms-playwright
          # Hash the lockfile so a @playwright/test version bump
          # produces a fresh cache entry. `playwright-all-` distinguishes
          # this triple-browser cache from the chromium-only one used
          # by visual-regression.yml.
          key: playwright-all-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium firefox webkit --with-deps

      - name: Install Playwright OS deps (browsers cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        # Browser binaries are cached, but the apt-installed system
        # libraries (libnss3, libnspr4, fonts, …) aren't — re-install
        # those without redownloading the browser tarballs.
        run: npx playwright install-deps chromium firefox webkit

      - name: Prepare shard output dir
        run: mkdir -p shard-output

      - name: Run Playwright tests (full matrix, shard ${{ matrix.shard }}/${{ needs.select.outputs.shard_count }})
        if: needs.select.outputs.scope == 'all'
        id: pw-full
        # `tee` captures the run log so the failure-summary job can
        # post the relevant block to the PR. `set -o pipefail` keeps
        # the test step's exit code visible to GHA's outcome.
        # `--reporter=blob,list` writes a blob report (for later merge
        # into a single HTML report) and prints to stdout for logs.
        env:
          # `cms-publish-loop.spec.js` and
          # `cms-publish-loop-preview.spec.js` self-skip when this is
          # empty (see e2e/decap-pat.js#getPat). Without exposing it,
          # they silently skipped on every host-repo PR for months —
          # `select-specs.js` was correctly *picking* them up but the
          # specs no-op'd at runtime, so the editorial-workflow loop
          # had no PR-time regression coverage. Forks don't see this
          # value (GitHub strips secrets from `pull_request` events
          # opened by external contributors), so the self-skip still
          # protects against fork PRs running real prod mutations.
          CMS_E2E_PAT: ${{ secrets.CMS_E2E_PAT }}
        run: |
          set -o pipefail
          npx playwright test \
            --shard=${{ matrix.shard }}/${{ needs.select.outputs.shard_count }} \
            --reporter=blob,list \
            2>&1 | tee shard-output/playwright-output.log

      - name: Run Playwright tests (selected subset, shard ${{ matrix.shard }}/${{ needs.select.outputs.shard_count }})
        if: needs.select.outputs.scope == 'subset'
        id: pw-subset
        env:
          # See the full-matrix step above for why this env line
          # exists — same self-skip semantics, same fork-safety.
          CMS_E2E_PAT: ${{ secrets.CMS_E2E_PAT }}
        run: |
          set -o pipefail
          npx playwright test ${{ needs.select.outputs.files }} \
            --shard=${{ matrix.shard }}/${{ needs.select.outputs.shard_count }} \
            --reporter=blob,list \
            2>&1 | tee shard-output/playwright-output.log

      - name: Run Playwright tests (baseline only)
        if: needs.select.outputs.scope == 'skip'
        id: pw-baseline
        # Always-run baseline keeps a smoke check on every PR so a
        # broken selector or harness regression can't sneak through.
        # No `--shard` flag — the select job collapses scope=skip to a
        # single matrix entry, so there's nothing to split.
        run: |
          set -o pipefail
          npx playwright test \
            e2e/compute-visual-diffs.test.js \
            e2e/cms-config.spec.js \
            e2e/visual-change-guard.spec.js \
            --reporter=blob,list \
            2>&1 | tee shard-output/playwright-output.log

      - name: Upload blob report (shard ${{ matrix.shard }})
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 (2026-04-10)
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 1

      - name: Upload shard log (shard ${{ matrix.shard }})
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 (2026-04-10)
        with:
          name: shard-log-${{ matrix.shard }}
          path: shard-output/playwright-output.log
          retention-days: 1

      - name: Upload test results (shard ${{ matrix.shard }})
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 (2026-04-10)
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # G3 — `@parity` subset against prod, on every PR.
  #
  # The `TARGET=prod` env switch (e2e/base.js) overrides Playwright's
  # `baseURL` fixture so every `page.goto("/foo")` and
  # `page.request.get("/foo")` routes against https://adamdaniel.ai. The
  # `@parity` static lint (e2e/parity-tag-lint.test.js) guarantees every
  # spec we run here is read-only, so this job cannot mutate prod even
  # if a regression sneaks past local. Single project (chromium-desktop)
  # keeps the network footprint tight; the matrix multiplier adds
  # nothing for read-only HTTP/DOM probes.
  #
  # Non-blocking: this job is purely informational while @parity coverage
  # grows. It does NOT carry `needs:` from `select` or `e2e`, so a stuck
  # selector can't block parity, and a parity failure can't block the
  # merge gate. Branch protection can promote it to required later.
  parity:
    runs-on: ubuntu-latest
    # Run against the latest commit of every PR. Forks don't block on
    # this — the parity probe is read-only and uses no secrets.
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (2026-01-09)

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0 (2026-04-20)
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Playwright browsers (chromium only)
        id: pw-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5 (2026-04-13)
        with:
          path: ~/.cache/ms-playwright
          # `playwright-parity-` keeps this chromium-only cache distinct
          # from the full triple-browser cache used by the `e2e` matrix.
          key: playwright-parity-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright OS deps (chromium)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run @parity subset against prod
        env:
          TARGET: prod
        # `--grep @parity` selects every test/describe with the tag in its
        # title. The static lint (e2e/parity-tag-lint.test.js) ships in the
        # same matrix so a violating tag-grab fails *here* before doing any
        # remote IO.
        run: |
          set -o pipefail
          npx playwright test \
            --grep @parity \
            --project=chromium-desktop \
            --reporter=list \
            2>&1 | tee /tmp/parity-output.log

      - name: Upload parity test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 (2026-04-10)
        with:
          name: test-results-parity-prod
          path: |
            test-results/
            /tmp/parity-output.log
          retention-days: 7

  finalize:
    if: ${{ !cancelled() }}
    needs: [e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (2026-01-09)

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0 (2026-04-20)
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1 (2026-03-11)
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge blob reports into single HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload merged HTML report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 (2026-04-10)
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Download shard logs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1 (2026-03-11)
        with:
          path: all-shard-logs
          pattern: shard-log-*

      - name: Concatenate shard logs
        run: |
          : > /tmp/playwright-output.log
          # `nullglob` so an empty `all-shard-logs/` (e.g. when every
          # matrix shard was cancelled) leaves the loop body unrun
          # rather than feeding the literal pattern to `basename`.
          shopt -s nullglob
          for d in all-shard-logs/shard-log-*; do
            shard=$(basename "$d" | sed 's/shard-log-//')
            echo "===== shard $shard =====" >> /tmp/playwright-output.log
            if [ -f "$d/playwright-output.log" ]; then
              cat "$d/playwright-output.log" >> /tmp/playwright-output.log
            else
              echo "(no log captured)" >> /tmp/playwright-output.log
            fi
            echo "" >> /tmp/playwright-output.log
          done

      # ── Failure summary on the PR ────────────────────────────────
      # Without log access from outside the workflow, a failed CI
      # run is opaque to anyone (or any agent) iterating on a PR.
      # Surface the actual Playwright failure blocks as a PR
      # comment, scrubbed of secrets via gitleaks first.
      - name: Determine if any shard failed
        id: e2e-status
        if: always()
        # `needs.e2e.result` is "success" only when every matrix
        # entry succeeded; "failure" when any failed; "cancelled"
        # when any was cancelled.
        run: |
          if [ "${{ needs.e2e.result }}" = "failure" ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install gitleaks
        if: steps.e2e-status.outputs.failed == 'true'
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xzC /usr/local/bin gitleaks
          gitleaks version

      - name: Extract and scrub failure summary
        if: steps.e2e-status.outputs.failed == 'true'
        run: |
          bash scripts/extract-playwright-failures.sh /tmp/playwright-output.log > /tmp/failures-raw.txt || true
          if [ ! -s /tmp/failures-raw.txt ]; then
            # Fallback: send the tail of the log so the comment isn't empty.
            tail -c 80000 /tmp/playwright-output.log > /tmp/failures-raw.txt
          fi
          node scripts/scrub-secrets.js /tmp/failures-raw.txt /tmp/failures-clean.txt
          # Truncate to fit comfortably in a GitHub comment
          # (the hard cap is ~65 535 chars; leave headroom for the
          # surrounding markdown).
          head -c 60000 /tmp/failures-clean.txt > /tmp/failures-final.txt

      - name: Post failure summary to PR
        if: steps.e2e-status.outputs.failed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0 (2026-04-09)
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('/tmp/failures-final.txt', 'utf8');
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              '<!-- e2e-failure-summary -->',
              `## ❌ E2E test failures on \`${sha}\``,
              '',
              `[View full run](${runUrl})`,
              '',
              '<details>',
              '<summary>Failure log (secrets redacted via gitleaks)</summary>',
              '',
              '```',
              summary || '(no failure block matched the extractor; see the run for full output)',
              '```',
              '',
              '</details>',
              '',
              '*Posted automatically. The comment refreshes on every CI run; the most recent failures are always shown here.*',
            ].join('\n');

            const pr = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
            });
            const marker = '<!-- e2e-failure-summary -->';
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body,
              });
            }

      - name: Resolve failure-summary comment on success
        if: always() && steps.e2e-status.outputs.failed != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0 (2026-04-09)
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
            });
            const marker = '<!-- e2e-failure-summary -->';
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: `${marker}\n## ✅ E2E tests passing on \`${context.payload.pull_request.head.sha.slice(0,7)}\`\n\n_Cleared by the most recent green run._`,
              });
            }

      - name: Re-fail if any shard failed
        if: needs.e2e.result == 'failure'
        run: |
          echo "One or more matrix shards failed."
          exit 1
