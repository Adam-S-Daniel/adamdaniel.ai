name: E2E Tests

on:
  pull_request:
    branches:
      - main
    # Skip when nothing the e2e suite covers can have changed —
    # docs/explainers, screenshots from local recordings, license
    # files, and CI workflows for unrelated pipelines. e2e/select-
    # specs.js handles the finer-grained "which specs to run" cut at
    # runtime, but coarse-skipping here saves the Ruby + Node +
    # Playwright bring-up entirely.
    #
    # Things deliberately NOT in the list (i.e. they DO trigger e2e):
    #   - any site source (caught by select-specs.js's fanout/per-spec rules)
    #   - any e2e/* file (test code itself)
    #   - playwright config files
    #   - package*.json / Gemfile* (dep changes can break tests)
    #   - .github/workflows/e2e-tests.yml (workflow self-validation)
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'ANALYTICS_SETUP.md'
      - 'docs/**'
      - '.agents/**'
      - 'screenshots/**'
      - 'recordings/**'
      - 'test-results/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitleaks.toml'
      - '.editorconfig'
      - '.bundle/**'
      - '.github/dependabot.yml'
      - '.github/workflows/secrets-scan.yml'
      - '.github/workflows/publish-scheduled-posts.yml'
      - '.github/workflows/cms-publish-loop-prod.yml'

permissions:
  contents: read
  # Needed by the failure-summary step so we can post / update the
  # `<!-- e2e-failure-summary -->` comment on the PR. Read-only on
  # contents stays in place.
  pull-requests: write

defaults:
  run:
    # GHA defaults the shell to `sh -e {0}` inside `container:` jobs,
    # but several of our run-blocks use `set -o pipefail` and other
    # bash-isms. Force bash workflow-wide so the same scripts work
    # both inside the Playwright container and on stock ubuntu-latest.
    shell: bash

concurrency:
  # Cancel any in-flight run for the same PR — saves minutes on
  # rapid-push spam.
  group: e2e-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (2026-01-09)

      - name: Setup Ruby
        uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f  # v1.306.0 (2026-04-26)
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Run Jekyll plugin unit tests
        # Plain-Ruby tests under _plugins_test/ — fast (sub-second each),
        # no extra gems. Keeps plugin behaviour covered even when no
        # Playwright spec exercises the same code path.
        run: |
          set -o pipefail
          # `nullglob` so the loop is a no-op (rather than passing the
          # literal pattern to ruby) if the directory is ever emptied.
          shopt -s nullglob
          for t in _plugins_test/*_test.rb; do
            echo "==> $t"
            bundle exec ruby "$t"
          done 2>&1 | tee /tmp/unit.log

      - name: Run sync-action-pin-comments tests
        # Pure-bash test for the action-pin comment-syncer. Stubs
        # `gh` via a path-shadowing wrapper, so this runs offline
        # and never hits the GitHub API. Sub-second.
        run: |
          set -o pipefail
          bash scripts/sync-action-pin-comments.test.sh 2>&1 | tee -a /tmp/unit.log

      # Failure-comment fan-out — see AGENTS.md "Failure-comment
      # composite action". Two call sites (post / resolve), gitleaks-
      # scrubbed via the composite action.
      - name: Post failure summary
        if: ${{ failure() && github.event_name == 'pull_request' }}
        uses: ./.github/actions/post-failure-comment
        with:
          mode: post
          log-file: /tmp/unit.log
          marker: unit-failure-summary
          title: unit

      - name: Resolve failure summary on success
        if: ${{ success() && github.event_name == 'pull_request' }}
        uses: ./.github/actions/post-failure-comment
        with:
          mode: resolve
          marker: unit-failure-summary
          title: unit

  # Decide what e2e work is actually needed for this commit, and how
  # many shards to spin up. Hoisted out of the e2e matrix so the
  # selector runs once (not 4×) and so a baseline-only run can scale
  # the matrix down to a single shard — `playwright install-deps`
  # alone routinely adds 5-15 minutes per shard from apt-mirror tail
  # latency, and there's no point paying that 4× to run three sub-
  # second file-comparison tests.
  select:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.s.outputs.scope }}
      files: ${{ steps.s.outputs.files }}
      shards: ${{ steps.s.outputs.shards }}
      shard_count: ${{ steps.s.outputs.shard_count }}
      # Lane-aware envelope. `real_scope` / `real_files` carry the
      # real-lane verdict (computed by re-running the selector with
      # TEST_LANE=real). The companion `e2e-real` job consumes them.
      real_scope: ${{ steps.s.outputs.real_scope }}
      real_files: ${{ steps.s.outputs.real_files }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (2026-01-09)
        with:
          # Need history for `git diff origin/main...HEAD` so the spec
          # selector can decide which tests are actually relevant.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0 (2026-04-20)
        with:
          node-version: '20'

      - name: Init select log
        # Single log file the failure-comment step reads from. Both
        # run-blocks below tee-append into it so a select-side failure
        # surfaces the actionable lines (image-tag mismatch or selector
        # crash output) on the PR.
        run: |
          : > /tmp/select.log

      - name: Verify Playwright image version matches lockfile
        # Drift guard for the `mcr.microsoft.com/playwright:v<version>-noble`
        # container images used by every Playwright job in this repo.
        # Docker tags don't auto-update with `package-lock.json`, so a
        # `@playwright/test` bump that lands without a matching tag bump
        # would have the runtime client and the prebuilt browsers on
        # different versions — silent test-time breakage. This step
        # fails the build before any test runs.
        #
        # Source of truth: `packages["node_modules/@playwright/test"]`'s
        # `version` field in `package-lock.json` — that's the resolved
        # version npm actually installs (the `dependencies.version` in
        # `package.json` may be a range like `^1.59.0`).
        run: |
          set -euo pipefail
          # Tee everything to /tmp/select.log so a failure here lands in
          # the PR comment via the post-failure-comment composite action.
          exec > >(tee -a /tmp/select.log) 2>&1
          expected=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "Lockfile @playwright/test version: $expected"

          mismatches=0
          # `nullglob` so an empty `.github/workflows/` (impossible in
          # practice but cheap to defend against) leaves the loop body
          # unrun rather than feeding the literal pattern through.
          # Required by e2e/workflow-shell-glob-lint.test.js.
          shopt -s nullglob
          for f in .github/workflows/*.yml; do
            # Extract every `mcr.microsoft.com/playwright:v<version>` tag
            # from the file. `grep -oE` prints one match per line; if a
            # workflow doesn't reference the image at all the loop body
            # is just a no-op for that file.
            while read -r tag; do
              # `tag` looks like `v1.59.1-noble` or `v1.59.1`. Strip the
              # leading `v` and any `-<flavor>` suffix to get a bare
              # SemVer string for comparison.
              found=${tag#v}
              found=${found%%-*}
              if [ "$found" != "$expected" ]; then
                echo "::error file=$f::Playwright image tag '$tag' disagrees with package-lock.json's '$expected'."
                mismatches=$((mismatches + 1))
              fi
            done < <(grep -oE 'mcr\.microsoft\.com/playwright:v[0-9]+\.[0-9]+\.[0-9]+(-[a-z]+)?' "$f" | sed 's|mcr\.microsoft\.com/playwright:||')
          done

          if [ "$mismatches" -gt 0 ]; then
            # Plain `echo` + `printf` instead of a HEREDOC so YAML pipe-
            # block indentation can't mis-frame the terminator.
            {
              echo ""
              echo "Playwright Docker image tag(s) disagree with package-lock.json."
              echo ""
              echo "Lockfile says: $expected"
              echo "To fix, bump every workflow tag to match. From the repo root:"
              echo ""
              echo "    sed -i 's|mcr.microsoft.com/playwright:v[^\"[:space:]]*-noble|mcr.microsoft.com/playwright:v${expected}-noble|g' .github/workflows/*.yml"
              echo ""
              echo "Then re-commit. The image must exist in the registry — verify"
              echo "with: docker pull mcr.microsoft.com/playwright:v${expected}-noble"
            } >&2
            exit 1
          fi
          echo "All Playwright image tags match the lockfile version."

      - name: Decide scope and shard count
        id: s
        # Diff-aware subset against the base branch tip. The selector
        # itself has no npm deps — `node e2e/select-specs.js` runs
        # with the runner's stock Node, so we can skip `npm ci` here.
        #
        # Layer 2: shard count comes from the selector's envelope
        # (`shard_count`), which scales the matrix to the subset's
        # size — small subsets (≤2 light browser specs) collapse to
        # a single shard, mid-sized subsets to 2, and the rest pay
        # the full 4-way fanout. The required check is `e2e (1)`,
        # and the matrix array is built `[1..shard_count]`, so shard
        # 1 always fires. If the selector blows up, we fall through
        # to the 4-way matrix so a broken selector can never lose
        # coverage.
        env:
          # GHA does NOT auto-populate GITHUB_HEAD_REF inside `step.env`;
          # it's only available via the `github.head_ref` context. Pass
          # it through explicitly so select-specs.js can honour the
          # `@select-skip-when-head-ref-prefix:` directive (Layer 3.A) —
          # specs that self-skip on `cms/*` PRs are filtered out of the
          # selection envelope, eliminating their bring-up cost. Empty
          # for non-PR triggers (cron / dispatch); selector treats empty
          # as "no filtering".
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          # Tee everything to /tmp/select.log so a failure here lands in
          # the PR comment via the post-failure-comment composite action.
          exec > >(tee -a /tmp/select.log) 2>&1
          git fetch origin main --depth=500 || true
          # Local-lane verdict (existing behaviour). TEST_LANE defaults
          # to `local` in the selector when the env var is empty, but
          # set it explicitly here for symmetry with the real-lane run.
          if ! TEST_LANE=local node e2e/select-specs.js --base origin/main > /tmp/select.json 2>/tmp/select.err; then
            echo "Selector failed (local lane):"
            cat /tmp/select.err || true
            scope=all
            files=
            shard_count=4
          else
            cat /tmp/select.json
            scope=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/select.json')).scope)")
            files=$(node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/select.json'));console.log((j.files||[]).join(' '))")
            # `|| 4` defends against a future selector version that
            # forgets the field — keep coverage even if the envelope
            # contract drifts.
            shard_count=$(node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/select.json'));console.log(j.shard_count || 4)")
          fi
          # Real-lane verdict. The selector's same SPEC_RULES + lane
          # filter combo determines which @lane:real specs the diff
          # touches. Failures here fall through to scope=all so a
          # broken selector can't silently drop the real lane.
          if ! TEST_LANE=real node e2e/select-specs.js --base origin/main > /tmp/select-real.json 2>/tmp/select-real.err; then
            echo "Selector failed (real lane):"
            cat /tmp/select-real.err || true
            real_scope=all
            real_files=
          else
            cat /tmp/select-real.json
            real_scope=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/select-real.json')).scope)")
            real_files=$(node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/select-real.json'));console.log((j.files||[]).join(' '))")
          fi
          # Build the matrix array as [1..shard_count]. Hardcoded
          # cases keep the bash trivial (no `seq` / `jq` dep) and
          # cover every value pickShardCount() can return today.
          case "$shard_count" in
            1) shards='[1]' ;;
            2) shards='[1,2]' ;;
            3) shards='[1,2,3]' ;;
            4) shards='[1,2,3,4]' ;;
            *)
              # Unknown count — fall back to the full matrix so the
              # required check (`e2e (1)`) still fires and we don't
              # silently skip shards.
              shards='[1,2,3,4]'
              shard_count=4
              ;;
          esac
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "shard_count=$shard_count" >> "$GITHUB_OUTPUT"
          echo "real_scope=$real_scope" >> "$GITHUB_OUTPUT"
          echo "real_files=$real_files" >> "$GITHUB_OUTPUT"
          echo "Resolved: scope=$scope shard_count=$shard_count shards=$shards real_scope=$real_scope"

      # Failure-comment fan-out — see AGENTS.md "Failure-comment
      # composite action". Two call sites (post / resolve), gitleaks-
      # scrubbed via the composite action. Select-side failures are
      # rare but the failure mode (image-tag mismatch or selector
      # crash) has a clear actionable error message that's worth
      # surfacing inline rather than making the operator click into
      # the run.
      - name: Post failure summary
        if: ${{ failure() && github.event_name == 'pull_request' }}
        uses: ./.github/actions/post-failure-comment
        with:
          mode: post
          log-file: /tmp/select.log
          marker: select-failure-summary
          title: select

      - name: Resolve failure summary on success
        if: ${{ success() && github.event_name == 'pull_request' }}
        uses: ./.github/actions/post-failure-comment
        with:
          mode: resolve
          marker: select-failure-summary
          title: select

  e2e:
    needs: select
    runs-on: ubuntu-latest
    # Prebuilt Playwright image — browsers + their apt deps (libnss3,
    # libnspr4, fonts, …) are baked in. Replaces the `actions/cache` +
    # `playwright install` + `playwright install-deps` triple step that
    # previously paid 5–15 minutes of apt-mirror tail latency per shard
    # whenever the deb mirror was flaky. The tag MUST match
    # `package-lock.json`'s `@playwright/test` version; the
    # `select` job's "Verify Playwright image version matches lockfile"
    # step fails the build if any workflow drifts.
    env:
      # Firefox refuses to launch when $HOME is owned by a different
      # user. Inside GHA's container jobs the runner injects
      # `-e HOME=/github/home` at `docker create` time (owned by the
      # image's `pwuser`); attempting to override that via
      # `container.env` is a no-op because GHA's injection wins. The
      # runner DOES honour job-level `env:` — it `export`s those into
      # every step's shell after `docker exec`, so HOME=/root takes
      # effect by the time `npx playwright test` runs. Firefox bails
      # with "Running Nightly as root in a regular user's session is
      # not supported" without this. Chromium and WebKit are
      # unaffected; setting it uniformly keeps configuration simple.
      HOME: /root
      # `TEST_LANE=local` pins this job to the hermetic lane. Spec
      # headers carry a `// @lane: local|real` directive (default
      # local); the selector filters by lane and the test runner
      # honours the same env var. The companion `e2e-real` job
      # carries the GitHub-backed lane on its own runner.
      TEST_LANE: local
      # Public-page projects only — admin specs (tagged @admin-write
      # / @admin-read / @admin-screenshots) are excluded from these
      # 8 projects via `grepInvert` in playwright.config.js. The
      # dedicated `e2e-admin` job below runs the admin lane on
      # chromium-desktop-3k + webkit-iphone16. Splitting the two
      # matrices decouples their concerns (different viewports,
      # different tag scopes, different secret needs, different
      # failure modes) and keeps shard timing predictable per lane.
      PUBLIC_PROJECT_FLAGS: >-
        --project=chromium-desktop
        --project=chromium-laptop
        --project=chromium-mobile
        --project=firefox-desktop
        --project=webkit-tablet
        --project=chromium-large-text
        --project=chromium-light
        --project=chromium-forced-colors
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (2026-01-09)

      - name: Install Ruby toolchain prerequisites
        # The Playwright noble image ships with `libgmp` (a browser
        # dep) but not `libyaml-0-2`, which `ruby/setup-ruby`'s
        # prebuilt Ruby 3.2 tarball needs at link time, and not
        # `build-essential`, which `bundler-cache` needs to build the
        # native extensions in our Gemfile (`http_parser.rb`,
        # `eventmachine`). Skip either and `bundle install` fails with
        # "make: not found" or a libyaml linker error.
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends libyaml-0-2 build-essential

      - name: Setup Ruby
        # Required because `playwright.config.js`'s `webServer` block
        # runs `bundle exec jekyll build && npx serve _site` for
        # `TARGET=local` (the default). Without Ruby + bundler in the
        # container, the webServer would fail at `bundle: not found`
        # before any spec runs. Several specs also read `_site/` files
        # directly (sitemap, image-alt-text, draft-isolation, the cms
        # lifecycle suite) — the webServer's build is what produces
        # those for the spec to read.
        uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f  # v1.306.0 (2026-04-26)
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0 (2026-04-20)
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare shard output dir
        run: mkdir -p shard-output

      - name: Run Playwright tests (full matrix, shard ${{ matrix.shard }}/${{ needs.select.outputs.shard_count }})
        if: needs.select.outputs.scope == 'all'
        id: pw-full
        # `tee` captures the run log so the failure-summary job can
        # post the relevant block to the PR. `set -o pipefail` keeps
        # the test step's exit code visible to GHA's outcome.
        # `--reporter=blob,list` writes a blob report (for later merge
        # into a single HTML report) and prints to stdout for logs.
        env:
          # `cms-publish-loop.spec.js` and
          # `cms-publish-loop-preview.spec.js` self-skip when this is
          # empty (see e2e/decap-pat.js#getPat). Without exposing it,
          # they silently skipped on every host-repo PR for months —
          # `select-specs.js` was correctly *picking* them up but the
          # specs no-op'd at runtime, so the editorial-workflow loop
          # had no PR-time regression coverage. Forks don't see this
          # value (GitHub strips secrets from `pull_request` events
          # opened by external contributors), so the self-skip still
          # protects against fork PRs running real prod mutations.
          CMS_E2E_PAT: ${{ secrets.CMS_E2E_PAT }}
        run: |
          set -o pipefail
          npx playwright test \
            $PUBLIC_PROJECT_FLAGS \
            --shard=${{ matrix.shard }}/${{ needs.select.outputs.shard_count }} \
            --reporter=blob,list \
            2>&1 | tee shard-output/playwright-output.log

      - name: Run Playwright tests (selected subset, shard ${{ matrix.shard }}/${{ needs.select.outputs.shard_count }})
        if: needs.select.outputs.scope == 'subset'
        id: pw-subset
        env:
          # See the full-matrix step above for why this env line
          # exists — same self-skip semantics, same fork-safety.
          CMS_E2E_PAT: ${{ secrets.CMS_E2E_PAT }}
        run: |
          set -o pipefail
          npx playwright test ${{ needs.select.outputs.files }} \
            $PUBLIC_PROJECT_FLAGS \
            --shard=${{ matrix.shard }}/${{ needs.select.outputs.shard_count }} \
            --reporter=blob,list \
            2>&1 | tee shard-output/playwright-output.log

      - name: Run Playwright tests (baseline only)
        if: needs.select.outputs.scope == 'skip'
        id: pw-baseline
        # Always-run baseline keeps a smoke check on every PR so a
        # broken selector or harness regression can't sneak through.
        # No `--shard` flag — the select job collapses scope=skip to a
        # single matrix entry, so there's nothing to split. No project
        # filter either — the three baseline files are pure-Node /
        # config-fs tests and don't fan out per project.
        run: |
          set -o pipefail
          npx playwright test \
            e2e/compute-visual-diffs.test.js \
            e2e/cms-config.spec.js \
            e2e/visual-change-guard.spec.js \
            --reporter=blob,list \
            2>&1 | tee shard-output/playwright-output.log

      - name: Upload blob report (shard ${{ matrix.shard }})
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 (2026-04-10)
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 1

      - name: Upload shard log (shard ${{ matrix.shard }})
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 (2026-04-10)
        with:
          name: shard-log-${{ matrix.shard }}
          path: shard-output/playwright-output.log
          retention-days: 1

      - name: Upload test results (shard ${{ matrix.shard }})
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 (2026-04-10)
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # ── Admin-lane matrix ────────────────────────────────────────────
  # Sister to the `e2e` matrix above. Runs the two admin Playwright
  # projects — chromium-desktop-3k (every @admin-write / @admin-read /
  # @admin-screenshots tag) and webkit-iphone16 (@admin-read only) —
  # which together exercise the /admin/* surface contributors actually
  # touch. The 8 public projects' grepInvert filters keep admin tests
  # OUT of the `e2e` matrix; this job's --project filters keep public
  # tests OUT of admin.
  #
  # Single shard for now: ~38 admin tests on chromium-desktop-3k +
  # ~18 on webkit-iphone16 = ~56 tuples, well-served by Playwright's
  # default in-process worker parallelism on one runner. If admin
  # runtime becomes the long pole, hoist the matrix to
  # `shard: [1,2]` (and update finalize_gate_test.rb's job-name list).
  #
  # Always runs when the workflow fires (mirrors the `e2e` job — no
  # job-level `if:` gate). On baseline-only diffs (`scope == skip`)
  # the playwright invocation steps below are gated off so the
  # container does its bring-up + immediate-exit, which is the
  # cheapest path that still produces a stable `e2e-admin` check
  # context. Required-status-checks needs the context to always
  # exist; gating the JOB on scope would create the missing-check
  # merge-block trap.
  e2e-admin:
    needs: select
    runs-on: ubuntu-latest
    env:
      # See the e2e job above for HOME=/root rationale.
      HOME: /root
      TEST_LANE: local
      # Admin projects only — see playwright.config.js for the
      # ADMIN_TAGS_ALL / ADMIN_TAGS_READ regex contracts these
      # projects grep on.
      ADMIN_PROJECT_FLAGS: >-
        --project=chromium-desktop-3k
        --project=webkit-iphone16
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (2026-01-09)

      - name: Install Ruby toolchain prerequisites
        # Same reason as the e2e job — libyaml-0-2 + build-essential
        # aren't in the Playwright noble image but ruby/setup-ruby +
        # bundler need them. Several admin specs (cms-page-crud,
        # cms-link-crawler, etc.) reach into _site/ for parity probes
        # and need Jekyll built locally.
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends libyaml-0-2 build-essential

      - name: Setup Ruby
        uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f  # v1.306.0 (2026-04-26)
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0 (2026-04-20)
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare shard output dir
        run: mkdir -p shard-output

      - name: Run Playwright admin tests (full matrix)
        if: needs.select.outputs.scope == 'all'
        id: pw-admin-full
        env:
          # Same self-skip semantics + fork safety as the e2e job —
          # cms-publish-loop.spec.js, cms-publish-loop-preview.spec.js,
          # cms-publish-loop-prod-mutate.spec.js, etc., all gate on
          # workflow-specific env opt-ins (RUN_HOST_REPO_PUBLISH_LOOP,
          # RUN_PROD_MUTATE_PLAYGROUND), so the PAT being present here
          # only enables the read-side fixture fetches their bodies
          # need before they self-skip.
          CMS_E2E_PAT: ${{ secrets.CMS_E2E_PAT }}
        run: |
          set -o pipefail
          npx playwright test \
            $ADMIN_PROJECT_FLAGS \
            --reporter=blob,list \
            2>&1 | tee shard-output/playwright-output.log

      - name: Run Playwright admin tests (selected subset)
        if: needs.select.outputs.scope == 'subset'
        id: pw-admin-subset
        env:
          CMS_E2E_PAT: ${{ secrets.CMS_E2E_PAT }}
        # If the diff selected zero admin specs, this invocation runs
        # zero tests across the admin projects and exits clean — no
        # special-case needed.
        run: |
          set -o pipefail
          npx playwright test ${{ needs.select.outputs.files }} \
            $ADMIN_PROJECT_FLAGS \
            --reporter=blob,list \
            2>&1 | tee shard-output/playwright-output.log

      # Upload steps use `if-no-files-found: ignore` so the
      # baseline-only path (scope=skip → no playwright invocation
      # → no blob/log/results dirs) doesn't fail the job. The
      # required-check shape stays green even on those runs.
      - name: Upload admin blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 (2026-04-10)
        with:
          # Same `blob-report-*` prefix as the e2e shards so the
          # finalize job's merged HTML report covers both lanes.
          name: blob-report-admin
          path: blob-report
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload admin shard log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 (2026-04-10)
        with:
          name: shard-log-admin
          path: shard-output/playwright-output.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload admin test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 (2026-04-10)
        with:
          # Same `test-results-shard-*` prefix as the e2e shards so the
          # finalize job's per-test-frames merge picks up admin captures.
          name: test-results-shard-admin
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      # Failure-comment fan-out — see AGENTS.md "Failure-comment
      # composite action". Distinct marker so it doesn't clobber the
      # e2e (public-lane), e2e-real, or parity comments.
      - name: Post failure summary
        if: ${{ failure() && github.event_name == 'pull_request' }}
        uses: ./.github/actions/post-failure-comment
        with:
          mode: post
          log-file: shard-output/playwright-output.log
          marker: e2e-admin-failure-summary
          title: e2e-admin

      - name: Resolve failure summary on success
        if: ${{ success() && github.event_name == 'pull_request' }}
        uses: ./.github/actions/post-failure-comment
        with:
          mode: resolve
          marker: e2e-admin-failure-summary
          title: e2e-admin

  # G5 — GitHub-backed (`@lane: real`) lane.
  #
  # Sister job to `e2e` above. Where `e2e` runs the @lane:local subset
  # against the local Jekyll + decap-server stack, this job runs the
  # @lane:real subset against the actual GitHub repo (and, where
  # applicable, the prod / preview-PR sites). Spec headers carry the
  # `// @lane: local|real` directive that drives selection on both
  # sides — the selector filters by lane, and the test runner sees
  # `TEST_LANE=real` and can branch on it too.
  #
  # Skipped at the job level when no @lane:real spec is touched by
  # the diff (`select.outputs.real_scope == 'skip'`) so we don't pay
  # container bring-up just to no-op. The required-check shape is
  # `e2e-real`, distinct from the local lane's `e2e (1)`.
  #
  # No matrix today: the @lane:real spec set is small enough that a
  # single shard finishes well inside the sharded local-lane budget,
  # and the work is dominated by network latency, not local CPU. If
  # the set grows we can re-introduce sharding here.
  #
  # Non-blocking: this job is informational while real-lane coverage
  # is being seeded (Phase A). It does NOT promote to required until
  # the real-lane spec set has settled. Branch protection can promote
  # it later in a separate PR.
  e2e-real:
    needs: select
    if: needs.select.outputs.real_scope != 'skip'
    runs-on: ubuntu-latest
    env:
      # Firefox refuses to launch when $HOME is owned by a different
      # user. See the `e2e` job above for the full rationale.
      HOME: /root
      # Pin the lane to `real` so spec headers + the test runner agree.
      TEST_LANE: real
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (2026-01-09)

      - name: Install Ruby toolchain prerequisites
        # The Playwright noble image ships with `libgmp` (a browser
        # dep) but not `libyaml-0-2`, which `ruby/setup-ruby`'s
        # prebuilt Ruby 3.2 tarball needs at link time, and not
        # `build-essential`, which `bundler-cache` needs to build the
        # native extensions in our Gemfile.
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends libyaml-0-2 build-essential

      - name: Setup Ruby
        # Several @lane:real specs still reach into `_site/` for
        # local-vs-real parity comparisons; the webServer skips its
        # build when TARGET isn't local, so build explicitly here.
        uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f  # v1.306.0 (2026-04-26)
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0 (2026-04-20)
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare shard output dir
        run: mkdir -p shard-output

      - name: Run Playwright tests (real lane)
        id: pw-real
        env:
          # `cms-publish-loop*.spec.js` and `cms-delete-published.spec.js`
          # self-skip when this is empty (see e2e/decap-pat.js#getPat).
          # Forks don't see the secret — GitHub strips it from
          # pull_request events opened by external contributors —
          # which keeps fork PRs from running real prod mutations.
          CMS_E2E_PAT: ${{ secrets.CMS_E2E_PAT }}
        run: |
          set -o pipefail
          # `select.outputs.real_files` is space-separated when the
          # selector returned scope=subset; empty when scope=all.
          # Empty falls through to the runner's own lane filter,
          # which TEST_LANE=real promotes to "every @lane:real spec".
          if [ "${{ needs.select.outputs.real_scope }}" = "subset" ]; then
            npx playwright test ${{ needs.select.outputs.real_files }} \
              --reporter=blob,list \
              2>&1 | tee shard-output/playwright-output.log
          else
            npx playwright test \
              --reporter=blob,list \
              2>&1 | tee shard-output/playwright-output.log
          fi

      - name: Upload blob report (real lane)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 (2026-04-10)
        with:
          # Distinct prefix so the finalize job's `blob-report-*`
          # download captures both lanes in the merged HTML report.
          name: blob-report-real
          path: blob-report
          retention-days: 1

      - name: Upload shard log (real lane)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 (2026-04-10)
        with:
          name: shard-log-real
          path: shard-output/playwright-output.log
          retention-days: 1

      - name: Upload test results (real lane)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 (2026-04-10)
        with:
          # Same prefix as the local-lane shards so the finalize job's
          # frame-merge step picks up real-lane captures too.
          name: test-results-shard-real
          path: test-results/
          retention-days: 7

      # Failure-comment fan-out — see AGENTS.md "Failure-comment
      # composite action". Two call sites (post / resolve), gitleaks-
      # scrubbed via the composite action.
      - name: Post failure summary
        if: ${{ failure() && github.event_name == 'pull_request' }}
        uses: ./.github/actions/post-failure-comment
        with:
          mode: post
          log-file: shard-output/playwright-output.log
          marker: e2e-real-failure-summary
          title: e2e-real

      - name: Resolve failure summary on success
        if: ${{ success() && github.event_name == 'pull_request' }}
        uses: ./.github/actions/post-failure-comment
        with:
          mode: resolve
          marker: e2e-real-failure-summary
          title: e2e-real

  # G3 — `@parity` subset against prod, on every PR.
  #
  # The `TARGET=prod` env switch (e2e/base.js) overrides Playwright's
  # `baseURL` fixture so every `page.goto("/foo")` and
  # `page.request.get("/foo")` routes against https://adamdaniel.ai. The
  # `@parity` static lint (e2e/parity-tag-lint.test.js) guarantees every
  # spec we run here is read-only, so this job cannot mutate prod even
  # if a regression sneaks past local. Single project (chromium-desktop)
  # keeps the network footprint tight; the matrix multiplier adds
  # nothing for read-only HTTP/DOM probes.
  #
  # Non-blocking: this job is purely informational while @parity coverage
  # grows. It does NOT carry `needs:` from `select` or `e2e`, so a stuck
  # selector can't block parity, and a parity failure can't block the
  # merge gate. Branch protection can promote it to required later.
  parity:
    runs-on: ubuntu-latest
    # Same prebuilt Playwright image as the `e2e` matrix above —
    # version tag is enforced to match `package-lock.json` by the
    # `select` job's drift-guard step.
    env:
      # Firefox refuses to launch when $HOME is owned by a different
      # user. Inside GHA's container jobs the runner injects
      # `-e HOME=/github/home` at `docker create` time (owned by the
      # image's `pwuser`); attempting to override that via
      # `container.env` is a no-op because GHA's injection wins. The
      # runner DOES honour job-level `env:` — it `export`s those into
      # every step's shell after `docker exec`, so HOME=/root takes
      # effect by the time `npx playwright test` runs. Firefox bails
      # with "Running Nightly as root in a regular user's session is
      # not supported" without this. Chromium and WebKit are
      # unaffected; setting it uniformly keeps configuration simple.
      HOME: /root
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    # Run against the latest commit of every PR. Forks don't block on
    # this — the parity probe is read-only and uses no secrets.
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (2026-01-09)

      - name: Install Ruby toolchain prerequisites
        # See the same step in the `e2e` job for rationale —
        # libyaml-0-2 + build-essential aren't in the Playwright
        # noble image, but `ruby/setup-ruby` + bundler need them.
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends libyaml-0-2 build-essential

      - name: Setup Ruby
        # A handful of @parity-tagged specs (sitemap, image-alt-text,
        # the manual walkthroughs) read `_site/` for their local-vs-
        # prod parity comparison. With TARGET=prod, Playwright's
        # webServer doesn't run `bundle exec jekyll build`, so we
        # have to do it explicitly here. Without this, those specs
        # bail in `beforeAll` with "_site/sitemap.xml not found".
        uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f  # v1.306.0 (2026-04-26)
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build Jekyll site (for parity specs that read _site/)
        run: bundle exec jekyll build --quiet

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0 (2026-04-20)
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Run @parity subset against prod
        env:
          TARGET: prod
        # `--grep @parity` selects every test/describe with the tag in its
        # title. The static lint (e2e/parity-tag-lint.test.js) ships in the
        # same matrix so a violating tag-grab fails *here* before doing any
        # remote IO.
        run: |
          set -o pipefail
          npx playwright test \
            --grep @parity \
            --project=chromium-desktop \
            --reporter=list \
            2>&1 | tee /tmp/parity-output.log

      - name: Upload parity test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 (2026-04-10)
        with:
          name: test-results-parity-prod
          path: |
            test-results/
            /tmp/parity-output.log
          retention-days: 7

      # Failure-comment fan-out — see AGENTS.md "Failure-comment
      # composite action". Two call sites (post / resolve), gitleaks-
      # scrubbed via the composite action.
      - name: Post failure summary
        if: ${{ failure() && github.event_name == 'pull_request' }}
        uses: ./.github/actions/post-failure-comment
        with:
          mode: post
          log-file: /tmp/parity-output.log
          marker: parity-failure-summary
          title: parity

      - name: Resolve failure summary on success
        if: ${{ success() && github.event_name == 'pull_request' }}
        uses: ./.github/actions/post-failure-comment
        with:
          mode: resolve
          marker: parity-failure-summary
          title: parity

  # ─── DO NOT WEAKEN WITHOUT READING THE FOLLOWING ────────────────────
  #
  # `finalize` is the merge gate for the entire e2e matrix. Only `e2e
  # (1)` and `e2e-admin` are also required checks; `e2e (2)`, `e2e (3)`,
  # `e2e (4)` are NOT required (the public matrix is dynamically sized
  # — see Layer 2 in `e2e/select-specs.js` — and required-status-checks
  # can't depend on contexts that may not fire). Coverage on shards 2-4
  # of the public matrix is enforced solely by the "Re-fail if any
  # matrix failed" step at the bottom of this job: it propagates either
  # `needs.e2e.result == 'failure'` or `needs.e2e-admin.result ==
  # 'failure'` into a non-zero exit, making `finalize` itself fail and
  # blocking the merge.
  #
  # If you weaken or delete that step, the public matrix's shards-2-4
  # verdict silently stops gating merges. The lint at
  # `_plugins_test/finalize_gate_test.rb` will fail the build if you
  # try, but the lint can be sidestepped — please do not.
  #
  # The lint also asserts:
  #   - finalize remains in .github/rulesets/main.json's required list
  #   - finalize keeps `if: !cancelled()` (otherwise GHA skips it on
  #     shard failure and the gate evaporates differently)
  #   - finalize keeps `needs: [e2e, e2e-admin]` (no propagation
  #     without the dependency)
  finalize:
    if: ${{ !cancelled() }}
    needs: [e2e, e2e-admin]
    runs-on: ubuntu-latest
    # Use the same Playwright container as the `e2e` matrix — the
    # `merge-reports` step needs the same `@playwright/test` version
    # the shards used to write their blobs, and the image guarantees it.
    # The downstream "Install gitleaks" + "Post failure summary" steps
    # also work fine inside the container (curl + tar + node are baked
    # in, sudo isn't but the image runs as root anyway).
    env:
      # Firefox refuses to launch when $HOME is owned by a different
      # user. Inside GHA's container jobs the runner injects
      # `-e HOME=/github/home` at `docker create` time (owned by the
      # image's `pwuser`); attempting to override that via
      # `container.env` is a no-op because GHA's injection wins. The
      # runner DOES honour job-level `env:` — it `export`s those into
      # every step's shell after `docker exec`, so HOME=/root takes
      # effect by the time `npx playwright test` runs. Firefox bails
      # with "Running Nightly as root in a regular user's session is
      # not supported" without this. Chromium and WebKit are
      # unaffected; setting it uniformly keeps configuration simple.
      HOME: /root
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (2026-01-09)

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0 (2026-04-20)
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1 (2026-03-11)
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge blob reports into single HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload merged HTML report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 (2026-04-10)
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      # ── Per-test screenshot videos ───────────────────────────────
      # The capture fixture in `e2e/base.js` writes one full-page
      # screenshot per main-frame navigation under
      # `test-results/per-test-frames/<safe-test-id>/NNNN.png`,
      # alongside a `meta.json` sidecar. Each shard uploaded its
      # `test-results/` dir as `test-results-shard-<N>`; merge them
      # into a single tree and run the assembly script to:
      #   - build one video per test directory (banner above frames)
      #   - subdivide the combined stream into per-target-env buckets:
      #     `_combined-local.mp4`, `_combined-preview.mp4`,
      #     `_combined-prod.mp4`, `_combined-other.mp4` (only when
      #     non-empty; bucket assigned by FIRST captured frame's host)
      #   - emit `_combined.txt` manifest with each test's bucket
      # Then upload the videos as a separate artifact. This is
      # informational — not a required check.
      #
      # v2 (PR follow-up to #143): the master `_combined.mp4` is gone
      # — replaced by the four per-bucket files so reviewers can
      # scrub one target env without scrolling past the rest.
      - name: Download per-shard test-results
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1 (2026-03-11)
        with:
          path: all-test-results
          pattern: test-results-shard-*

      - name: Merge per-shard frames into single tree
        if: ${{ !cancelled() }}
        run: |
          mkdir -p test-results/per-test-frames
          shopt -s nullglob
          for d in all-test-results/test-results-shard-*/per-test-frames/*/; do
            name=$(basename "$d")
            target="test-results/per-test-frames/$name"
            # Multiple shards shouldn't produce the same safe-test-id
            # (project + file + title + repeat), but if they do, the
            # later one wins. The test-results dir is informational; a
            # rare collision drops one frame set, not a CI signal.
            mkdir -p "$target"
            cp -a "$d"/. "$target/"
          done
          # Quick visibility — count tests with frames so a future
          # regression in the capture fixture lights up here.
          count=$(find test-results/per-test-frames -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l)
          echo "Per-test frame directories collected: $count"

      - name: Install ffmpeg + ImageMagick for banner rendering
        if: ${{ !cancelled() }}
        # The Playwright container ships a stripped-down internal
        # ffmpeg under /ms-playwright/ffmpeg-1011/ that lacks the
        # filters we'd otherwise need. We install the full ffmpeg for
        # frame concat and `imagemagick` (the `convert` binary) for
        # the per-frame banner+screenshot composite. Each frame's
        # banner line 2 changes per frame ("Step <x> of <y>: <step
        # name / URL fallback>"), so a single static drawtext can no
        # longer carry it — see e2e/generate-test-videos.js.
        # Combined apt cost: ~80 MB, ~15 s on a warm mirror.
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ffmpeg imagemagick fonts-liberation

      - name: Assemble per-test videos with banner
        if: ${{ !cancelled() }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || 'local' }}
        run: |
          # Skip cleanly when no shard produced any frames (e.g. every
          # shard was the baseline-only smoke run or every test was
          # pure-node). The script no-ops in that case.
          node e2e/generate-test-videos.js

      - name: Upload per-test videos artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 (2026-04-10)
        with:
          name: per-test-videos
          # The wildcard `*.mp4` already covers the four per-bucket
          # combined files (`_combined-{local,preview,prod,other}.mp4`)
          # alongside the per-test `<safe-test-id>.mp4` files. Empty
          # buckets emit nothing on disk so `if-no-files-found: ignore`
          # is enough — we don't need to enumerate paths individually.
          path: |
            test-results/per-test-videos/_combined.txt
            test-results/per-test-videos/*.mp4
          if-no-files-found: ignore
          retention-days: 7

      - name: Download shard logs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1 (2026-03-11)
        with:
          path: all-shard-logs
          pattern: shard-log-*

      - name: Concatenate shard logs
        run: |
          : > /tmp/playwright-output.log
          # `nullglob` so an empty `all-shard-logs/` (e.g. when every
          # matrix shard was cancelled) leaves the loop body unrun
          # rather than feeding the literal pattern to `basename`.
          shopt -s nullglob
          for d in all-shard-logs/shard-log-*; do
            shard=$(basename "$d" | sed 's/shard-log-//')
            echo "===== shard $shard =====" >> /tmp/playwright-output.log
            if [ -f "$d/playwright-output.log" ]; then
              cat "$d/playwright-output.log" >> /tmp/playwright-output.log
            else
              echo "(no log captured)" >> /tmp/playwright-output.log
            fi
            echo "" >> /tmp/playwright-output.log
          done

      # ── Failure summary on the PR ────────────────────────────────
      # Surface the public-matrix's failure blocks as a PR comment so
      # a human (or agent) iterating on the PR can triage without
      # needing workflow-log access. Two call sites; gate on the
      # upstream e2e matrix's result (this finalize job has its
      # own status, which is irrelevant — what we care about is
      # the matrix). The admin matrix posts its own
      # `<!-- e2e-admin-failure-summary -->` comment from inside
      # the e2e-admin job; `finalize` only owns the public-lane
      # comment. See AGENTS.md "Failure-comment composite action"
      # for the convention.
      - name: Post failure summary
        if: ${{ needs.e2e.result == 'failure' && github.event_name == 'pull_request' }}
        uses: ./.github/actions/post-failure-comment
        with:
          mode: post
          log-file: /tmp/playwright-output.log
          marker: e2e-failure-summary
          title: E2E tests

      - name: Resolve failure summary on success
        if: ${{ needs.e2e.result == 'success' && github.event_name == 'pull_request' }}
        uses: ./.github/actions/post-failure-comment
        with:
          mode: resolve
          marker: e2e-failure-summary
          title: E2E tests

      # Stuck-PR diagnostic — single-shot wrapper-level catch for the
      # whole e2e matrix. Mirrors the wiring in cms-publish-loop-*.yml
      # (see ADR 0002), but runs ONCE here in `finalize` against the
      # merged log instead of per-shard. That keeps the GitHub-API call
      # budget at ~10/run regardless of shard count, addressing the v1
      # concern in ADR 0002 about multiplying API cost by the shard
      # matrix. The in-spec wrapper (`e2e/with-stuck-pr-diagnostic.js`)
      # already attaches the diagnostic to the failing test's error
      # message for wait-helper throws inside test code; this
      # workflow-level layer is the catch-all for outer-Playwright-
      # timeout kills (40-min cap) where the in-spec wrap never ran.
      # Gated on `grep 'Timed out waiting'` so non-timeout failures
      # (assertion errors, DOM mismatches, image-tag drift) don't get
      # a misleading stuck-PR comment they have to disregard.
      - name: Diagnose stuck PRs
        if: ${{ needs.e2e.result == 'failure' && github.event_name == 'pull_request' && hashFiles('/tmp/playwright-output.log') != '' }}
        env:
          GH_TOKEN: ${{ secrets.CMS_E2E_PAT || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WAITING_FOR: 'e2e matrix (see Playwright log for the specific wait)'
        run: |
          set -uo pipefail
          if grep -q 'Timed out waiting' /tmp/playwright-output.log 2>/dev/null; then
            node scripts/diagnose-stuck-pr.js > /tmp/e2e-stuck-pr-diagnostic.md || true
          else
            echo "_no 'Timed out waiting' lines in merged shard log; stuck-PR diagnostic skipped_" > /tmp/e2e-stuck-pr-diagnostic.md
          fi

      - name: Post stuck-PR diagnostic
        if: ${{ needs.e2e.result == 'failure' && github.event_name == 'pull_request' && hashFiles('/tmp/e2e-stuck-pr-diagnostic.md') != '' }}
        uses: ./.github/actions/post-failure-comment
        with:
          mode: post
          log-file: /tmp/e2e-stuck-pr-diagnostic.md
          marker: e2e-stuck-pr-diagnostic
          title: E2E tests stuck-PR diagnostic

      - name: Resolve stuck-PR diagnostic on success
        if: ${{ needs.e2e.result == 'success' && github.event_name == 'pull_request' }}
        uses: ./.github/actions/post-failure-comment
        with:
          mode: resolve
          marker: e2e-stuck-pr-diagnostic
          title: E2E tests stuck-PR diagnostic

      # ─── DO NOT REMOVE OR SOFTEN — this step IS the merge gate ─────────
      # `e2e (1)` and `e2e-admin` are required, but `e2e (2..4)` are
      # not (the public matrix's dynamic shard count would create the
      # missing-check trap). This step's `exit 1` is the only thing
      # that converts a public-shard-2/3/4 failure (or any e2e-admin
      # failure that GHA didn't already block on) into a `finalize`
      # failure, which IS required, and therefore blocks the merge.
      # Removing this step (or replacing `exit 1` with `exit 0`, or
      # inverting the `if`, or dropping the `needs.<job>.result ==
      # 'failure'` predicate) silently opens the gate for any
      # shard-2-4 failure to land on main.
      #
      # `_plugins_test/finalize_gate_test.rb` enforces the structural
      # invariants here. If you have a real reason to change this step,
      # update the lint in the same PR and put the rationale in the
      # commit message.
      - name: Re-fail if any matrix failed
        if: ${{ needs.e2e.result == 'failure' || needs.e2e-admin.result == 'failure' }}
        run: |
          echo "One or more matrix shards failed (e2e=${{ needs.e2e.result }}, e2e-admin=${{ needs.e2e-admin.result }})."
          exit 1
