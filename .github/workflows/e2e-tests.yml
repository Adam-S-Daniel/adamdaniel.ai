name: E2E Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          # Need history for `git diff origin/main...HEAD` so the spec
          # selector can decide which tests are actually relevant.
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@319994f95fa847cf3fb3cd3dbe89f6dcde9f178f  # v1.295.0
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run Jekyll plugin unit tests
        # Plain-Ruby tests under _plugins_test/ — fast (sub-second each),
        # no extra gems. Keeps plugin behaviour covered even when no
        # Playwright spec exercises the same code path.
        run: |
          for t in _plugins_test/*_test.rb; do
            echo "==> $t"
            bundle exec ruby "$t"
          done

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium firefox webkit --with-deps

      - name: Select relevant e2e specs
        id: select
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        # On push to main we run everything (the diff is the entire
        # commit and the selector can't reason about that usefully).
        # On PRs we run the diff-aware subset.
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "scope=all" >> "$GITHUB_OUTPUT"
            echo "files=" >> "$GITHUB_OUTPUT"
            echo "Running full matrix on push-to-main"
            exit 0
          fi
          git fetch origin main --depth=200 || true
          node e2e/select-specs.js --base "$BASE_REF" > /tmp/select.json
          cat /tmp/select.json
          SCOPE=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/select.json')).scope)")
          FILES=$(node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/select.json'));console.log((j.files||[]).join(' '))")
          echo "scope=$SCOPE" >> "$GITHUB_OUTPUT"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Run Playwright tests (full matrix)
        if: steps.select.outputs.scope == 'all'
        run: npx playwright test

      - name: Run Playwright tests (selected subset)
        if: steps.select.outputs.scope == 'subset'
        run: npx playwright test ${{ steps.select.outputs.files }}

      - name: Run Playwright tests (baseline only)
        if: steps.select.outputs.scope == 'skip'
        # Always-run baseline keeps a smoke check on every PR so a
        # broken selector or harness regression can't sneak through.
        run: |
          npx playwright test \
            e2e/compute-visual-diffs.test.js \
            e2e/cms-config.spec.js \
            e2e/visual-change-guard.spec.js

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      - name: Upload HTML report (visual diffs)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
