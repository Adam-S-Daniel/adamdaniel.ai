name: Required-check stubs (paths-ignored PRs)
run-name: ${{ format('PR #{0} — {1}', github.event.pull_request.number, github.event.pull_request.title) }}

# Why this exists — the missing-check trap, made tractable.
#
# The branch ruleset for `main` requires the following status checks
# to pass before a PR can merge:
#
#   validate-content   (cms-editorial-workflow.yml — always fires)
#   scan               (secrets-scan.yml — always fires)
#   select, unit, parity, e2e (1), finalize   (e2e-tests.yml)
#
# `e2e-tests.yml` carries a `paths-ignore:` list — README.md,
# AGENTS.md, CLAUDE.md, docs/**, .agents/**, screenshots/**, etc.
# When every changed file in a PR matches one of those patterns
# (a "docs-only" or "tooling-only" PR), e2e-tests.yml does not
# fire at all, so the five required checks above never report.
# Branch protection then blocks the merge with "Expected — Waiting
# for status to be reported", forever, because the workflow that
# would have produced those checks never even queued.
#
# Two ways to climb out of the trap:
#
#   1. Drop the `paths-ignore` so e2e-tests.yml runs on every PR.
#      Cost: ~1-2 min of runner time on every doc-only or tooling-
#      only PR (`scope=skip` collapses to a single shard with the
#      baseline tests, but the runner bring-up is still real).
#
#   2. Have a second workflow that fires precisely when e2e-tests
#      doesn't, and emits the same check names with synthetic
#      success. Required-status-checks key on context name, so the
#      ruleset can't tell whose status it is. Doc-only PRs become
#      mergeable; mixed PRs (docs + code) trigger BOTH workflows
#      and the real one's pass/fail still gates merging because a
#      second instance of the same check name is also required.
#
# This file implements (2). The `paths:` allowlist below is the
# byte-for-byte mirror of `e2e-tests.yml`'s `paths-ignore:` list.
# Keep them in sync — a workflow-shape lint in `_plugins_test/`
# enforces this so they can't drift silently.

on:
  pull_request:
    branches:
      - main
    paths:
      # Byte-for-byte mirror of e2e-tests.yml's paths-ignore (parsed-
      # array equality + order is enforced by the workflow-shape lint
      # _plugins_test/required_check_stubs_paths_test.rb). If you add or
      # remove an entry in e2e-tests.yml's paths-ignore, mirror it here
      # in the same position. Extended for the issue #856 skip-rules
      # audit (infra/proxy dirs, dev/CI scripts, maintenance workflows).
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'ANALYTICS_SETUP.md'
      - 'docs/**'
      - '.agents/**'
      - 'screenshots/**'
      - 'recordings/**'
      - 'test-results/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitleaks.toml'
      - '.editorconfig'
      - '.bundle/**'
      - 'infrastructure/**'
      - 'oauth-proxy/**'
      - 'scripts/auto-resolve-newline-conflict.js'
      - 'scripts/auto-resolve-newline-conflict.test.js'
      - 'scripts/bootstrap.ps1'
      - 'scripts/bootstrap.sh'
      - 'scripts/build-contributor-manual.js'
      - 'scripts/build-contributor-manual.test.js'
      - 'scripts/diagnose-stuck-pr.js'
      - 'scripts/diagnose-stuck-pr.test.js'
      - 'scripts/live-admin-smoke.js'
      - 'scripts/secrets-scan.sh'
      - 'scripts/sync-action-pin-comments.sh'
      - 'scripts/sync-action-pin-comments.test.sh'
      - 'scripts/verify-skills-mirror.ps1'
      - 'scripts/verify-skills-mirror.sh'
      - '.github/dependabot.yml'
      - '.github/workflows/secrets-scan.yml'
      - '.github/workflows/publish-scheduled-posts.yml'
      - '.github/workflows/cms-publish-loop-prod.yml'
      - '.github/workflows/auto-resolve-newline-conflict.yml'
      - '.github/workflows/cleanup-stale-fixture-branches.yml'
      - '.github/workflows/dependabot-auto-merge.yml'
      - '.github/workflows/dependabot-comment-sync.yml'
      - '.github/workflows/regenerate-manual.yml'
      - '.github/workflows/required-check-stubs.yml'
      - '.github/workflows/sweep-stale-cms-prs.yml'

permissions:
  contents: read

concurrency:
  # One run per PR. Mirrors e2e-tests.yml's pattern.
  group: required-check-stubs-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Each job below MUST keep its name in sync with the corresponding
  # job in e2e-tests.yml so branch protection sees a check with the
  # required context. The body is intentionally trivial; nothing here
  # validates the PR — that's e2e-tests.yml's responsibility on PRs
  # that contain real source. These stubs only assert "this PR's
  # changes are out of e2e's scope, so e2e cannot have a verdict;
  # treat that as success."

  select:
    runs-on: ubuntu-latest
    steps:
      - name: Stub success
        run: echo "Stub success — paths-ignored PR; e2e-tests.yml's select did not fire."

  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Stub success
        run: echo "Stub success — paths-ignored PR; e2e-tests.yml's unit did not fire."

  parity:
    runs-on: ubuntu-latest
    steps:
      - name: Stub success
        run: echo "Stub success — paths-ignored PR; e2e-tests.yml's parity did not fire."

  # Matrix with [1] so the GitHub-rendered check name is `e2e (1)`,
  # matching e2e-tests.yml's matrix-derived check name. Required-
  # status-checks key on context name, not on which workflow emitted
  # it, so this satisfies the rule's `e2e (1)` entry.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1]
    steps:
      - name: Stub success
        run: echo "Stub success — paths-ignored PR; e2e-tests.yml's e2e (${{ matrix.shard }}) did not fire."

  # e2e-admin is single-shard in e2e-tests.yml (no matrix), so its
  # GitHub check context is exactly `e2e-admin`. It IS in
  # rulesets/main.json's required list, so a paths-ignored PR needs
  # this stub too — without it, docs/tooling-only PRs sit blocked on
  # `e2e-admin` ("Expected — waiting for status") forever.
  e2e-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Stub success
        run: echo "Stub success — paths-ignored PR; e2e-tests.yml's e2e-admin did not fire."

  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Stub success
        run: echo "Stub success — paths-ignored PR; e2e-tests.yml's finalize did not fire."
# Intentionally inert line (no functional effect).
