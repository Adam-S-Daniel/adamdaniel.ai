name: CMS Editorial Workflow
run-name: "${{ format('PR #{0} — {1}', github.event.pull_request.number, github.event.pull_request.title) }}"
on:
  pull_request:
    types: [opened, synchronize, labeled]
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  editorial:
    uses: Adam-S-Daniel/cms-platform/.github/workflows/cms-editorial-workflow.yml@e0d772c22312cc6585d0b4f70de8bc22d0f18368
    with:
      # Pin to the SAME ref as the `uses:` pin above so the module matches.
      platform_ref: e0d772c22312cc6585d0b4f70de8bc22d0f18368
    secrets:
      CMS_E2E_PAT: ${{ secrets.CMS_E2E_PAT }}
