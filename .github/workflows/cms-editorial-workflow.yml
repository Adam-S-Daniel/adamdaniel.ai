name: CMS Editorial Workflow
run-name: "${{ format('PR #{0} — {1}', github.event.pull_request.number, github.event.pull_request.title) }}"
on:
  pull_request:
    types: [opened, synchronize, labeled]
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  editorial:
    uses: Adam-S-Daniel/cms-platform/.github/workflows/cms-editorial-workflow.yml@1fd78b6a14f98b8d051ddad6c750f9b20a48c9e5
    with:
      # Pin to the SAME ref as the `uses:` pin above so the module matches.
      platform_ref: 1fd78b6a14f98b8d051ddad6c750f9b20a48c9e5
    secrets:
      CMS_E2E_PAT: ${{ secrets.CMS_E2E_PAT }}
