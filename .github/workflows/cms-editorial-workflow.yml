name: CMS Editorial Workflow
run-name: "${{ format('PR #{0} — {1}', github.event.pull_request.number, github.event.pull_request.title) }}"
on:
  pull_request:
    types: [opened, synchronize, labeled]
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  editorial:
    uses: Adam-S-Daniel/cms-platform/.github/workflows/cms-editorial-workflow.yml@19db64fb7277c26a7f83b7bcb7fa0db317edb60f
    secrets:
      CMS_E2E_PAT: ${{ secrets.CMS_E2E_PAT }}
