name: CMS Editorial Workflow
run-name: "${{ format('PR #{0} — {1}', github.event.pull_request.number, github.event.pull_request.title) }}"
on:
  pull_request:
    types: [opened, synchronize, labeled]
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  editorial:
    uses: Adam-S-Daniel/cms-platform/.github/workflows/cms-editorial-workflow.yml@9dd9454b7020ca2eab4ffe49689e764e55a0e4cc
    with:
      # Pin to the SAME ref as the `uses:` pin above so the module matches.
      platform_ref: 9dd9454b7020ca2eab4ffe49689e764e55a0e4cc
    secrets:
      CMS_E2E_PAT: ${{ secrets.CMS_E2E_PAT }}
