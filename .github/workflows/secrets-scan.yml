name: Secrets scan
on:
  pull_request:
    # No `edited`: a skipped caller emits NO check-run, so an `edited` run WITHDRAWS
    # contexts an earlier run reported green — only a new SHA restores them (#222).
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * 0'   # weekly full-history sweep
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  scan:
    uses: Adam-S-Daniel/cms-platform/.github/workflows/secrets-scan.yml@1fd78b6a14f98b8d051ddad6c750f9b20a48c9e5
