name: skills-mirror

on:
  push:
    branches: [main]
    paths:
      - '.agents/skills/**'
      - '.claude/skills/**'
      - 'scripts/bootstrap.sh'
      - 'scripts/bootstrap.ps1'
      - 'scripts/verify-skills-mirror.sh'
      - 'scripts/verify-skills-mirror.ps1'
      - 'scripts/secrets-scan.sh'
      - 'tests/**'
      - '.github/workflows/skills-mirror.yml'
      - '.github/workflows/secrets-scan.yml'
  pull_request:
    branches: [main]
    paths:
      - '.agents/skills/**'
      - '.claude/skills/**'
      - 'scripts/bootstrap.sh'
      - 'scripts/bootstrap.ps1'
      - 'scripts/verify-skills-mirror.sh'
      - 'scripts/verify-skills-mirror.ps1'
      - 'scripts/secrets-scan.sh'
      - 'tests/**'
      - '.github/workflows/skills-mirror.yml'
      - '.github/workflows/secrets-scan.yml'

# Skills-mirror CI is structural / offline only. It must not invoke `claude`,
# nor reference ANTHROPIC_API_KEY anywhere — auth in this project is
# subscription-based and CI cannot authenticate as the user. Live tests run
# locally and on Claude Code on the web (see AGENTS.md).

permissions:
  contents: read

concurrency:
  group: skills-mirror-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (2026-01-09)

      - name: Bootstrap (Linux/macOS)
        if: runner.os != 'Windows'
        run: bash scripts/bootstrap.sh

      - name: Bootstrap (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/bootstrap.ps1

      - name: Verify (Linux/macOS)
        if: runner.os != 'Windows'
        run: bash scripts/verify-skills-mirror.sh

      - name: Verify (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-skills-mirror.ps1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0 (2026-01-22)
        with:
          python-version: '3.12'

      - name: Install test deps
        run: python -m pip install --upgrade pip pytest pyyaml

      # The secrets-scan hook tests in tests/test_secrets_scan_hook.py
      # need the same gitleaks binary the secrets-scan workflow pins
      # (.github/workflows/secrets-scan.yml → GITLEAKS_VERSION). The tests
      # skip gracefully if it isn't installed; installing it ensures they
      # actually run on every push instead of silently skipping. Linux only
      # because the tests themselves skip on Windows (bash hooks).
      - name: Install gitleaks
        if: runner.os != 'Windows'
        run: |
          version="$(grep -E '^[[:space:]]*GITLEAKS_VERSION:' .github/workflows/secrets-scan.yml | head -1 | sed -E "s/.*'([0-9.]+)'.*/\1/")"
          curl -fsSL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run offline tests
        run: python -m pytest tests/
# Intentionally inert line (no functional effect).
