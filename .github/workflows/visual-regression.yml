# Thin caller — copied into a site repo as
# `.github/workflows/visual-regression.yml`. Owns the pull_request trigger
# (no paths filter — fires on every PR) + run-name; delegates the
# visual-regression video pipeline to the platform's reusable workflow,
# which decides salience internally (content-only PRs are skipped there).
# The pipeline (detect-changed-pages.js, compute-visual-diffs.js,
# visual-regression-salient.js, generate-video.sh, regression-video.spec.js,
# playwright.regression.config.js) lives in the platform repo's e2e/. Keep
# `platform_ref` equal to the `@<sha>` pin on the `uses:` line.
#
# Site identity (CMS_APEX / PREVIEW_BUCKET / AWS_REGION) is read from THIS
# repo's VARS by the reusable workflow; AWS/CloudFront secrets are wired
# through the `secrets:` block below.
name: Visual Regression
run-name: "${{ format('PR #{0} — {1}', github.event.pull_request.number, github.event.pull_request.title) }}"

on:
  pull_request:
    # No `edited`: a skipped caller emits NO check-run, so an `edited` run WITHDRAWS
    # contexts an earlier run reported green — only a new SHA restores them (#222).
    types: [opened, synchronize, reopened]
    branches:
      - main
    # No paths filter — fires on EVERY PR so the required approve-regression
    # check always reports a status (a path-filtered workflow that never
    # triggers would deadlock a required check). Salience — content-only PRs
    # (CMS collections + media uploads) skip the heavy build; templates /
    # styling / the admin shell / pipeline tooling build — is decided inside
    # the reusable's detect job via e2e/visual-regression-salient.js.

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  visual-regression:
    # Pinned to cms-platform v0.1.100 (single-version lockstep). Carries the
    # always-report + screenshot-path + serve-path fixes — the PR side renders
    # the real built site, so no-change PRs come back ~0 diffs and
    # approve-regression auto-passes. platform_ref MUST match the @<ref> pin.
    uses: Adam-S-Daniel/cms-platform/.github/workflows/visual-regression.yml@v0.1.100
    with:
      platform_ref: v0.1.100
    secrets:
      # Optional — drop any the site doesn't use. The AWS steps no-op when
      # PREVIEW_BUCKET (a repo var) is unset; the CloudFront invalidation
      # also gates on PREVIEW_CLOUDFRONT_ID.
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      PREVIEW_CLOUDFRONT_ID: ${{ secrets.PREVIEW_CLOUDFRONT_ID }}
      CMS_E2E_PAT: ${{ secrets.CMS_E2E_PAT }}
