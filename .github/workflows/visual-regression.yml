name: Visual Regression

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    # Positive path list — only run when the diff can actually shift
    # rendered output OR change one of the tools the regression
    # pipeline uses. Stated as a positive list (rather than the
    # paths-ignore form used elsewhere) because the dual nature of
    # `e2e/` (most specs unrelated, but a handful drive this workflow)
    # makes a negative list awkward to express.
    #
    # Content-only PRs are NOT in this list and therefore do not run
    # visual regression. The CMS's editorial workflow opens a PR for
    # every Save, and those PRs touch only the CMS-managed content
    # collections (_posts/, _tags/, _projects/, pages/, _e2e/ — see
    # admin/config.yml), plus media uploads under
    # assets/images/uploads/. The "regression" of editing a post or
    # uploading an image is by design — pixel diffs are guaranteed,
    # so the human review of the regression video adds noise and
    # runner time without signal. The check exists to catch
    # *unintentional* visual drift in templates / styling / the
    # admin shell — that's what the paths below cover. Content-only
    # PRs still gate on validate-content + the e2e suite.
    paths:
      # Templates / rendering logic / styling
      - '_layouts/**'
      - '_includes/**'
      - '_plugins/**'
      - '_data/**'              # site-wide data (e.g. nav lists), not CMS content
      - 'admin/**'              # the editor shell itself
      - '_config.yml'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'index.html'            # hand-edited root page (not a CMS page)
      - '404.html'
      - 'robots.txt'
      - 'preview.md'
      # Styling assets — narrowed from `assets/**` so CMS media
      # uploads under assets/images/uploads/** don't trigger.
      - 'assets/css/**'
      - 'assets/js/**'
      - 'assets/images/logo.svg'
      # Tools the regression pipeline itself depends on
      - '.github/workflows/visual-regression.yml'
      - 'e2e/detect-changed-pages.js'
      - 'e2e/compute-visual-diffs.js'
      - 'e2e/generate-video.sh'
      - 'e2e/regression-video.spec.js'
      - 'playwright.regression.config.js'

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: "visual-regression-pr-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  generate:
    # Skip entirely on Dependabot PRs whose ecosystem can't possibly
    # change rendered output (npm/github-actions are dev-only here).
    # Bundler bumps (Jekyll + plugins) DO affect rendering, so they
    # still run the regression gate. Branch naming is Dependabot's
    # contract: `dependabot/<ecosystem>/...`.
    if: github.actor != 'dependabot[bot]' || startsWith(github.head_ref, 'dependabot/bundler/')
    runs-on: ubuntu-latest
    outputs:
      visually-different: ${{ steps.compute.outputs.visually-different }}
    env:
      AWS_REGION: us-east-1
      PREVIEW_BUCKET: adamdaniel-ai-previews
      APEX_DOMAIN: adamdaniel.ai
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.PREVIEW_CLOUDFRONT_ID }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (2026-01-09)
        with:
          fetch-depth: 0

      - name: Fetch main branch
        run: git fetch origin main

      - name: Setup Ruby
        uses: ruby/setup-ruby@6aaa311d81eba98ae12eaffbcb63296ace0efcde  # v1.307.0 (2026-05-11)
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0 (2026-04-20)
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5 (2026-04-13)
        with:
          path: ~/.cache/ms-playwright
          # `playwright-chromium-` keeps this cache distinct from the
          # all-three-browsers cache used by e2e-tests.yml so neither
          # trashes the other.
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright OS deps (browsers cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        # Same sizing rationale as e2e-tests.yml's matching step:
        # 435-run sample showed p99=179s, max=554s, with apt-mirror
        # latency in the long tail. 5 minutes is comfortably above
        # p99 and clips the rare outlier instead of paying the
        # 6-hour default for a stuck apt.
        timeout-minutes: 5
        run: npx playwright install-deps chromium

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Detect changed pages
        run: node e2e/detect-changed-pages.js > /tmp/page-changes.json

      - name: Show page changes
        run: cat /tmp/page-changes.json

      - name: Build Jekyll site
        run: bundle exec jekyll build --quiet

      - name: Run regression video screenshots
        continue-on-error: true
        env:
          PAGE_CHANGES_PATH: /tmp/page-changes.json
        run: npx playwright test --config=playwright.regression.config.js

      - name: Compute per-page visual diffs
        id: compute
        run: |
          node e2e/compute-visual-diffs.js \
            /tmp/page-changes.json \
            screenshots/regression/pr \
            screenshots/regression/prod \
            screenshots/regression/diffs.json
          cat screenshots/regression/diffs.json
          VD=$(node -e "process.stdout.write(String(JSON.parse(require('fs').readFileSync('screenshots/regression/diffs.json','utf8')).totals.visuallyDifferent))")
          echo "visually-different=$VD" >> "$GITHUB_OUTPUT"

      - name: Generate comparison video
        run: bash e2e/generate-video.sh /tmp/page-changes.json screenshots/regression/diffs.json

      # AWS / S3 / CloudFront / PR-comment steps below are skipped for
      # Dependabot PRs — Dependabot can't access the OIDC role secret,
      # and the comment links to S3-hosted media that wouldn't have
      # been uploaded anyway. The diff computation above still ran, so
      # `approve-regression` still functions as the merge gate.
      - name: Configure AWS credentials
        if: github.actor != 'dependabot[bot]'
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885  # v6.1.1 (2026-05-05)
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload video and diffs JSON to S3
        if: github.actor != 'dependabot[bot]'
        run: |
          aws s3 cp screenshots/regression/comparison.mp4 \
            "s3://${PREVIEW_BUCKET}/pr-${PR_NUMBER}/regression.mp4" \
            --cache-control "no-cache, must-revalidate" \
            --content-type "video/mp4"
          aws s3 cp screenshots/regression/diffs.json \
            "s3://${PREVIEW_BUCKET}/pr-${PR_NUMBER}/regression.json" \
            --cache-control "no-cache, must-revalidate" \
            --content-type "application/json"

      - name: Invalidate CloudFront cache for video and diffs
        if: github.actor != 'dependabot[bot]' && env.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/pr-${PR_NUMBER}/regression.mp4" "/pr-${PR_NUMBER}/regression.json"

      - name: Post regression video comment
        if: github.actor != 'dependabot[bot]'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0 (2026-04-09)
        with:
          script: |
            const fs = require('fs');
            const pr = context.payload.pull_request.number;
            const changes = JSON.parse(fs.readFileSync('/tmp/page-changes.json', 'utf-8'));
            const diffs = JSON.parse(fs.readFileSync('screenshots/regression/diffs.json', 'utf-8'));
            const apex = process.env.APEX_DOMAIN;
            const cfId = process.env.CLOUDFRONT_DISTRIBUTION_ID;

            const videoUrl = cfId
              ? `https://preview-pr${pr}.${apex}/regression.mp4`
              : `https://${apex}/admin/reviews/`;
            const previewUrl = cfId
              ? `https://preview-pr${pr}.${apex}/`
              : '#';
            const dashboardUrl = `https://${apex}/admin/reviews/`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
            });

            const BOT_MARKER = '<!-- adamdaniel-regression-bot -->';
            const existing = comments.find(c => c.body.includes(BOT_MARKER));

            // The two stats answer different questions:
            //
            //   "Potentially affected"  — pages whose source files changed,
            //                             OR pages on a globally-fanout file
            //                             (_layouts, _includes, _config.yml,
            //                             assets/css). Heuristic — anything
            //                             could break in here.
            //
            //   "Visually different"    — pages where the screenshot actually
            //                             differs from production beyond the
            //                             anti-aliasing tolerance. Fact —
            //                             these are the ones to look at.
            const t = diffs.totals;
            const visuallyDifferentList = diffs.pages
              .filter(p => p.status === 'different' || p.status === 'new')
              .map(p => `\`${p.path}\``)
              .join(', ');

            // No visually-different pages → the approve-regression job
            // skips the human-review environment and auto-passes the
            // required status check. Reflect that in the comment so
            // editors know they don't need to do anything.
            const reviewLine = t.visuallyDifferent === 0
              ? `> **Auto-approved.** No visual regressions detected — the required regression check passed without manual review.`
              : `> **Review required.** Watch the regression video and [approve in the dashboard](${dashboardUrl}) or via GitHub Actions. The dashboard also lists the per-page stats so you don't need GitHub access to see them.`;

            const body = [
              BOT_MARKER,
              '## Visual Regression Video',
              '',
              '| | |',
              '|---|---|',
              `| **Video** | [regression.mp4](${videoUrl}) |`,
              `| **Preview** | [preview-pr${pr}.${apex}](${previewUrl}) |`,
              `| **Commit** | \`${context.payload.pull_request.head.sha.slice(0, 7)}\` |`,
              `| **Visually different** | ${t.visuallyDifferent} page(s)${visuallyDifferentList ? ` — ${visuallyDifferentList}` : ''} |`,
              `| **Potentially affected by changes** | ${t.potentiallyAffected} page(s) |`,
              `| **New** | ${t.new} page(s) |`,
              `| **Visually identical** | ${t.identical} page(s) |`,
              '',
              reviewLine,
              '',
              '*Video regenerates automatically on every push to this PR.*',
            ].join('\n');

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body,
              });
            }

      - name: Upload video artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 (2026-04-10)
        with:
          name: regression-video
          path: |
            screenshots/regression/comparison.mp4
            screenshots/regression/diffs.json
          retention-days: 14

  approve-regression:
    needs: generate
    runs-on: ubuntu-latest
    # When `visually-different == 0` (zero diffs), enter no environment
    # at all — the job runs immediately, reports its required status
    # check as success, and the PR can merge without a human reviewer.
    # Any non-zero count routes through the `regression-review`
    # environment, which has required reviewers configured in
    # repo Settings → Environments.
    environment: ${{ needs.generate.outputs.visually-different != '0' && 'regression-review' || '' }}
    steps:
      - name: Approval confirmed
        run: |
          if [ "${{ needs.generate.outputs.visually-different }}" = "0" ]; then
            echo "Auto-approved: 0 pages visually different from production."
          else
            echo "Visual regression approved by reviewer (${{ needs.generate.outputs.visually-different }} page(s) visually different)."
          fi
