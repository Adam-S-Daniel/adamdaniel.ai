name: Sweep stale CMS PRs
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List candidates without closing (true/false)'
        # Declared `string` (not boolean/number): workflow_dispatch hands
        # typed inputs to a reusable's `with:` as strings, and the reusable's
        # boolean/number inputs reject them — the whole run startup-fails
        # before any job (a #1858 thin-caller regression on the manual
        # dispatch path; the scheduled cron is unaffected). We coerce with
        # fromJSON below so the reusable still receives a real boolean/number.
        type: string
        default: 'false'
      threshold_hours:
        description: 'Min PR age in hours before sweeping'
        type: string
        default: '6'
permissions:
  contents: write
  pull-requests: write
jobs:
  sweep:
    # Pinned to cms-platform v0.1.83 (single-version lockstep) — the reusable
    # declares the CMS_E2E_PAT workflow_call secret, so we map it explicitly
    # like every other caller.
    uses: Adam-S-Daniel/cms-platform/.github/workflows/sweep-stale-cms-prs.yml@v0.1.83
    secrets:
      CMS_E2E_PAT: ${{ secrets.CMS_E2E_PAT }}
    with:
      # The `&&` short-circuits on schedule (event_name != workflow_dispatch),
      # so fromJSON is never evaluated there and the literal defaults pass.
      dry_run: ${{ github.event_name == 'workflow_dispatch' && fromJSON(inputs.dry_run) || false }}
      threshold_hours: ${{ github.event_name == 'workflow_dispatch' && fromJSON(inputs.threshold_hours) || 6 }}
