name: Sweep stale CMS PRs
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List candidates without closing'
        type: boolean
        default: false
      threshold_hours:
        description: 'Min PR age in hours before sweeping'
        type: number
        default: 6
permissions:
  contents: write
  pull-requests: write
jobs:
  sweep:
    # Pinned to cms-platform main @ fb43351 — the merge that made the sweep
    # reusable DECLARE the CMS_E2E_PAT workflow_call secret. Will move to
    # @v0.1.3 once that tag is cut. Now that the secret is declared we map it
    # explicitly like every other caller; `secrets: inherit` cross-repo
    # startup-failed against the older reusable that didn't declare it.
    uses: Adam-S-Daniel/cms-platform/.github/workflows/sweep-stale-cms-prs.yml@fb433519156209fdf8b659da4b60735d8077c3d6
    secrets:
      CMS_E2E_PAT: ${{ secrets.CMS_E2E_PAT }}
    with:
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      threshold_hours: ${{ github.event_name == 'workflow_dispatch' && inputs.threshold_hours || 6 }}
