name: Production Canary

# E3 — Daily read-only probe of the three `_e2e/canary-*` URLs on
# adamdaniel.ai. The full publish-loop spec
# (`e2e/cms-publish-loop.spec.js`) exercises the mutating end-to-end
# Decap → PR → auto-merge → deploy → public-URL pipeline, but only
# fires when CMS-affecting paths change in a PR. This canary fills the
# always-on gap: every morning, before US/EU work hours, fetch the
# three canary URLs and assert each returns 200 with its baseline body.
# If anything is missing, drifted, or 5xx, open a `production-canary`
# issue so the failure is visible the moment it happens — not the next
# time someone happens to push.
#
# Why 12:00 UTC: the e2e workflow's PR runs the @parity subset (G3) on
# every PR, and the publish-loop fires when CMS paths change in a PR.
# Both can race against prod state. 12:00 UTC sits one hour ahead of
# the cms-publish-loop-prod cron's 13:00 UTC slot (G4), keeping the
# two probes from concurrent prod IO.
#
# Read-only by construction:
#   - PROD_CANARY=1 makes the publish-loop spec self-skip and runs the
#     read-only @canary-readonly test instead.
#   - The spec's assertNotProdCanary() guard throws immediately if any
#     code path under PROD_CANARY=1 reaches a Contents-API write or an
#     admin-drive helper, so a future regression can't silently mutate
#     prod from this workflow.
#   - No CMS_E2E_PAT secret. The spec's PROD_CANARY branch deletes the
#     env var defensively before running, but this workflow never
#     supplies it in the first place — there's nothing to leak.

on:
  schedule:
    # 12:00 UTC daily. Sits 1 hour ahead of the publish-loop prod cron
    # (G4 → 13:00 UTC) so the two probes never share a runner against
    # prod state. GitHub cron is best-effort under load — actual run
    # time can drift by several minutes — but the 1-hour offset gives
    # both probes plenty of clearance.
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # Needed to open a `production-canary` issue when the probe fails.
  # `gh issue create` uses GITHUB_TOKEN, which inherits from this
  # permissions block.
  issues: write

defaults:
  run:
    # GHA defaults the shell to `sh -e {0}` inside `container:` jobs,
    # but our run-blocks use `set -o pipefail` and other bash-isms.
    # Force bash so those scripts work inside the Playwright container.
    shell: bash

concurrency:
  # Don't pile up cron runs if a previous one is still polling.
  group: canary-prod
  cancel-in-progress: false

jobs:
  # Build (or cache-hit) the prebaked ci-runner image used as
  # `container.image:` by the canary probe job below. See e2e-tests.yml
  # for the full rationale. Cheap on hit (~5-10 s manifest probe).
  build-image:
    uses: ./.github/workflows/ci-runner-image.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write

  probe:
    needs: build-image
    runs-on: ubuntu-latest
    # Prebaked ci-runner image — apt deps + Ruby + Gemfile.lock gems +
    # warm npm cache + gitleaks baked in, replacing the previous
    # Setup Node + `npm ci` steps inline. Browsers + their apt deps
    # come from the upstream Playwright base layer.
    env:
      # Firefox refuses to launch when $HOME is owned by a different
      # user. Inside GHA's container jobs the runner injects
      # `-e HOME=/github/home` at `docker create` time (owned by the
      # image's `pwuser`); attempting to override that via
      # `container.env` is a no-op because GHA's injection wins. The
      # runner DOES honour job-level `env:` — it `export`s those into
      # every step's shell after `docker exec`, so HOME=/root takes
      # effect by the time `npx playwright test` runs. Firefox bails
      # with "Running Nightly as root in a regular user's session is
      # not supported" without this. Chromium and WebKit are
      # unaffected; setting it uniformly keeps configuration simple.
      HOME: /root
    container:
      image: ${{ needs.build-image.outputs.image }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (2026-01-09)

      - name: Run @canary-readonly probe against prod
        id: probe
        env:
          PROD_CANARY: '1'
          TARGET: prod
        run: |
          set -o pipefail
          npx playwright test \
            e2e/cms-publish-loop.spec.js \
            --project=chromium-desktop-1080 \
            --grep '@canary-readonly' \
            --reporter=list \
            2>&1 | tee /tmp/canary-output.log

      - name: Upload canary log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 (2026-04-10)
        with:
          name: canary-prod-log
          path: /tmp/canary-output.log
          retention-days: 14

      - name: Install GitHub CLI
        # Hosted ubuntu-latest runners ship `gh` preinstalled; the
        # Playwright container doesn't. Install it via the upstream
        # apt repo only when the probe failed and we'll actually use
        # it — keeps the success path fast.
        if: failure() && steps.probe.outcome == 'failure'
        run: |
          set -euo pipefail
          # Same install recipe as cli.github.com/manual/installation —
          # adds the upstream signing key + repo, then installs `gh`.
          # No `sudo` because the container runs as root.
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends curl ca-certificates gpg
          # `mkdir -p` then `chmod` instead of the `-p -m` shorthand,
          # which only applies the mode to the deepest leaf (SC2174).
          mkdir -p /etc/apt/keyrings
          chmod 755 /etc/apt/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
          chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends gh
          gh --version

      # Stuck-PR diagnostic — read-only classifier of open `cms/*` PRs
      # and the `deploy-production.yml` queue. Most canary failures fall
      # into one of four buckets (see the issue body below); two of
      # those — content drift from a crashed/stuck publish-loop, and a
      # stalled deploy-production — show up in this report. The other
      # two (5xx, layout break) get a benign "no candidates" section.
      # Always exits 0 by design (see scripts/diagnose-stuck-pr.js
      # header). Read-only, safe under PROD_CANARY=1. We do NOT gate
      # on `grep 'Timed out waiting'` like the publish-loop wiring
      # does: the canary's failure signature is an HTTP assertion, not
      # a wait timeout, and the diagnostic is signal-positive for the
      # content-drift / deploy-stall cases that dominate canary
      # incidents.
      - name: Diagnose stuck PRs
        if: failure() && steps.probe.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WAITING_FOR: 'production canary content match (read-only HTTP probe of _e2e/canary-* URLs)'
          WAITING_FOR_KIND: url
        run: |
          set -uo pipefail
          node scripts/diagnose-stuck-pr.js > /tmp/canary-stuck-pr-diagnostic.md || true

      - name: Open issue on canary failure
        if: failure() && steps.probe.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Truncate the log so the issue body fits comfortably under
          # GitHub's ~65k-char limit even after gh CLI's framing.
          tail -c 50000 /tmp/canary-output.log > /tmp/canary-tail.log || true
          DATE=$(date -u '+%Y-%m-%d %H:%M UTC')

          # Inline the stuck-PR diagnostic if the previous step produced
          # one. Empty/missing file falls through to an explanatory stub
          # so the issue body's structure stays predictable.
          if [ -s /tmp/canary-stuck-pr-diagnostic.md ]; then
            DIAGNOSTIC=$(cat /tmp/canary-stuck-pr-diagnostic.md)
          else
            DIAGNOSTIC="_Stuck-PR diagnostic produced no output._"
          fi

          # If a canary issue is already open, comment on it instead of
          # opening a duplicate. A stuck deploy producing 7 days of
          # canary failures should not generate 7 issues.
          EXISTING=$(gh issue list \
            --label production-canary \
            --state open \
            --limit 1 \
            --json number \
            --jq '.[0].number' || echo "")

          BODY=$(cat <<EOF
          Daily production canary failed at ${DATE}.

          [View run](${RUN_URL})

          The \`@canary-readonly\` test asserts that the three \`_e2e/canary-*\`
          URLs on \`adamdaniel.ai\` still return 200 with their baseline
          content. A failure here means one of:

          - The canary entry has drifted from its baseline (a publish-loop
            run crashed mid-flight without resetting the body).
          - \`deploy-production.yml\` has stalled and stale content is being
            served.
          - CloudFront is serving a 5xx (origin or distribution outage).
          - The \`_e2e/\` collection or its layout has been broken by a
            recent change.

          Last 50 KB of the test log (secrets are not used by this probe):

          \`\`\`
          $(cat /tmp/canary-tail.log)
          \`\`\`

          ${DIAGNOSTIC}

          This issue auto-opens from \`.github/workflows/canary-prod.yml\`.
          Close once the next scheduled run (or a manual \`workflow_dispatch\`)
          is green.
          EOF
          )

          if [ -n "$EXISTING" ]; then
            echo "Existing production-canary issue #${EXISTING} is open — adding a comment."
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create \
              --title "Production canary failed (${DATE})" \
              --label production-canary \
              --body "$BODY"
          fi
