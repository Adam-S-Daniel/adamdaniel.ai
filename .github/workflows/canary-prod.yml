# Thin caller — copied into a site repo as
# `.github/workflows/canary-prod.yml`. Owns the schedule + dispatch
# trigger + run-name; delegates the read-only prod canary probe to the
# platform's reusable workflow. Keep `platform_ref` equal to the
# `@<sha>` pin on the `uses:` line.
name: Production Canary
run-name: >-
  ${{ github.event_name == 'schedule'
        && format('scheduled — {0}', github.event.schedule)
   || format('manual — @{0}', github.actor) }}

on:
  schedule:
    # 10:00 UTC daily — tune per site. Keep clear of any prod-mutating
    # loop crons so the probes don't share prod state: the daily schedule
    # map is 04 sweep, 06 Mon dev-hooks/skills, 07 Mon platform-bump,
    # 07 Sun secrets, 10 THIS canary, 11 cleanup, 12 host-loop (prod-mutating),
    # 13 label-audit, 14 publish-scheduled, 15 media-roundtrip (prod-mutating).
    # This was previously 0 12 * * * — an exact collision with
    # cms-publish-loop-host.yml's prod-mutating cron; 10:00 UTC is free.
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    uses: Adam-S-Daniel/cms-platform/.github/workflows/canary-prod.yml@v0.1.82
    with:
      prod_url: https://adamdaniel.ai
      apex: adamdaniel.ai
      platform_ref: v0.1.82
