# Thin caller — copied into a site repo as
# `.github/workflows/cms-publish-loop-host.yml`. Owns the schedule / push
# triggers + run-name; delegates the host-repo canary publish loop to the
# platform's reusable workflow. The e2e harness + the cms-recursion-gate /
# await-prod-deploy / post-failure-comment composites all live in the
# platform repo. Keep `platform_ref` equal to the `@<sha>` pin on the
# `uses:` line.
#
# Site identity (CMS_PROD_URL / CMS_APEX) is read from THIS repo's VARS by
# the reusable workflow.
name: CMS Publish Loop — Host Repo (canary collection)
run-name: >-
  ${{ github.event_name == 'schedule'
        && format('scheduled — {0}', github.event.schedule)
   || github.event_name == 'push'
        && format('push — {0} @{1}', github.ref_name, github.actor)
   || format('manual — @{0}', github.actor) }}

on:
  schedule:
    # 12:00 UTC daily. All real-prod loops serialize through the shared
    # `prod-mutating-loop` concurrency group declared on each loop's
    # heavy job, so mutual exclusion is structural, not time-based.
    - cron: '0 12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    # Trigger ONLY on this loop's own surfaces (the host workflow + the canary
    # collection fixtures/layouts). The shared infra paths (admin/**,
    # playwright.config.js, package*.json, _config.yml) were REMOVED because
    # cms-publish-loop-prod.yml triggers on those same paths — a single push
    # fired BOTH loops, which then co-arrived in the shared `prod-mutating-loop`
    # concurrency lane and the host job EVICTED the prod-loop job
    # (cancel-in-progress:false holds the in-flight holder but drops a
    # co-arriving sibling). Prod owns the infra-change canary on push; host
    # still covers them via its daily 12:00 UTC cron. Zero path overlap = no
    # eviction.
    paths:
      - .github/workflows/cms-publish-loop-host.yml
      - _e2e/canary-post.md
      - _e2e/canary-page.md
      - _e2e/canary-project.md
      - _layouts/canary.html
      - _layouts/default.html

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  host-loop:
    uses: Adam-S-Daniel/cms-platform/.github/workflows/cms-publish-loop-host.yml@v0.1.34
    with:
      # Pin to the SAME ref as the `uses:` pin above so the harness matches.
      platform_ref: v0.1.34
    secrets:
      CMS_E2E_PAT: ${{ secrets.CMS_E2E_PAT }}
