# Thin caller — weekly skills sync from the platform. Pin platform_ref to a tag.
name: Skills sync
on:
  schedule: [{ cron: "0 6 * * 1" }]   # Mondays 06:00 UTC
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    uses: Adam-S-Daniel/cms-platform/.github/workflows/skills-sync.yml@d5cbc35117dbf6ba321ee6a06c2f90442a050c33
    with:
      platform_ref: d5cbc35117dbf6ba321ee6a06c2f90442a050c33
    secrets:
      # Optional: a PAT so the sync PR triggers CI. Omit to use GITHUB_TOKEN.
      gh_token: ${{ secrets.CMS_PLATFORM_PAT }}
