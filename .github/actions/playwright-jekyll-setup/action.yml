name: Playwright + Jekyll setup
description: |
  Per-job setup steps shared by every Playwright-running workflow:
  apt deps, Ruby + Gemfile.lock gems, optional Jekyll build, Node +
  package-lock.json. Extracted so a single edit (e.g. updating the
  ruby/setup-ruby SHA pin) flows to every consumer.

  Most consumers run inside the prebaked
  `ghcr.io/<repo>/ci-runner:<lockhash>` container, where these steps
  are NO-OPS except for `git config safe.directory` and `npm ci` (a
  ~5 s lockfile check). Until that image lands on `:latest`, or on a
  lockhash cache miss, the same steps install fresh from upstream.

  Use this in a workflow's `steps:` block — caller still owns
  `container:`, `checkout`, and any post-setup commands. We do NOT
  checkout here because some callers fetch with non-default depth.

inputs:
  jekyll:
    description: |
      "true" to also `bundle exec jekyll build --quiet` into `_site/`
      after Ruby setup. Specs that read `_site/sitemap.xml`/`feed.xml`
      (sitemap, console-clean, draft-isolation, image-alt-text) need
      this; pure-HTTP specs (preview-media-resolves, etc.) don't.
    required: false
    default: "true"
  node-version:
    description: "Node version for actions/setup-node. Default 20."
    required: false
    default: "20"
  ruby-version:
    description: "Ruby version for ruby/setup-ruby. Default 3.2."
    required: false
    default: "3.2"

runs:
  using: composite
  steps:
    - name: Mark workspace safe for git
      # actions/checkout writes the tree as the runner user; raw `git`
      # in container jobs with HOME=/root override otherwise hits
      # "detected dubious ownership" and exits non-zero. Both paths
      # cover the literal $GITHUB_WORKSPACE override + the
      # /__w/<repo>/<repo> form actions/checkout uses internally.
      shell: bash
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git config --global --add safe.directory /__w/adamdaniel.ai/adamdaniel.ai

    - name: Install Ruby toolchain prerequisites
      # libyaml-0-2 + build-essential aren't in the upstream Playwright
      # noble image. The prebaked ci-runner image carries them, so
      # `apt-get install` is a fast no-op there.
      shell: bash
      run: |
        if ! dpkg -s libyaml-0-2 build-essential >/dev/null 2>&1; then
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends libyaml-0-2 build-essential
        fi

    - name: Setup Ruby
      uses: ruby/setup-ruby@6aaa311d81eba98ae12eaffbcb63296ace0efcde  # v1.307.0 (2026-05-11)
      with:
        ruby-version: ${{ inputs.ruby-version }}
        bundler-cache: true

    - name: Build Jekyll site
      if: ${{ inputs.jekyll == 'true' }}
      shell: bash
      run: bundle exec jekyll build --quiet

    - name: Setup Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0 (2026-04-20)
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'

    - name: Install npm dependencies
      shell: bash
      run: npm ci
