[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path so `from tests.harnesses.base import ...`
# resolves under a fresh clone (no PYTHONPATH=. dance needed).
pythonpath = ["."]
addopts = "-m 'not live'"
markers = [
    "live: tests that invoke an external agent CLI (e.g. `claude -p`); skipped by default. Run with `-m live` or set SKILLS_TEST_LIVE=1.",
]
