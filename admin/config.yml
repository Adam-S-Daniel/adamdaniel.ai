# ============================================================
# Sveltia CMS Configuration
# ============================================================

backend:
  name: github
  repo: Adam-S-Daniel/adamdaniel.ai
  branch: main
  # OAuth proxy endpoint
  base_url: https://sq8d4876v8.execute-api.us-east-1.amazonaws.com
  auth_endpoint: prod/auth

# Editorial workflow: every Save opens a PR on its own branch instead of
# committing straight to main. The PR drives the draft → review → ready →
# publish pipeline (cms/draft / cms/ready labels in cms-editorial-workflow.yml,
# the per-PR preview-pr{N}.adamdaniel.ai environment, and the visual
# regression review at /admin/reviews/). Without this, Save deploys to
# production immediately and bypasses the entire review gate.
publish_mode: editorial_workflow

# Site configuration
site_url: https://adamdaniel.ai
display_url: https://adamdaniel.ai
logo_url: https://adamdaniel.ai/assets/images/logo.svg

# Custom CSS — applies the cobalt thermal theme to the CMS shell
custom_css: custom.css

# Media library
# Bucket uploads by year/month so the picker stays browsable as the archive
# grows. `public_folder` stays at the root because Jekyll serves files from
# the same path regardless of the YYYY/MM subdirectory they were uploaded into.
media_folder: "assets/images/uploads/{{year}}/{{month}}"
public_folder: /assets/images/uploads

# ============================================================
# Collections
# ============================================================
collections:

  # ── Posts ─────────────────────────────────────────────────
  #
  # Jekyll's `_posts/` collection requires filenames of the form
  # YYYY-MM-DD-<slug>.md. The live URL uses only the slug portion
  # (see `permalink: /blog/:slug/` in _config.yml) — so `preview_path`
  # must reference the same slug without the date prefix, otherwise
  # the "View on Live Site" button 404s.
  #
  - name: posts
    label: Posts
    label_singular: Post
    folder: _posts
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{fields.slug | default('{{fields.title}}') | slugify}}"
    preview_path: "/blog/{{fields.slug | default('{{fields.title}}') | slugify}}/"
    summary: "{{title}} ({{date | date('MMM D, YYYY')}}){% if publish_date %} — Scheduled{% endif %}"
    sortable_fields:
      - date
      - title
    view_filters:
      - label: Published
        field: published
        pattern: true
      - label: Drafts
        field: published
        pattern: false
    fields:
      - name: title
        label: Title
        widget: string
        required: true
        hint: "The post headline — make it compelling"

      - name: slug
        label: URL Slug
        widget: string
        required: false
        hint: "URL path segment (leave blank to auto-generate from title). Must match any existing published URL to avoid breaking inbound links."

      - name: date
        label: Date
        widget: datetime
        required: true
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm"
        format: "YYYY-MM-DD HH:mm:ss ZZ"
        default: "{{now}}"

      - name: excerpt
        label: Excerpt
        widget: text
        required: false
        hint: "A short summary shown in post listings and meta tags (≤ 160 chars recommended)"

      - name: tags
        label: Tags
        widget: list
        required: false
        hint: "Type a tag and press Enter. New tags get an auto-generated archive page (the auto_tag_pages plugin) — no need to create them up front. Add a matching entry in the Tags collection if you want to give the tag a description."

      - name: featured_image
        label: Featured Image
        widget: image
        required: false
        hint: "Displayed as the post hero image and in social sharing cards"
        media_library:
          config:
            multiple: false

      - name: published
        label: Published
        widget: boolean
        default: false
        hint: "ON = goes live on the next deploy. Leave OFF to schedule a future publish via the Publish Date below — the scheduled-posts workflow flips this toggle on when the date arrives."

      - name: publish_date
        label: Publish Date
        widget: datetime
        required: false
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm"
        format: "YYYY-MM-DD HH:mm:ss ZZ"
        hint: "Optional. Future date/time (UTC) to auto-publish this post. Only honoured when Published above is OFF — if Published is ON, the post goes live immediately and this field is ignored."

      - name: body
        label: Body
        widget: markdown
        required: true
        hint: "Full post content. Supports Markdown, images, code blocks, and embeds. For a real-layout preview that updates on every Save, open /preview/?collection=posts in a second browser tab and snap it next to the editor."
        modes:
          - rich_text
          - raw

  # ── Tags ──────────────────────────────────────────────────
  - name: tags
    label: Tags
    label_singular: Tag
    folder: _tags
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: name
    summary: "{{name}}"
    fields:
      - name: name
        label: Name
        widget: string
        required: true
        hint: "Tag label shown on posts (e.g. 'Machine Learning', 'Python')"

      - name: description
        label: Description
        widget: text
        required: false
        hint: "Optional short description shown on the tag archive page"

  # ── Projects ──────────────────────────────────────────────
  - name: projects
    label: Projects
    label_singular: Project
    folder: _projects
    create: true
    delete: true
    slug: "{{slug}}"
    preview_path: /projects/{{slug}}/
    summary: "{{title}}{% if featured %} ⭐{% endif %}"
    sortable_fields:
      - title
    view_filters:
      - label: Featured
        field: featured
        pattern: true
    fields:
      - name: title
        label: Title
        widget: string
        required: true

      - name: technology
        label: Technology / Stack
        widget: string
        required: false
        hint: "e.g. 'Python · LangChain · FastAPI' — shown as the accent label"

      - name: url_link
        label: Project URL
        widget: string
        required: false
        hint: "Live URL or GitHub repo link"
        pattern:
          - "^(https?://.*)?$"
          - "Must be a valid URL starting with http:// or https://"

      - name: featured
        label: Featured
        widget: boolean
        default: false
        hint: "Featured projects appear on the homepage"

      - name: images
        label: Images
        widget: list
        required: false
        hint: "Upload screenshots or demo images"
        field:
          name: image
          label: Image
          widget: image

      - name: description
        label: Description
        widget: markdown
        required: false
        hint: "Full project description — supports Markdown"
        modes:
          - rich_text
          - raw

  # ── Pages (file collection) ────────────────────────────────
  - name: pages
    label: Pages
    label_singular: Page
    folder: pages
    create: true
    delete: true
    slug: "{{slug}}"
    preview_path: "/pages/{{slug}}/"
    summary: "{{title}}"
    sortable_fields:
      - title
    fields:
      - name: title
        label: Title
        widget: string
        required: true
        hint: "The page heading — also used as the browser tab title"

      - name: layout
        label: Layout
        widget: hidden
        default: page

      - name: permalink
        label: Permalink
        widget: string
        required: true
        default: "/pages/"
        hint: "The URL path the page lives at. Convention is /pages/<slug>/, but you can use any path. Must start and end with a slash."
        pattern:
          - "^/.*/$"
          - "Must start and end with a slash, e.g. /pages/about/"

      - name: published
        label: Published
        widget: boolean
        default: false
        hint: "ON = page goes live on the next deploy. Leave OFF to keep it as a draft."

      - name: body
        label: Content
        widget: markdown
        required: true
        hint: "Page content. For a real-layout preview that updates on every Save, open /preview/?collection=pages in a second tab."
        modes:
          - rich_text
          - raw
