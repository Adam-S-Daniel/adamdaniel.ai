<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager — Adam Daniel</title>
  <!--
    Cobalt-thermal theme. Kill-switch: append ?notheme to the URL to
    disable this stylesheet (and the inline cobalt CSS below) so the
    Decap default theme renders. Useful when triaging a render bug
    that may be theme-induced — visit /admin/?notheme to A/B without
    redeploying.
  -->
  <link rel="stylesheet" href="custom.css" id="cobalt-theme">
  <script>
    if (new URLSearchParams(location.search).has('notheme')) {
      document.getElementById('cobalt-theme').media = 'not all';
      document.documentElement.dataset.notheme = '1';
      // The inline <style> below is parsed *after* this script runs, so
      // patch its media attr the moment it appears.
      var mo = new MutationObserver(function () {
        var s = document.getElementById('cobalt-inline-theme');
        if (s) { s.media = 'not all'; mo.disconnect(); }
      });
      mo.observe(document.documentElement, { childList: true, subtree: true });
    }
  </script>
  <style id="cobalt-inline-theme">
    /*
     * Cobalt Thermal theme injected before Decap CMS loads.
     * Design tokens flow into the CMS app via CSS variables.
     * Disabled by the ?notheme kill-switch above.
     */

    /* Force dark mode globally */
    :root {
      color-scheme: dark;

      /* Design tokens — overlap with Decap's variable names */
      --primary-color: #285aff;
      --primary-color-dark: #1a3abf;
      --primary-color-light: rgba(40, 90, 255, 0.15);

      /* Background stack */
      --bg-page: #04060f;
      --bg-surface: #060d1f;
      --bg-elevated: #0a1530;
      --bg-overlay: #111e40;

      /* Text */
      --text-primary: #d8e4ff;
      --text-secondary: #c8d4f0;
      --text-muted: #8ab0e8;

      /* Borders */
      --border-subtle: #1a2a5e;
      --border-default: #2a3a7e;

      /* Accent */
      --accent: #285aff;
      --accent-glow: rgba(40, 90, 255, 0.28);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #04060f;
      animation: thermal 40s ease-in-out infinite alternate;
    }

    @keyframes thermal {
      0%   { background-color: #04060f; }
      50%  { background-color: #060d1f; }
      100% { background-color: #03040c; }
    }

    /* Ambient glow behind the CMS frame */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 70% 50% at 50% 20%, rgba(40,90,255,0.18), transparent 70%);
      animation: warmth 8s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes warmth {
      0%   { opacity: 0.05; transform: scale(0.7); }
      100% { opacity: 0.5;  transform: scale(1.3); }
    }

    /* The Decap CMS app root sits above the ambient layer */
    #nc-root,
    [class*="nc-app"],
    [id^="cms"],
    .cms-wrapper {
      position: relative;
      z-index: 1;
    }

    /* ── Loading screen ──────────────────────────── */
    #cms-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #04060f;
      z-index: 9999;
      gap: 1.5rem;
      transition: opacity 0.4s ease;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }

    #cms-loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .cms-loading-name {
      font-size: 1.8rem;
      font-weight: 200;
      letter-spacing: 0.08em;
      color: #d8e4ff;
    }

    .cms-loading-sub {
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-family: 'SF Mono', 'Fira Code', monospace;
      color: #8ab0e8;
      animation: text-pulse 2s ease-in-out infinite;
    }

    @keyframes text-pulse {
      0%, 100% { opacity: 0.5; }
      50%       { opacity: 1; }
    }

    .cms-loading-bar {
      width: 200px;
      height: 1px;
      background: #1a2a5e;
      border-radius: 1px;
      overflow: hidden;
    }

    .cms-loading-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, transparent, #285aff, transparent);
      animation: scan 1.8s ease-in-out infinite;
    }

    @keyframes scan {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(300%); }
    }

    #reviews-link {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 10000;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1rem;
      background: #0a1530;
      border: 1px solid #1a2a5e;
      border-radius: 8px;
      color: #c8d4f0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.8rem;
      text-decoration: none;
      transition: border-color 0.2s, background 0.2s;
    }
    #reviews-link:hover {
      border-color: #285aff;
      background: #111e40;
    }
    #reviews-link svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <!-- Custom loading screen shown while Decap CMS initialises -->
  <div id="cms-loading">
    <div class="cms-loading-name">Adam Daniel</div>
    <div class="cms-loading-bar"><div class="cms-loading-bar-fill"></div></div>
    <div class="cms-loading-sub">Content Manager</div>
  </div>

  <a id="reviews-link" href="/admin/reviews/" title="Visual regression reviews">
    <svg viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/></svg>
    Reviews
  </a>

  <!--
    Decap CMS — pinned to a major version. Editorial workflow + the
    GitHub backend with our custom OAuth proxy (`base_url` +
    `auth_endpoint` in admin/config.yml) drive the cms/<branch> →
    PR → preview → merge pipeline documented in AGENTS.md.
  -->
  <script src="https://unpkg.com/decap-cms@^3.12.0/dist/decap-cms.js"></script>

  <!-- Live Preview bridge: broadcasts entry data on every save to any
       open /preview/ tab. Loads after Decap so `window.CMS` exists. -->
  <script src="preview-bridge.js" defer></script>

  <script>
    // Hide the loading overlay once Decap CMS fires its ready event
    document.addEventListener('DOMContentLoaded', function () {
      var loading = document.getElementById('cms-loading');

      // Decap renders its app root into the body; watch for the
      // first child element to appear and fade out the splash.
      var observer = new MutationObserver(function (mutations) {
        for (var m of mutations) {
          for (var node of m.addedNodes) {
            if (node.nodeType === 1) {
              loading.classList.add('hidden');
              setTimeout(function () { loading.remove(); }, 500);
              observer.disconnect();
              return;
            }
          }
        }
      });

      observer.observe(document.body, { childList: true });

      // Fallback: remove after 6 seconds regardless
      setTimeout(function () {
        loading.classList.add('hidden');
        setTimeout(function () { loading.remove(); }, 500);
      }, 6000);
    });
  </script>

</body>
</html>
