# RuboCop configuration for this repo's (minimal) Ruby surface. The Jekyll
# plugins are now gem-delivered by cms-platform, so neither _plugins/ nor a
# local Ruby test harness lives here anymore; this config simply keeps any
# incidental Ruby in the repo to the project's house style, and excludes the
# generated _site/, vendored gems, and node_modules outright.
#
# RuboCop is run standalone (NOT bundle exec) — it's deliberately kept out of
# the site Gemfile; see AGENTS.md → "Code quality".

plugins:
  - rubocop-performance

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  Exclude:
    - 'vendor/**/*'
    - 'node_modules/**/*'
    - '_site/**/*'
    - '.bundle/**/*'

# ── Layout ───────────────────────────────────────────────────────────────
# 100-column house style, matching Prettier (`printWidth: 100`) and Ruff
# (`line-length = 100`). RuboCop already exempts un-splittable long lines
# (URLs, long string literals) by default. See AGENTS.md → "Code quality".
Layout/LineLength:
  Max: 100

# ── Style ────────────────────────────────────────────────────────────────

# The existing code uses dangling trailing commas on multiline literals so
# diffs that add an element touch one line, not two. Enforce that idiom
# consistently rather than RuboCop's default of forbidding them.
Style/TrailingCommaInArguments:
  EnforcedStyleForMultiline: consistent_comma
Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: consistent_comma
Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: consistent_comma

# A duplicate per-class doc comment would be noise, so don't require one.
Style/Documentation:
  Enabled: false

# ── Metrics ────────────────────────────────────────────────────────────────
# Keep these cops on as guardrails, but with limits a little above RuboCop's
# defaults so they fit this project's idioms rather than forcing churn on
# working code.
Metrics/MethodLength:
  Max: 25
Metrics/AbcSize:
  Max: 25
Metrics/CyclomaticComplexity:
  Max: 9
Metrics/PerceivedComplexity:
  Max: 9
